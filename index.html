<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>SFFU App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      overscroll-behavior: none;
      color: #f5f5f5;
    }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- ─── Auth Overlay ─── -->
  <div id="auth-overlay" style="
    position:fixed;inset:0;z-index:9999;background:#1a1a1a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;">

    <div id="auth-signin" style="display:flex;flex-direction:column;align-items:center;padding:0 48px;width:100%;">
      <div style="font-size:2.4rem;font-weight:800;color:#c9a84c;margin-bottom:4px;letter-spacing:0.08em;">SFFU</div>
      <div style="font-size:0.75rem;font-weight:600;color:#888;margin-bottom:6px;letter-spacing:0.15em;text-transform:uppercase;">Showing Feedback Follow Up</div>
      <div style="font-size:0.8rem;color:#555;margin-bottom:52px;">The Morshed Group</div>
      <button onclick="SupabaseAuth.signInWithGoogle()" style="display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:500;color:#3c4043;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,0.5);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
    </div>

    <div id="auth-rejected" style="display:none;flex-direction:column;align-items:center;text-align:center;padding:0 32px;">
      <div style="font-size:2.4rem;font-weight:800;color:#c9a84c;margin-bottom:4px;letter-spacing:0.08em;">SFFU</div>
      <div style="font-size:0.75rem;color:#888;margin-bottom:48px;letter-spacing:0.15em;text-transform:uppercase;">Showing Feedback Follow Up</div>
      <div style="width:52px;height:52px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
        <svg width="26" height="26" fill="none" stroke="#e05252" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div style="font-size:1.1rem;font-weight:600;color:#fff;margin-bottom:8px;">Access denied</div>
      <div style="font-size:0.9rem;color:#888;margin-bottom:32px;line-height:1.6;">Your account doesn't have access.<br/>Contact Symon to be added.</div>
      <button onclick="SupabaseAuth.signOut()" style="background:none;border:1px solid #333;border-radius:10px;padding:10px 20px;font-size:14px;color:#888;cursor:pointer;font-family:-apple-system,sans-serif;">Sign out</button>
    </div>
  </div>

  <div id="root"></div>

  <!-- ─── Dev localhost mock ─── -->
  <script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
    window.SupabaseAuth = {
      _state: { session: { user: { id: 'dev-user-id', email: 'symon@morshedgroup.com', user_metadata: { full_name: 'Symon', avatar_url: '' } }, access_token: 'dev-token' } },
      signInWithGoogle: function() {},
      signOut: function() { location.reload(); },
      getSession: function() { return Promise.resolve(window.SupabaseAuth._state.session); },
      onAuthStateChange: function(cb) { setTimeout(function() { cb({ session: window.SupabaseAuth._state.session }); }, 50); }
    };
  }
  </script>

  <!-- ─── React App ─── -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Design tokens ───────────────────────────────────────────────
    const C = {
      bg:           '#1a1a1a',
      surface:      '#242424',
      surfaceHover: '#2a2a2a',
      border:       '#2e2e2e',
      gold:         '#c9a84c',
      goldLight:    '#e2c97e',
      textPrimary:  '#f5f5f5',
      textSecondary:'#888888',
      textMuted:    '#555555',
      red:          '#e05252',
      green:        '#4caf7d',
      amber:        '#f0a500',
      navBg:        '#141414',
    };

    // ─── Status config ───────────────────────────────────────────────
    const STATUS = {
      open:              { label: 'Open',         color: '#888',    dot: '#666',    bg: '#242424' },
      in_progress:       { label: 'In Progress',  color: '#f0a500', dot: '#f0a500', bg: '#2a2000' },
      feedback_received: { label: 'Feedback ✓',   color: '#4caf7d', dot: '#4caf7d', bg: '#0a2218' },
      closed:            { label: 'Closed',        color: '#555',    dot: '#444',    bg: '#202020' },
    };

    // ─── Sample Data ─────────────────────────────────────────────────
    const PROPERTIES = [
      { id: 'p1', address: '1808 Forest Hill Dr', city: 'Austin, TX 78745', mls: '5129346',  agent: 'Tarek Morshed' },
      { id: 'p2', address: '2310 Kinney Rd',      city: 'Austin, TX 78704', mls: '4892011',  agent: 'Tarek Morshed' },
      { id: 'p3', address: '4502 Rocking Chair Ln', city: 'Austin, TX 78749', mls: '5034782', agent: 'Tarek Morshed' },
    ];

    const SHOWINGS = [
      // 1808 Forest Hill Dr — 5 showings
      { id: 's1',  pid: 'p1', agent: 'Kyle Baird',       phone: '(832) 545-5593', office: 'Christies Intl Real Estate', date: 'May 27, 12:10 PM', status: 'feedback_received' },
      { id: 's2',  pid: 'p1', agent: 'Raymond Torres',   phone: '(512) 297-5133', office: 'Compass RE Texas LLC',        date: 'May 21, 1:21 PM',  status: 'in_progress'       },
      { id: 's3',  pid: 'p1', agent: 'Katie Jackson',    phone: '(512) 627-1625', office: 'Christies Intl Real Estate', date: 'May 20, 10:53 AM', status: 'in_progress'       },
      { id: 's4',  pid: 'p1', agent: 'Jennifer Shahry',  phone: '(512) 636-0834', office: 'Compass RE Texas LLC',        date: 'Apr 14, 3:57 PM',  status: 'closed'            },
      { id: 's5',  pid: 'p1', agent: 'Amir Lancaster',   phone: '(817) 683-8942', office: 'Compass RE Texas LLC',        date: 'Apr 11, 3:12 PM',  status: 'open'              },
      // 2310 Kinney Rd — 3 showings
      { id: 's6',  pid: 'p2', agent: 'Sarah Mitchell',   phone: '(512) 449-8821', office: "Kuper Sotheby's Intl Realty", date: 'May 26, 2:30 PM',  status: 'feedback_received' },
      { id: 's7',  pid: 'p2', agent: 'David Okafor',     phone: '(512) 555-3344', office: 'eXp Realty',                  date: 'May 25, 11:00 AM', status: 'in_progress'       },
      { id: 's8',  pid: 'p2', agent: 'Lisa Hernandez',   phone: '(210) 447-9921', office: 'Keller Williams Realty',      date: 'May 23, 4:15 PM',  status: 'open'              },
      // 4502 Rocking Chair Ln — 2 showings
      { id: 's9',  pid: 'p3', agent: 'Michael Chang',    phone: '(512) 882-1100', office: 'Redfin',                      date: 'May 28, 10:00 AM', status: 'open'              },
      { id: 's10', pid: 'p3', agent: 'Patricia Williams', phone: '(737) 206-5583', office: 'Coldwell Banker Realty',     date: 'May 27, 3:45 PM',  status: 'open'              },
    ];

    const SMS_THREADS = {
      s1: [
        { dir: 'out', touch: 1, time: 'May 28 · 10:02 AM', body: "Hi Kyle! This is Tarek with The Morshed Group. Just following up on your showing at 1808 Forest Hill Dr yesterday — did your clients enjoy the property? Any feedback would be appreciated! 🏡" },
        { dir: 'in',            time: 'May 28 · 11:34 AM', body: "Hi Tarek! Yes they really liked it. Good size, loved the backyard. They are a bit concerned about the price relative to the kitchen update that's needed. Going to think it over for a few days." },
      ],
      s2: [
        { dir: 'out', touch: 1, time: 'May 22 · 10:01 AM', body: "Hi Raymond! This is Tarek with The Morshed Group. Following up on your showing at 1808 Forest Hill Dr on May 21 — how did your clients feel about the property?" },
        { dir: 'out', touch: 2, time: 'May 24 · 10:00 AM', body: "Hi Raymond, just checking back in on 1808 Forest Hill Dr — did your clients have any thoughts they'd like to share? Happy to answer any questions too!" },
      ],
      s3: [
        { dir: 'out', touch: 1, time: 'May 21 · 10:01 AM', body: "Hi Katie! Tarek here from The Morshed Group. Just following up on your showing at 1808 Forest Hill Dr on May 20 — how did it go with your clients?" },
      ],
      s4: [
        { dir: 'out', touch: 1, time: 'Apr 15 · 10:00 AM', body: "Hi Jennifer! This is Tarek with The Morshed Group. Following up on your showing at 1808 Forest Hill Dr — did your clients have any feedback on the property?" },
        { dir: 'out', touch: 2, time: 'Apr 17 · 10:00 AM', body: "Hi Jennifer, one more follow-up on 1808 Forest Hill Dr — any thoughts from your clients? No worries if the timing isn't right." },
        { dir: 'out', touch: 3, time: 'Apr 19 · 10:00 AM', body: "Hi Jennifer, last check-in on 1808 Forest Hill Dr. Feel free to reach out anytime if your clients have questions. Thanks!" },
      ],
      s6: [
        { dir: 'out', touch: 1, time: 'May 27 · 10:00 AM', body: "Hi Sarah! This is Tarek with The Morshed Group. Following up on your showing at 2310 Kinney Rd yesterday — did your clients have any feedback on the property?" },
        { dir: 'in',            time: 'May 27 · 12:15 PM', body: "They absolutely loved it, very interested! Can you send over the seller's disclosures? They're seriously considering making an offer this week." },
      ],
      s7: [
        { dir: 'out', touch: 1, time: 'May 26 · 10:00 AM', body: "Hi David! This is Tarek with The Morshed Group. Following up on your showing at 2310 Kinney Rd on May 25 — how did your clients like it?" },
      ],
    };

    // ─── Helpers ─────────────────────────────────────────────────────
    function getShowings(pid)  { return SHOWINGS.filter(s => s.pid === pid); }
    function getProperty(pid)  { return PROPERTIES.find(p => p.id === pid); }
    function getThread(sid)    { return SMS_THREADS[sid] || []; }

    // ─── Icons ───────────────────────────────────────────────────────
    const Icon = {
      Grid: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      ),
      Kanban: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="3" width="5" height="18" rx="1.5"/>
          <rect x="9.5" y="3" width="5" height="13" rx="1.5"/>
          <rect x="16" y="3" width="5" height="16" rx="1.5"/>
        </svg>
      ),
      Gear: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      ),
      Menu:   ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      ),
      X:      ({ size=20, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      ),
      Plus:   ({ size=20, color=C.gold }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      ),
      Upload: ({ size=20, color=C.gold }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
      ),
      Chevron: ({ size=16, color=C.textSecondary, down=true }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: down ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform 0.2s' }}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      ),
      Msg: ({ size=14, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
    };

    // ─── Status Badge ─────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const { label, color, bg } = STATUS[status] || STATUS.open;
      return (
        <span style={{
          fontSize: '0.68rem', fontWeight: 600, color,
          background: bg, border: `1px solid ${color}33`,
          borderRadius: 20, padding: '3px 9px', whiteSpace: 'nowrap',
        }}>
          {label}
        </span>
      );
    }

    // ─── SMS Thread ───────────────────────────────────────────────────
    function SmsThread({ sid }) {
      const thread = getThread(sid);
      if (!thread.length) return (
        <div style={{ padding: '12px 0 4px', textAlign: 'center', color: C.textMuted, fontSize: '0.8rem' }}>
          No messages yet
        </div>
      );
      return (
        <div style={{ paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {thread.map((msg, i) => {
            const isOut = msg.dir === 'out';
            return (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: isOut ? 'flex-end' : 'flex-start' }}>
                <div style={{ fontSize: '0.65rem', color: isOut ? C.gold : C.green, marginBottom: 3, paddingLeft: isOut ? 0 : 2, paddingRight: isOut ? 2 : 0 }}>
                  {isOut ? `Day ${msg.touch} · ${msg.time}` : `Reply · ${msg.time}`}
                </div>
                <div style={{
                  maxWidth: '88%',
                  background: isOut ? 'rgba(201,168,76,0.1)' : C.surfaceHover,
                  border: `1px solid ${isOut ? 'rgba(201,168,76,0.25)' : C.border}`,
                  borderRadius: isOut ? '12px 12px 4px 12px' : '12px 12px 12px 4px',
                  padding: '8px 12px',
                  fontSize: '0.83rem', color: C.textPrimary, lineHeight: 1.5,
                }}>
                  {msg.body}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Showing Card (Board) ─────────────────────────────────────────
    function ShowingCard({ showing }) {
      const [expanded, setExpanded] = useState(false);
      const prop    = getProperty(showing.pid);
      const thread  = getThread(showing.id);
      const lastOut = [...thread].reverse().find(m => m.dir === 'out');

      return (
        <div style={{
          background: C.surface, border: `1px solid ${C.border}`,
          borderRadius: 14, overflow: 'hidden', marginBottom: 10,
        }}>
          {/* Card header — tap to expand */}
          <div
            onClick={() => setExpanded(e => !e)}
            style={{ padding: '14px 16px', cursor: 'pointer' }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: '0.93rem', color: C.textPrimary, marginBottom: 2 }}>
                  {showing.agent}
                </div>
                <div style={{ fontSize: '0.78rem', color: C.textSecondary }}>{showing.phone}</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginLeft: 10, flexShrink: 0 }}>
                <StatusBadge status={showing.status} />
                <Icon.Chevron size={14} color={C.textSecondary} down={expanded} />
              </div>
            </div>

            <div style={{ fontSize: '0.78rem', color: C.textSecondary, marginBottom: 4 }}>
              📍 {prop?.address} · {showing.date}
            </div>

            {/* Thread summary */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6 }}>
              <Icon.Msg size={13} color={C.textMuted} />
              {thread.length === 0 && (
                <span style={{ fontSize: '0.74rem', color: C.textMuted }}>No messages sent yet</span>
              )}
              {thread.length > 0 && (
                <span style={{ fontSize: '0.74rem', color: C.textMuted }}>
                  {lastOut ? `Day ${lastOut.touch} sent · ${lastOut.time}` : ''}
                  {thread.some(m => m.dir === 'in') ? ' · Reply received' : ''}
                </span>
              )}
            </div>
          </div>

          {/* Expanded thread */}
          {expanded && (
            <div style={{
              borderTop: `1px solid ${C.border}`,
              padding: '0 16px 14px',
              background: C.bg,
            }}>
              <SmsThread sid={showing.id} />
            </div>
          )}
        </div>
      );
    }

    // ─── Property Card (Overview) ─────────────────────────────────────
    function PropertyCard({ property }) {
      const [expanded, setExpanded] = useState(false);
      const showings  = getShowings(property.id);
      const feedback  = showings.filter(s => s.status === 'feedback_received').length;
      const pending   = showings.filter(s => s.status === 'open' || s.status === 'in_progress').length;
      const closed    = showings.filter(s => s.status === 'closed').length;

      return (
        <div style={{
          background: C.surface, border: `1px solid ${C.border}`,
          borderRadius: 14, overflow: 'hidden', marginBottom: 12,
        }}>
          {/* Property header */}
          <div
            onClick={() => setExpanded(e => !e)}
            style={{ padding: '16px', cursor: 'pointer' }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: '0.97rem', color: C.textPrimary, marginBottom: 2 }}>
                  {property.address}
                </div>
                <div style={{ fontSize: '0.78rem', color: C.textSecondary, marginBottom: 10 }}>
                  {property.city} · MLS# {property.mls}
                </div>
              </div>
              <Icon.Chevron size={15} color={C.textSecondary} down={expanded} />
            </div>

            {/* Stats row */}
            <div style={{ display: 'flex', gap: 8 }}>
              <StatChip value={showings.length} label="Showings"  color={C.gold} />
              <StatChip value={feedback}        label="Feedback"  color={C.green} />
              <StatChip value={pending}         label="Pending"   color={C.amber} />
              {closed > 0 && <StatChip value={closed} label="Closed" color={C.textMuted} />}
            </div>
          </div>

          {/* Expanded showing list */}
          {expanded && (
            <div style={{ borderTop: `1px solid ${C.border}` }}>
              {showings.map(s => (
                <ShowingRow key={s.id} showing={s} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function StatChip({ value, label, color }) {
      return (
        <div style={{
          flex: 1, textAlign: 'center',
          background: C.surfaceHover, border: `1px solid ${C.border}`,
          borderRadius: 10, padding: '7px 4px',
        }}>
          <div style={{ fontSize: '1.1rem', fontWeight: 700, color }}>{value}</div>
          <div style={{ fontSize: '0.62rem', color: C.textSecondary, textTransform: 'uppercase', letterSpacing: '0.05em', marginTop: 1 }}>{label}</div>
        </div>
      );
    }

    function ShowingRow({ showing }) {
      const [expanded, setExpanded] = useState(false);
      const thread = getThread(showing.id);
      return (
        <div style={{ borderBottom: `1px solid ${C.border}` }}>
          <div
            onClick={() => setExpanded(e => !e)}
            style={{ display: 'flex', alignItems: 'center', padding: '12px 16px', cursor: 'pointer', gap: 12 }}
          >
            {/* Status dot */}
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: STATUS[showing.status]?.dot || '#666', flexShrink: 0 }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '0.88rem', fontWeight: 500, color: C.textPrimary }}>{showing.agent}</div>
              <div style={{ fontSize: '0.75rem', color: C.textSecondary }}>{showing.date}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
              {thread.length > 0 && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                  <Icon.Msg size={12} color={C.textMuted} />
                  <span style={{ fontSize: '0.7rem', color: C.textMuted }}>{thread.length}</span>
                </div>
              )}
              <StatusBadge status={showing.status} />
              <Icon.Chevron size={13} color={C.textSecondary} down={expanded} />
            </div>
          </div>
          {expanded && (
            <div style={{ background: C.bg, borderTop: `1px solid ${C.border}`, padding: '4px 16px 14px' }}>
              <div style={{ fontSize: '0.75rem', color: C.textSecondary, marginTop: 8, marginBottom: 4 }}>
                {showing.phone} · {showing.office}
              </div>
              <SmsThread sid={showing.id} />
            </div>
          )}
        </div>
      );
    }

    // ─── Overview Tab ─────────────────────────────────────────────────
    function OverviewTab({ user }) {
      const firstName = user?.user_metadata?.full_name?.split(' ')[0] || user?.email?.split('@')[0] || 'there';

      const totalShowings  = SHOWINGS.length;
      const totalFeedback  = SHOWINGS.filter(s => s.status === 'feedback_received').length;
      const totalPending   = SHOWINGS.filter(s => s.status === 'open' || s.status === 'in_progress').length;

      return (
        <div style={{ padding: '20px 16px 100px' }}>
          {/* Greeting */}
          <div style={{ marginBottom: 24 }}>
            <div style={{ fontSize: '1.6rem', fontWeight: 700, color: C.textPrimary }}>Hi, {firstName}</div>
            <div style={{ fontSize: '0.82rem', color: C.textSecondary, marginTop: 4 }}>Showing Feedback Follow Up</div>
          </div>

          {/* Summary row */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 28 }}>
            {[
              { label: 'Showings',  value: totalShowings,  color: C.gold  },
              { label: 'Pending',   value: totalPending,   color: C.amber },
              { label: 'Feedback',  value: totalFeedback,  color: C.green },
            ].map(({ label, value, color }) => (
              <div key={label} style={{
                flex: 1, background: C.surface, border: `1px solid ${C.border}`,
                borderRadius: 12, padding: '14px 8px', textAlign: 'center',
              }}>
                <div style={{ fontSize: '1.5rem', fontWeight: 700, color }}>{value}</div>
                <div style={{ fontSize: '0.66rem', color: C.textSecondary, marginTop: 3, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</div>
              </div>
            ))}
          </div>

          {/* Properties */}
          <div style={{ fontSize: '0.68rem', fontWeight: 700, color: C.textSecondary, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 12 }}>
            Properties · {PROPERTIES.length}
          </div>
          {PROPERTIES.map(p => <PropertyCard key={p.id} property={p} />)}
        </div>
      );
    }

    // ─── Board Tab ────────────────────────────────────────────────────
    const BOARD_FILTERS = [
      { id: 'all',              label: 'All'         },
      { id: 'open',             label: 'Open'        },
      { id: 'in_progress',      label: 'In Progress' },
      { id: 'feedback_received',label: 'Feedback'    },
      { id: 'closed',           label: 'Closed'      },
    ];

    function BoardTab() {
      const [filter, setFilter] = useState('all');

      const counts = {
        all:              SHOWINGS.length,
        open:             SHOWINGS.filter(s => s.status === 'open').length,
        in_progress:      SHOWINGS.filter(s => s.status === 'in_progress').length,
        feedback_received:SHOWINGS.filter(s => s.status === 'feedback_received').length,
        closed:           SHOWINGS.filter(s => s.status === 'closed').length,
      };

      const visible = filter === 'all' ? SHOWINGS : SHOWINGS.filter(s => s.status === filter);

      return (
        <div style={{ padding: '20px 16px 100px' }}>
          <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.textPrimary, marginBottom: 16 }}>Board</div>

          {/* Filter pills — horizontal scroll */}
          <div style={{ display: 'flex', gap: 7, overflowX: 'auto', paddingBottom: 6, marginBottom: 18 }}>
            {BOARD_FILTERS.map(({ id, label }) => {
              const active = filter === id;
              const st = STATUS[id];
              return (
                <button key={id} onClick={() => setFilter(id)} style={{
                  flexShrink: 0,
                  padding: '5px 13px', borderRadius: 20, fontSize: '0.8rem', fontWeight: 500,
                  background: active ? C.gold      : 'none',
                  color:      active ? '#1a1a1a'   : C.textSecondary,
                  border:     active ? 'none'      : `1px solid ${C.border}`,
                  cursor: 'pointer', fontFamily: 'inherit',
                  display: 'flex', alignItems: 'center', gap: 6,
                }}>
                  {label}
                  <span style={{
                    fontSize: '0.7rem', fontWeight: 700,
                    background: active ? 'rgba(0,0,0,0.2)' : C.border,
                    color: active ? '#1a1a1a' : C.textSecondary,
                    borderRadius: 10, padding: '0px 6px',
                  }}>
                    {counts[id]}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Showing cards */}
          {visible.map(s => <ShowingCard key={s.id} showing={s} />)}
        </div>
      );
    }

    // ─── Settings Tab ─────────────────────────────────────────────────
    const SMS_TEMPLATE_DEFAULTS = [
      { touch: 1, day: 1, body: "Hi {{agent_first_name}}! This is Tarek with The Morshed Group. Just following up on your showing at {{address}} — did your clients enjoy the property? Any feedback would be appreciated! 🏡" },
      { touch: 2, day: 3, body: "Hi {{agent_first_name}}, just checking back in on {{address}} — did your clients have any thoughts they'd like to share? Happy to answer any questions too!" },
      { touch: 3, day: 5, body: "Hi {{agent_first_name}}, last check-in on {{address}}. Feel free to reach out anytime if your clients have questions. Thanks for showing the property!" },
    ];

    function SettingsTab({ user }) {
      const fullName = user?.user_metadata?.full_name || 'User';
      const email    = user?.email || '';
      const initial  = fullName.charAt(0).toUpperCase();
      const [templates, setTemplates] = useState(SMS_TEMPLATE_DEFAULTS.map(t => t.body));

      return (
        <div style={{ padding: '20px 16px 100px', overflowY: 'auto', height: '100%' }}>
          <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.textPrimary, marginBottom: 24 }}>Settings</div>

          {/* Account */}
          <SectionCard title="Account" mb={14}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
              <div style={{ width: 44, height: 44, borderRadius: '50%', background: C.border, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.gold, fontWeight: 700, fontSize: '1.1rem', flexShrink: 0 }}>
                {initial}
              </div>
              <div>
                <div style={{ color: C.textPrimary, fontWeight: 600, fontSize: '0.95rem' }}>{fullName}</div>
                <div style={{ color: C.textSecondary, fontSize: '0.8rem', marginTop: 2 }}>{email}</div>
              </div>
            </div>
            <ActionButton label="Sign out" danger onClick={() => window.SupabaseAuth.signOut()} />
          </SectionCard>

          {/* SMS Templates */}
          <SectionCard title="SMS Follow-up Templates" mb={14}>
            <div style={{ fontSize: '0.78rem', color: C.textSecondary, marginBottom: 14, lineHeight: 1.5 }}>
              Use <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{agent_first_name}}'}</span> and <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{address}}'}</span> as placeholders.
            </div>
            {SMS_TEMPLATE_DEFAULTS.map((t, i) => (
              <div key={t.touch} style={{ marginBottom: i < 2 ? 14 : 0 }}>
                <div style={{ fontSize: '0.7rem', fontWeight: 700, color: C.gold, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 6 }}>
                  Follow-up {t.touch} · Day {t.day}
                </div>
                <textarea
                  value={templates[i]}
                  onChange={e => { const n = [...templates]; n[i] = e.target.value; setTemplates(n); }}
                  rows={3}
                  style={{
                    width: '100%', background: C.surfaceHover, border: `1px solid ${C.border}`,
                    borderRadius: 10, padding: '10px 12px', color: C.textPrimary,
                    fontSize: '0.83rem', lineHeight: 1.5, resize: 'none',
                    fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
                    outline: 'none',
                  }}
                />
              </div>
            ))}
            <div style={{ marginTop: 14 }}>
              <ActionButton label="Save Templates" onClick={() => {}} />
            </div>
          </SectionCard>

          {/* Twilio */}
          <SectionCard title="Twilio SMS">
            <div style={{ fontSize: '0.83rem', color: C.textSecondary, lineHeight: 1.6, marginBottom: 14 }}>
              SMS send configuration. Set up your Twilio account to activate automated follow-ups.
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <SettingsField label="Twilio Phone Number" placeholder="+1 (512) 000-0000" />
              <SettingsField label="Send Time (local)" placeholder="10:00 AM Central" />
            </div>
            <div style={{ marginTop: 14 }}>
              <ActionButton label="Send Test SMS" onClick={() => {}} />
            </div>
          </SectionCard>
        </div>
      );
    }

    function SectionCard({ title, children, mb = 0 }) {
      return (
        <div style={{
          background: C.surface, border: `1px solid ${C.border}`,
          borderRadius: 14, padding: 16, marginBottom: mb,
        }}>
          <div style={{ fontSize: '0.68rem', fontWeight: 700, color: C.textSecondary, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 14 }}>
            {title}
          </div>
          {children}
        </div>
      );
    }

    function ActionButton({ label, onClick, danger = false }) {
      return (
        <button onClick={onClick} style={{
          width: '100%', padding: 11, background: 'none',
          border: `1px solid ${danger ? '#3a2020' : C.border}`,
          borderRadius: 10, color: danger ? C.red : C.textPrimary,
          fontSize: '0.9rem', cursor: 'pointer',
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
        }}>
          {label}
        </button>
      );
    }

    function SettingsField({ label, placeholder }) {
      return (
        <div>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.textSecondary, marginBottom: 5 }}>{label}</div>
          <input
            placeholder={placeholder}
            style={{
              width: '100%', padding: '10px 12px', background: C.surfaceHover,
              border: `1px solid ${C.border}`, borderRadius: 10,
              color: C.textPrimary, fontSize: '0.87rem', outline: 'none',
              fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
            }}
          />
        </div>
      );
    }

    // ─── Hamburger Drawer ─────────────────────────────────────────────
    function HamburgerDrawer({ open, onClose, onAction }) {
      if (!open) return null;
      return (
        <>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 200, background: 'rgba(0,0,0,0.6)' }} />
          <div style={{
            position: 'fixed', top: 0, right: 0, bottom: 0, width: 270, zIndex: 201,
            background: C.surface, borderLeft: `1px solid ${C.border}`,
            display: 'flex', flexDirection: 'column', padding: '52px 20px 40px',
          }}>
            <button onClick={onClose} style={{ position: 'absolute', top: 16, right: 16, background: 'none', border: 'none', cursor: 'pointer', padding: 6 }}>
              <Icon.X color={C.textSecondary} />
            </button>
            <div style={{ marginBottom: 36 }}>
              <div style={{ color: C.gold, fontWeight: 800, fontSize: '1.2rem', letterSpacing: '0.08em' }}>SFFU</div>
              <div style={{ color: C.textSecondary, fontSize: '0.75rem', marginTop: 2 }}>Showing Feedback Follow Up</div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <DrawerItem icon={<Icon.Plus />}   label="Add Showing"             onClick={() => { onAction('add-showing');        onClose(); }} />
              <DrawerItem icon={<Icon.Upload />}  label="Upload Supra Screenshot"  onClick={() => { onAction('upload-screenshot'); onClose(); }} />
            </div>
            <div style={{ marginTop: 'auto' }}>
              <div style={{ height: 1, background: C.border, marginBottom: 20 }} />
              <button onClick={() => window.SupabaseAuth.signOut()} style={{
                width: '100%', padding: 11, background: 'none', border: `1px solid #3a2020`,
                borderRadius: 10, color: C.red, fontSize: '0.9rem', cursor: 'pointer',
                fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
              }}>
                Sign out
              </button>
            </div>
          </div>
        </>
      );
    }

    function DrawerItem({ icon, label, onClick }) {
      return (
        <button onClick={onClick} style={{
          display: 'flex', alignItems: 'center', gap: 12, width: '100%',
          padding: '13px 14px', background: 'none', border: `1px solid ${C.border}`,
          borderRadius: 12, color: C.textPrimary, fontSize: '0.9rem', cursor: 'pointer',
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', textAlign: 'left',
        }}>
          {icon}{label}
        </button>
      );
    }

    // ─── Bottom Nav ───────────────────────────────────────────────────
    const TABS = [
      { id: 'overview', label: 'Overview', Icon: Icon.Grid   },
      { id: 'board',    label: 'Board',    Icon: Icon.Kanban },
      { id: 'settings', label: 'Settings', Icon: Icon.Gear   },
    ];

    function BottomNav({ active, onChange }) {
      return (
        <nav style={{
          position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50,
          background: C.navBg, borderTop: `1px solid ${C.border}`,
          display: 'flex', paddingBottom: 'env(safe-area-inset-bottom)',
        }}>
          {TABS.map(({ id, label, Icon: I }) => {
            const active_ = active === id;
            const col = active_ ? C.gold : C.textSecondary;
            return (
              <button key={id} onClick={() => onChange(id)} style={{
                flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
                justifyContent: 'center', gap: 4, padding: '10px 0',
                background: 'none', border: 'none', cursor: 'pointer',
              }}>
                <I color={col} />
                <span style={{ fontSize: '0.62rem', color: col, fontWeight: active_ ? 600 : 400, letterSpacing: '0.03em', fontFamily: 'inherit' }}>
                  {label}
                </span>
              </button>
            );
          })}
        </nav>
      );
    }

    // ─── Top Bar ──────────────────────────────────────────────────────
    function TopBar({ onMenuOpen }) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '12px 16px', paddingTop: 'calc(12px + env(safe-area-inset-top))',
          background: C.bg, borderBottom: `1px solid ${C.border}`, flexShrink: 0,
        }}>
          <div style={{ fontSize: '1rem', fontWeight: 800, color: C.gold, letterSpacing: '0.1em' }}>SFFU</div>
          <button onClick={onMenuOpen} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
            <Icon.Menu color={C.textSecondary} />
          </button>
        </div>
      );
    }

    // ─── Root App ─────────────────────────────────────────────────────
    function App({ user }) {
      const [activeTab,  setActiveTab]  = useState('overview');
      const [drawerOpen, setDrawerOpen] = useState(false);

      return (
        <div style={{ height: '100%', background: C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary }}>
          <TopBar onMenuOpen={() => setDrawerOpen(true)} />
          <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {activeTab === 'overview' && <OverviewTab user={user} />}
            {activeTab === 'board'    && <BoardTab />}
            {activeTab === 'settings' && <SettingsTab user={user} />}
          </div>
          <BottomNav active={activeTab} onChange={setActiveTab} />
          <HamburgerDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} onAction={a => console.log('action:', a)} />
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      function showSignin()   { document.getElementById('auth-signin').style.display = 'flex'; document.getElementById('auth-rejected').style.display = 'none'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function showRejected() { document.getElementById('auth-signin').style.display = 'none'; document.getElementById('auth-rejected').style.display = 'flex'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(function({ session }) {
        if (!session) { showSignin(); return; }
        root.render(<App user={session.user} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
