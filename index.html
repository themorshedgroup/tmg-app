    // ─── Calendar Popover ────────────────────────────────────────────
    function CalendarPopover({ dark, onClose }) {
      const J = "'Jost', sans-serif";
      const today = new Date();
      const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const mondayOf = (d) => { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0); return x; };
      const [weekStart, setWeekStart] = useState(() => mondayOf(today));
      const [selected, setSelected] = useState(() => iso(today));
      const [vis, setVis] = useState(false);
      useEffect(() => { const r = requestAnimationFrame(() => setVis(true)); return () => cancelAnimationFrame(r); }, []);

      const days = [];
      for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); days.push(d); }
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const monthLabel = days[3].toLocaleString('en-US', { month: 'long', year: 'numeric' });
      const navWeek = (dir) => setWeekStart(prev => { const x = new Date(prev); x.setDate(prev.getDate() + dir * 7); return x; });

      const [eventsByDay, setEventsByDay] = useState({});
      const [calState, setCalState] = useState('loading'); // loading | ready | needs_connect | error
      const [calDetail, setCalDetail] = useState('');
      const fmtTime = (s) => { try { return new Date(s).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
      const colorFor = (id) => ({ '1': '#3B82C4', '2': '#0F6E56', '5': '#AD832F', '6': '#C2562B', '11': '#9A3B3B' }[id] || (dark ? '#C9A45A' : '#AD832F'));
      useEffect(() => {
        let cancelled = false;
        setCalState('loading');
        const tMin = new Date(weekStart);
        const tMax = new Date(weekStart); tMax.setDate(tMax.getDate() + 7);
        fetchGoogleEvents(tMin.toISOString(), tMax.toISOString())
          .then(list => {
            if (cancelled) return;
            const map = {};
            (list || []).forEach(e => {
              const key = e.allDay ? (e.start || '').slice(0, 10) : iso(new Date(e.start));
              if (!key) return;
              const time = e.allDay ? 'All day' : (fmtTime(e.start) + (e.end ? ' – ' + fmtTime(e.end) : ''));
              (map[key] = map[key] || []).push({ c: colorFor(e.colorId), t: e.title, time });
            });
            setEventsByDay(map);
            setCalState('ready');
          })
          .catch(err => { if (!cancelled) { setCalState(err.code === 'needs_connect' ? 'needs_connect' : 'error'); setCalDetail(err.detail || ''); } });
        return () => { cancelled = true; };
      }, [weekStart]);
      const events = eventsByDay[selected] || [];

      const chevCol = dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9';
      const dotCol = dark ? '#C9A45A' : '#AD832F';

      return (
        <React.Fragment>
          {/* Overlay — dims content only, sits below the top bar / pill nav */}
          <div onClick={onClose} style={{ position: 'fixed', top: 'calc(54px + env(safe-area-inset-top))', left: 0, right: 0, bottom: 0, zIndex: 40, background: dark ? 'rgba(0,0,0,0.3)' : 'rgba(0,26,74,0.08)' }} />
          {/* Popout */}
          <div onClick={(e) => e.stopPropagation()} style={{
            position: 'fixed', top: 'calc(54px + env(safe-area-inset-top))', right: 10, width: '75%', zIndex: 60,
            borderRadius: 14, overflow: 'hidden', boxShadow: '0 8px 32px rgba(0,0,0,0.18)',
            background: dark ? '#0A1730' : '#FFFFFF', border: `1px solid ${dark ? '#152545' : '#E4DFD4'}`,
            opacity: vis ? 1 : 0, transition: 'opacity 150ms ease',
          }}>
            {/* Header */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px 6px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <i className="ti ti-chevron-left" onClick={() => navWeek(-1)} style={{ fontSize: 13, cursor: 'pointer', color: chevCol }} />
                <span style={{ fontFamily: J, fontSize: 12, fontWeight: 600, letterSpacing: '0.04em', color: dark ? '#fff' : '#001A4A' }}>{monthLabel}</span>
                <i className="ti ti-chevron-right" onClick={() => navWeek(1)} style={{ fontSize: 13, cursor: 'pointer', color: chevCol }} />
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <i className="ti ti-search" style={{ fontSize: 13, color: dark ? 'rgba(255,255,255,0.3)' : '#B4B2A9' }} />
                <i className="ti ti-plus" style={{ fontSize: 13, color: dark ? '#C9A45A' : '#AD832F' }} />
              </div>
            </div>
            {/* Week strip */}
            <div style={{ borderTop: `1px solid ${dark ? '#152545' : '#F0EBE3'}`, padding: '6px 10px 8px', display: 'flex', gap: 2 }}>
              {days.map((d, i) => {
                const weekend = i >= 5;
                const isSel = iso(d) === selected;
                const hasEv = (eventsByDay[iso(d)] || []).length > 0;
                const labelCol = isSel ? (dark ? '#C9A45A' : '#AD832F') : (weekend ? (dark ? 'rgba(255,255,255,0.15)' : '#D4D0CC') : (dark ? 'rgba(255,255,255,0.3)' : '#B4B2A9'));
                const numCol = isSel ? '#fff' : (weekend ? (dark ? 'rgba(255,255,255,0.2)' : '#D4D0CC') : (dark ? 'rgba(255,255,255,0.5)' : '#6B6B6B'));
                return (
                  <div key={i} onClick={() => setSelected(iso(d))} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, cursor: 'pointer', padding: '4px 2px', borderRadius: 8, background: isSel ? (dark ? 'rgba(173,131,47,0.15)' : '#F3EBDA') : 'transparent' }}>
                    <span style={{ fontFamily: J, fontSize: 7, letterSpacing: '0.12em', fontWeight: 500, textTransform: 'uppercase', color: labelCol }}>{dayLabels[i]}</span>
                    <div style={{ width: 27, height: 27, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: J, fontSize: 13, fontWeight: 500, background: isSel ? (dark ? '#AD832F' : '#001A4A') : 'transparent', color: numCol }}>{d.getDate()}</div>
                    <div style={{ width: 4, height: 4, borderRadius: '50%', background: hasEv ? dotCol : 'transparent' }} />
                  </div>
                );
              })}
            </div>
            {/* Event list */}
            <div style={{ borderTop: `1px solid ${dark ? '#152545' : '#F0EBE3'}`, padding: '6px 12px 10px' }}>
              {calState === 'loading' ? (
                <div style={{ textAlign: 'center', fontFamily: J, fontSize: 9, padding: '12px 0', color: dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9' }}>Loading…</div>
              ) : calState === 'needs_connect' ? (
                <div style={{ textAlign: 'center', fontFamily: J, fontSize: 9, lineHeight: 1.7, padding: '12px 8px', color: dark ? 'rgba(255,255,255,0.35)' : '#9A8F7E' }}>Sign out and back in to<br />connect your Google Calendar.{calDetail && <span style={{ display: 'block', marginTop: 6, fontSize: 8, color: dark ? 'rgba(255,255,255,0.25)' : '#C4B9A6' }}>{calDetail}</span>}</div>
              ) : calState === 'error' ? (
                <div style={{ textAlign: 'center', fontFamily: J, fontSize: 9, padding: '12px 0', color: dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9' }}>Couldn't load calendar.{calDetail && <span style={{ display: 'block', marginTop: 6, fontSize: 8 }}>{calDetail}</span>}</div>
              ) : events.length === 0 ? (
                <div style={{ textAlign: 'center', fontFamily: J, fontSize: 9, padding: '12px 0', color: dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9' }}>No events</div>
              ) : events.map((e, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, padding: '6px 0', borderBottom: i === events.length - 1 ? 'none' : `1px solid ${dark ? '#152545' : '#F5F2EE'}` }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', flexShrink: 0, marginTop: 3, background: e.c }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: J, fontSize: 10, fontWeight: 500, color: dark ? '#fff' : '#001A4A' }}>{e.t}</div>
                    <div style={{ fontFamily: J, fontSize: 8, letterSpacing: '0.06em', marginTop: 1, color: dark ? 'rgba(255,255,255,0.35)' : '#B4B2A9' }}>{e.time}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ─── Chat History Drawer ─────────────────────────────────────────
    // Short timestamp like "11:42p", "Yest", "Mon", "Jun 3".
    function shortTime(iso) {
      if (!iso) return '';
      const d = new Date(iso), now = new Date();
      if (d.toDateString() === now.toDateString()) {
        let h = d.getHours(); const m = d.getMinutes();
        const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12;
        return h + ':' + String(m).padStart(2, '0') + ap;
      }
      const yest = new Date(now); yest.setDate(now.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return 'Yest';
      if (Math.floor((now - d) / 86400000) < 7) return d.toLocaleDateString('en-US', { weekday: 'short' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ─── Root App ────────────────────────────────────────────────────
    function App({ user, profile }) {
      const [activeTab, setActiveTab] = useState('chat');
      const [dark, setDark] = useState(() => localStorage.getItem('tmg-theme') === 'dark');
      const [showCalendar, setShowCalendar] = useState(false);

      // Role-based tabs: filter the nav to what this access role may see.
      const allowedIds = profile ? ROLE_TABS[profile.access] : undefined;
      const visibleTabs = Array.isArray(allowedIds) ? TABS.filter(t => allowedIds.includes(t.id)) : TABS;
      const isAdmin = !!(profile && (profile.access === 'admin' || profile.access === 'operations'));
      // "More" menu options (extensible — add future screens here).
      const moreItems = [{ id: 'settings', label: 'Settings', icon: 'ti-settings' }].concat(isAdmin ? [{ id: 'admin', label: 'Admin', icon: 'ti-shield-lock' }] : []);
      useEffect(() => {
        if (!visibleTabs.some(t => t.id === activeTab)) setActiveTab((visibleTabs[0] || { id: 'more' }).id);
      }, [profile]);

      // Chat state (lifted so the input lives in the shared bottom zone)
      const [messages, setMessages] = useState([]); // { role:'user'|'assistant', content, error? }
      const [input, setInput] = useState(() => localStorage.getItem('tmg-draft-new') || '');
      const [loading, setLoading] = useState(false);
      const [pendingAttachments, setPendingAttachments] = useState([]); // { id, file, kind, name, mediaType, size, previewUrl, textContent }
      const [mode, setMode] = useState(() => localStorage.getItem('tmg-mode') || 'ai');

      // Conversation persistence + history
      const [conversations, setConversations] = useState([]);
      const [currentConvId, setCurrentConvId] = useState(null);
      const [workRequest, setWorkRequest] = useState(null); // 'kpis' | 'listing_presentation' | null
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [historySide, setHistorySide] = useState(() => localStorage.getItem('tmg-history-side') || 'left');

      // Work Mode pills (admin-configurable)
      const [pills, setPills] = useState(null);
      const [builderOpen, setBuilderOpen] = useState(false);
      const [activePill, setActivePill] = useState(null); // { pill, kind: 'form'|'steps' }

      // "More" menu: which screen (settings | admin) + dropdown open state.
      const [moreView, setMoreView] = useState('settings');
      const [moreMenuOpen, setMoreMenuOpen] = useState(false);

      const zoneRef = useRef(null);
      const fileInputRef = useRef(null);
      const [zoneH, setZoneH] = useState(96);
      const onChat = activeTab === 'chat';

      function openFilePicker() { if (fileInputRef.current) fileInputRef.current.click(); }
      async function onSelectFiles(fileList) {
        const files = Array.from(fileList || []);
        const additions = [];
        for (const file of files) {
          if (file.size > 20 * 1024 * 1024) { alert('"' + file.name + '" is over 20 MB and was skipped.'); continue; }
          const type = file.type || '';
          let kind = null, textContent = null, previewUrl = null;
          if (type.startsWith('image/')) { kind = 'image'; previewUrl = URL.createObjectURL(file); }
          else if (type === 'application/pdf' || /\.pdf$/i.test(file.name)) { kind = 'pdf'; }
          else if (type.startsWith('text/') || /\.(txt|csv|md|json|log)$/i.test(file.name)) { kind = 'text'; textContent = await file.text(); }
          else { alert('The AI can\'t read "' + file.name + '" yet (unsupported type).'); continue; }
          additions.push({ id: crypto.randomUUID(), file, kind, name: file.name, mediaType: type, size: file.size, previewUrl, textContent });
        }
        if (additions.length) setPendingAttachments(prev => [...prev, ...additions]);
      }
      function removeAttachment(id) {
        setPendingAttachments(prev => prev.filter(a => {
          if (a.id === id && a.previewUrl) { try { URL.revokeObjectURL(a.previewUrl); } catch (e) {} }
          return a.id !== id;
        }));
      }

      const refreshConversations = () => ConvDB.loadConversations().then(setConversations);
      useEffect(() => { refreshConversations(); }, []);

      const refreshPills = () => PillDB.list().then(setPills);
      useEffect(() => { refreshPills(); }, []);
      // Effective pills: DB pills when present, else the built-in fallback; only enabled ones show.
      const effectivePills = (pills && pills.length ? pills : FALLBACK_PILLS).filter(p => p.enabled !== false);
      useEffect(() => { localStorage.setItem('tmg-history-side', historySide); }, [historySide]);

      // Per-conversation draft autosave (device-local). Key 'new' before a conversation exists.
      const draftKey = (id) => 'tmg-draft-' + (id || 'new');
      function updateInput(val) {
        setInput(val);
        try { localStorage.setItem(draftKey(currentConvId), val); } catch (e) {}
      }

      useEffect(() => {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('tmg-theme', dark ? 'dark' : 'light');
      }, [dark]);

      useEffect(() => {
        localStorage.setItem('tmg-mode', mode);
      }, [mode]);

      // Keep content padding in sync with the fixed bottom zone height.
      useEffect(() => {
        if (zoneRef.current) setZoneH(zoneRef.current.offsetHeight);
      }, [activeTab, dark, onChat, input, loading, pendingAttachments]);

      // Core send: persists the user message, gets a reply, persists it, auto-titles a new conversation.
      async function runSend(text, opts = {}) {
        const pend = opts.attachments !== undefined ? opts.attachments : pendingAttachments;
        if ((!text || !text.trim()) && (!pend || !pend.length)) return;
        if (loading) return;
        const startType = opts.type || (mode === 'work' ? 'work' : 'ai');
        const startReq  = opts.workRequest !== undefined ? opts.workRequest : workRequest;
        const isFirst = !currentConvId;

        // Optimistic user message with local previews; clear the picker immediately.
        const localAtts = (pend || []).map(a => ({ kind: a.kind, name: a.name, mediaType: a.mediaType, size: a.size, url: a.previewUrl, textContent: a.textContent }));
        const userMsg = { role: 'user', content: text || '', attachments: localAtts };
        const next = [...messages, userMsg];
        setMessages(next);
        setPendingAttachments([]);
        setLoading(true);

        let convId = currentConvId;
        try {
          if (!convId) {
            const conv = await ConvDB.createConversation({ type: startType, workRequest: startReq });
            convId = conv.id;
            setCurrentConvId(convId);
            refreshConversations();
          }
          // Upload pending files, then resolve signed URLs (needed for Claude + display).
          const uploaded = [];
          for (const a of (pend || [])) {
            let path = null;
            if (a.file) { try { path = await ConvDB.uploadAttachment(a.file, convId); } catch (e) {} }
            const url = path ? await ConvDB.signedUrl(path) : a.previewUrl;
            uploaded.push({ kind: a.kind, name: a.name, mediaType: a.mediaType, size: a.size, path, url, textContent: a.textContent });
          }
          const history = next.map((m, idx) => (idx === next.length - 1 ? { ...m, attachments: uploaded } : m));
          setMessages(history);

          await ConvDB.insertMessage(convId, 'user', text || '', uploaded);
          const apiMsgs = history.map(m => ({ role: m.role, content: toApiContent(m) }));
          const reply = await callAI(apiMsgs);
          setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
          await ConvDB.insertMessage(convId, 'assistant', reply);
          if (isFirst) {
            const seed = text || (uploaded[0] && uploaded[0].name) || 'Shared a file';
            const title = await generateTitle(seed);
            await ConvDB.updateConversation(convId, { title });
          } else {
            await ConvDB.touchConversation(convId);
          }
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', content: String(e.message || e), error: true }]);
        } finally {
          setLoading(false);
          refreshConversations();
        }
      }

      function send() {
        const text = input.trim();
        if ((!text && !pendingAttachments.length) || loading) return;
        try { localStorage.removeItem(draftKey(currentConvId)); } catch (e) {}
        setInput('');
        runSend(text);
      }

      function newChat() {
        setMessages([]);
        setCurrentConvId(null);
        setWorkRequest(null);
        setInput(localStorage.getItem('tmg-draft-new') || '');
      }

      function toggleMode() {
        setMode(m => (m === 'work' ? 'ai' : 'work'));
        newChat();
      }

      async function selectConversation(id) {
        const conv = conversations.find(c => c.id === id);
        setDrawerOpen(false);
        setCurrentConvId(id);
        setInput(localStorage.getItem(draftKey(id)) || '');
        setWorkRequest(conv?.workRequest || null);
        if (conv) setMode(conv.type === 'work' ? 'work' : 'ai');
        setActiveTab('chat');
        const msgs = await ConvDB.loadMessages(id);
        setMessages(msgs);
      }

      // Tap a work-mode pill → run its configured behavior.
      function dispatchPill(pill) {
        if (!pill) return;
        if (pill.type === 'form') { setActivePill({ pill, kind: 'form' }); return; }
        if (pill.type === 'steps') { setActivePill({ pill, kind: 'steps' }); return; }
        const text = (pill.config && pill.config.prompt) || pill.label; // prompt (default)
        runSend(text, { type: 'work' });
      }

      function startWorkRequest(key) {
        const req = WORK_REQUESTS.find(w => w.key === key);
        if (!req) return;
        setMode('work');
        setWorkRequest(key);
        setCurrentConvId(null);
        setMessages([]);
        runSend(req.label, { type: 'work', workRequest: key });
      }

      async function pinConversation(id, pinned) { await ConvDB.updateConversation(id, { pinned }); refreshConversations(); }
      async function archiveConversation(id, archived) {
        await ConvDB.updateConversation(id, { archived });
        if (id === currentConvId) newChat();
        refreshConversations();
      }
      async function renameConversation(id) {
        const conv = conversations.find(c => c.id === id);
        const title = window.prompt('Rename conversation', conv?.title || '');
        if (title && title.trim()) { await ConvDB.updateConversation(id, { title: title.trim() }); refreshConversations(); }
      }
      async function removeConversation(id) {
        if (!window.confirm('Delete this conversation permanently?')) return;
        await ConvDB.deleteConversation(id);
        try { localStorage.removeItem(draftKey(id)); } catch (e) {}
        if (id === currentConvId) newChat();
        refreshConversations();
      }

      return (
        <div style={{ height: '100%', background: dark ? '#000D26' : C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary, transition: 'background 0.2s ease' }}>
          <TopBar dark={dark} onToggleDark={() => setDark(d => !d)} onCalendar={() => setShowCalendar(s => !s)} calendarOpen={showCalendar} />
          {showCalendar && <CalendarPopover dark={dark} onClose={() => setShowCalendar(false)} />}
          <div style={{ flex: 1, minHeight: 0, paddingBottom: zoneH }}>
            {activeTab === 'chat' && (
              <div style={{ position: 'relative', height: '100%' }}>
                {/* Chat stays full width behind; history overlaps it at 50% */}
                <AIChatTab user={user} messages={messages} loading={loading} mode={mode} dark={dark} pills={effectivePills} onPill={dispatchPill} />
                {drawerOpen && (
                  <div onClick={() => setDrawerOpen(false)} style={{ position: 'absolute', inset: 0, zIndex: 29, background: dark ? 'rgba(0,0,0,0.28)' : 'rgba(0,13,38,0.12)' }} />
                )}
                {drawerOpen && (
                  <div style={{
                    position: 'absolute', top: 0, bottom: 0, [historySide === 'right' ? 'right' : 'left']: 0,
                    width: '50%', zIndex: 30,
                    boxShadow: historySide === 'right' ? '-10px 0 28px rgba(0,0,0,0.18)' : '10px 0 28px rgba(0,0,0,0.18)',
                    [historySide === 'right' ? 'borderLeft' : 'borderRight']: `1px solid ${dark ? '#0D1E3A' : '#F0EBE3'}`,
                  }}>
                    <HistoryPanel dark={dark} conversations={conversations} onSelect={selectConversation} onNewChat={() => { newChat(); setDrawerOpen(false); }} onPin={pinConversation} onArchive={archiveConversation} onRename={renameConversation} onDelete={removeConversation} />
                  </div>
                )}
              </div>
            )}
            {activeTab === 'teamchat' && <ChatTab dark={dark} />}
            {activeTab === 'calls' && <CallsTab dark={dark} />}
            {activeTab === 'kpis' && <KpisTab dark={dark} />}
            {activeTab === 'more' && (moreView === 'admin' && isAdmin
              ? <AdminTab onOpenBuilder={() => setBuilderOpen(true)} />
              : <SettingsTab user={user} profile={profile} historySide={historySide} setHistorySide={setHistorySide} dark={dark} setDark={setDark} />)}
            {!['chat', 'teamchat', 'calls', 'kpis', 'more'].includes(activeTab) && (
              <Placeholder title={(TABS.find(t => t.id === activeTab) || {}).label || ''} />
            )}
          </div>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept="image/*,application/pdf,.txt,.csv,.md,.json,.log,text/*"
            style={{ display: 'none' }}
            onChange={e => { onSelectFiles(e.target.files); e.target.value = ''; }}
          />
          <BottomZone
            active={activeTab}
            tabs={visibleTabs}
            onChange={(t) => {
              setDrawerOpen(false);
              if (t === 'more') {
                if (moreItems.length <= 1) { setMoreView('settings'); setActiveTab('more'); }
                else setMoreMenuOpen(o => !o);
                return;
              }
              setMoreMenuOpen(false); setActiveTab(t);
            }}
            dark={dark}
            mode={mode}
            onToggleMode={toggleMode}
            onOpenHistory={() => setDrawerOpen(o => !o)}
            onOpenAttach={openFilePicker}
            pendingAttachments={pendingAttachments}
            onRemoveAttach={removeAttachment}
            input={input}
            setInput={updateInput}
            onSend={send}
            loading={loading}
            zoneRef={zoneRef}
          />
          {moreMenuOpen && (
            <React.Fragment>
              <div onClick={() => setMoreMenuOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 51 }} />
              <div style={{ position: 'fixed', right: 12, bottom: (zoneH + 8) + 'px', zIndex: 52, background: dark ? '#0A1730' : '#FFFFFF', border: `1px solid ${dark ? '#152545' : C.border}`, borderRadius: 12, boxShadow: '0 8px 28px rgba(0,0,0,0.22)', padding: 6, minWidth: 168 }}>
                {moreItems.map(it => {
                  const on = activeTab === 'more' && moreView === it.id;
                  return (
                    <button key={it.id} onClick={() => { setMoreView(it.id); setActiveTab('more'); setMoreMenuOpen(false); }} style={{ display: 'flex', alignItems: 'center', gap: 11, width: '100%', textAlign: 'left', padding: '10px 12px', borderRadius: 8, border: 'none', background: on ? (dark ? 'rgba(173,131,47,0.15)' : '#F3EBDA') : 'none', cursor: 'pointer', color: dark ? '#fff' : C.navy, fontFamily: C.fontSans, fontSize: '0.9rem', fontWeight: 500 }}>
                      <i className={`ti ${it.icon}`} style={{ fontSize: 18, color: dark ? C.goldSoft : C.gold }} />{it.label}
                    </button>
                  );
                })}
              </div>
            </React.Fragment>
          )}
          {builderOpen && <WorkModeBuilder dark={dark} onClose={() => setBuilderOpen(false)} onSaved={refreshPills} />}
          {activePill && activePill.kind === 'form' && (
            <FormSheet dark={dark} pill={activePill.pill} onClose={() => setActivePill(null)} onSubmit={(vals) => { const text = composeFromTemplate(activePill.pill.config.template, vals, activePill.pill.config.fields); setActivePill(null); runSend(text, { type: 'work' }); }} />
          )}
          {activePill && activePill.kind === 'steps' && (
            <StepSheet dark={dark} pill={activePill.pill} onClose={() => setActivePill(null)} onComplete={(ans) => { const text = composeFromTemplate(activePill.pill.config.template, ans, activePill.pill.config.steps); setActivePill(null); runSend(text, { type: 'work' }); }} />
          )}
        </div>
      );
    }

    // ─── Mount ───────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      const AUTHORIZED_DOMAIN = 'themorshedgroup.com';
      function showSignin()   { document.getElementById('login-screen').hidden = false; document.getElementById('denied-screen').hidden = true;  document.getElementById('auth-overlay').style.display = 'block'; }
      function showRejected() { document.getElementById('login-screen').hidden = true;  document.getElementById('denied-screen').hidden = false; document.getElementById('auth-overlay').style.display = 'block'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} profile={{ id: 'dev-user-id', email: 'symon@morshedgroup.com', first_name: 'Symon', last_name: 'Yongco', title: 'Operations Manager', employee_id: 'TMG-001', access: 'admin', status: 'active', avatar_url: '' }} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(async function({ session }) {
        if (!session) { showSignin(); return; }
        // Domain gate: only TMG Workspace accounts may enter; others see Access Denied.
        const email = (session.user.email || '').toLowerCase();
        if (!email.endsWith('@' + AUTHORIZED_DOMAIN)) { showRejected(); return; }
        const profile = await ProfileDB.ensureProfile(session.user);
        // Gate: a profile that exists but isn't active is blocked. No profile (error/not-yet-set-up) → fail open.
        if (profile && profile.status && profile.status !== 'active') { showRejected(); return; }
        // One-time: persist the Google refresh token captured at sign-in so the calendar can sync.
        const grt = window.SupabaseAuth._googleRefresh;
        if (grt) { window.SupabaseAuth._googleRefresh = null; connectGoogleCalendar(grt); }
        root.render(<App user={session.user} profile={profile} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
