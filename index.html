      --tmg-navy-mid:  #0A1E44;

      --tmg-paper:     #FCFBF8;
      --tmg-border:    #E4DFD4;
      --tmg-slate:     #6B6B6B;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif;
      background: #FCFBF8;
      overscroll-behavior: none;
      color: #001A4A;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #000D26; color: #FCFBF8; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- ─── Dark mode init (before render to avoid flash) ─── -->
  <script>if (localStorage.getItem('sffu-theme') === 'dark') document.body.classList.add('dark');</script>

  <!-- ─── Auth Overlay ─── -->

      <button onclick="SupabaseAuth.signInWithGoogle()" style="display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:4px;padding:14px 24px;font-size:15px;font-weight:500;color:#3c4043;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);font-family:'Jost','Helvetica Neue',Arial,sans-serif;letter-spacing:0.03em;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>

    <div id="auth-rejected" style="display:none;flex-direction:column;align-items:center;text-align:center;padding:0 32px;">

  <div id="root"></div>

  <!-- ─── Dev localhost mock ─── -->
  <script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
    window.SupabaseAuth = {
      _state: { session: { user: { id: 'dev-user-id', email: 'symon@morshedgroup.com', user_metadata: { full_name: 'Symon', avatar_url: '' } }, access_token: 'dev-token' } },
      signInWithGoogle: function() {},
      signOut: function() { location.reload(); },
      getSession: function() { return Promise.resolve(window.SupabaseAuth._state.session); },
      onAuthStateChange: function(cb) { setTimeout(function() { cb({ session: window.SupabaseAuth._state.session }); }, 50); }
    };
  }
  </script>

    // ─── Helpers ─────────────────────────────────────────────────────
    function getShowings(pid)  { return SHOWINGS.filter(s => s.pid === pid); }
    function getProperty(pid)  { return PROPERTIES.find(p => p.id === pid); }
    function getThread(sid)    { return SMS_THREADS[sid] || []; }

    // ─── Icons ───────────────────────────────────────────────────────
    const Icon = {
      Grid: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">

    // ─── Status Badge ─────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const { label, color, bg } = STATUS[status] || STATUS.open;
      return (
        <span style={{
          fontSize: '0.68rem', fontWeight: 600, color,
          background: bg, border: `1px solid ${color}33`,
          borderRadius: 20, padding: '3px 9px', whiteSpace: 'nowrap',
        }}>
          {label}
        </span>
      );
    }

    // ─── SMS Thread ───────────────────────────────────────────────────
    function SmsThread({ sid }) {
      const thread = getThread(sid);
      if (!thread.length) return (
        <div style={{ padding: '12px 0 4px', textAlign: 'center', color: C.textMuted, fontSize: '0.8rem' }}>
          No messages yet
        </div>
      );
      return (
        <div style={{ paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {thread.map((msg, i) => {
            const isOut = msg.dir === 'out';
            return (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: isOut ? 'flex-end' : 'flex-start' }}>

      const closed    = showings.filter(s => s.status === 'closed').length;

      return (
        <div style={{
          background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)',

            onClick={() => setExpanded(e => !e)}

                    {property.address}

                  <div style={{ fontWeight: 500, fontStyle: 'italic', fontSize: '1rem', color: C.gold, marginLeft: 8, whiteSpace: 'nowrap', fontFamily: C.fontDisplay }}>

                fontSize: '1.4rem', fontStyle: 'italic',

                fontSize: '0.6rem', letterSpacing: '0.18em', textTransform: 'uppercase',

                        background: dark ? 'rgba(173,131,47,0.2)' : '#F3EBDA',
                        color: dark ? '#C9A45A' : '#AD832F',
                        padding: '2px 8px', borderRadius: 10, fontFamily: "'Jost', sans-serif",
                      }}>{totalShowings}</span>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Footer — sign out */}
            <div style={{ borderTop: `1px solid ${headerBorder}`, padding: '16px 20px' }}>
              <button onClick={() => window.SupabaseAuth.signOut()} style={{
                background: 'none', border: 'none', cursor: 'pointer', padding: 0,
                fontSize: '0.62rem', letterSpacing: '0.18em', textTransform: 'uppercase',
                fontFamily: "'Jost', sans-serif", fontWeight: 500,
                color: dark ? 'rgba(255,255,255,0.28)' : '#9B9380',
              }}>Sign Out</button>
            </div>
          </div>
        </>
      );
    }

    // ─── Bottom Nav (floating pill) ──────────────────────────────────
    const TABS = [
      { id: 'overview', label: 'Overview', icon: 'ti-layout-grid' },
      { id: 'board',    label: 'Board',    icon: 'ti-columns'     },
      { id: 'settings', label: 'Settings', icon: 'ti-settings'    },
    ];

    function BottomNav({ active, onChange, dark }) {
      return (
        <nav style={{
          position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50,
          background: dark ? '#000D26' : '#FCFBF8',
          borderTop: dark ? 'none' : '1px solid #E4DFD4',
          display: 'flex', justifyContent: 'center',
          padding: `8px 16px calc(8px + env(safe-area-inset-bottom))`,
        }}>
          {/* Pill container */}
          <div style={{
            display: 'flex', alignItems: 'center',
            background: dark ? '#0A1E44' : '#001A4A',
            borderRadius: 40, padding: 4, gap: 2,
          }}>
            {TABS.map(({ id, label, icon }) => {
              const isActive = active === id;
              return (
                <button key={id} onClick={() => onChange(id)} style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  justifyContent: 'center', gap: 2,
                  padding: '7px 20px', borderRadius: 30, border: 'none', cursor: 'pointer',
                  background: isActive ? '#AD832F' : (dark ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.32)'),
                  transition: 'background 0.2s ease',
                }}>
                  <i className={`ti ${icon}`} style={{ fontSize: 14, display: 'block', color: '#FFFFFF', lineHeight: 1 }} />
                  <span style={{
                    fontSize: 8, fontFamily: "'Jost', sans-serif",
                    letterSpacing: '0.14em', fontWeight: 500,
                    textTransform: 'uppercase', color: '#FFFFFF',
                  }}>{label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // ─── Top Bar ──────────────────────────────────────────────────────
    function TopBar({ onMenuOpen, dark, onToggleDark }) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '12px 16px', paddingTop: 'calc(12px + env(safe-area-inset-top))',
          background: 'rgba(0,26,74,0.88)', backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderBottom: '1px solid rgba(255,255,255,0.08)', flexShrink: 0,
        }}>
          <div style={{ fontSize: '0.95rem', fontWeight: 300, color: C.goldSoft, letterSpacing: '0.26em', textTransform: 'uppercase', fontFamily: C.fontSans }}>SFFU</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <button onClick={onToggleDark} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '4px 6px', color: 'rgba(255,255,255,0.6)', fontSize: 18, lineHeight: 1, display: 'flex', alignItems: 'center' }}>
              <i className={dark ? 'ti ti-sun' : 'ti ti-moon'} />
            </button>
            <button onClick={onMenuOpen} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
              <Icon.Menu color="rgba(255,255,255,0.7)" />
            </button>
          </div>
        </div>
      );
    }

    // ─── Root App ─────────────────────────────────────────────────────
    function App({ user }) {
      const [activeTab,  setActiveTab]  = useState('overview');
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [dark, setDark] = useState(() => localStorage.getItem('sffu-theme') === 'dark');

      useEffect(() => {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('sffu-theme', dark ? 'dark' : 'light');
      }, [dark]);

      return (
        <div style={{ height: '100%', background: dark ? '#000D26' : C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary, transition: 'background 0.2s ease' }}>
          <TopBar onMenuOpen={() => setDrawerOpen(true)} dark={dark} onToggleDark={() => setDark(d => !d)} />
          <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {activeTab === 'overview' && <OverviewTab user={user} />}
            {activeTab === 'board'    && <BoardTab />}
            {activeTab === 'settings' && <SettingsTab user={user} />}
          </div>
          <BottomNav active={activeTab} onChange={setActiveTab} dark={dark} />
          <HamburgerDrawer
            open={drawerOpen} onClose={() => setDrawerOpen(false)}
            onAction={a => console.log('action:', a)} onTabChange={setActiveTab}
            activeTab={activeTab} dark={dark} user={user}
          />
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      function showSignin()   { document.getElementById('auth-signin').style.display = 'flex'; document.getElementById('auth-rejected').style.display = 'none'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function showRejected() { document.getElementById('auth-signin').style.display = 'none'; document.getElementById('auth-rejected').style.display = 'flex'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(function({ session }) {
        if (!session) { showSignin(); return; }
        root.render(<App user={session.user} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
