<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#001A4A" />
  <title>TMG App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root {
      --tmg-navy:      #001A4A;
      --tmg-navy-deep: #000D26;
      --tmg-navy-mid:  #0A1E44;
      --tmg-gold:      #AD832F;
      --tmg-gold-soft: #C9A45A;
      --tmg-paper:     #FCFBF8;
      --tmg-border:    #E4DFD4;
      --tmg-slate:     #6B6B6B;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif;
      background: #FCFBF8;
      overscroll-behavior: none;
      color: #001A4A;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #000D26; color: #FCFBF8; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- ─── Dark mode init (before render to avoid flash) ─── -->
  <script>if (localStorage.getItem('tmg-theme') === 'dark') document.body.classList.add('dark');</script>

  <!-- ─── Auth Overlay ─── -->
  <div id="auth-overlay" style="
    position:fixed;inset:0;z-index:9999;background:#001A4A;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Jost','Helvetica Neue',Arial,sans-serif;">

    <div id="auth-signin" style="display:flex;flex-direction:column;align-items:center;padding:0 48px;width:100%;">
      <img src="Morshed Group Logo White.png" alt="Morshed Group" style="width:204px;margin-bottom:-24px;opacity:0.92;" />
      <div style="font-size:2.2rem;font-weight:300;color:#C9A45A;margin-bottom:6px;letter-spacing:0.26em;text-transform:uppercase;">TMG App</div>
      <div style="font-size:0.7rem;font-weight:400;color:#8899BB;margin-bottom:52px;letter-spacing:0.2em;text-transform:uppercase;">The Morshed Group</div>
      <button onclick="SupabaseAuth.signInWithGoogle()" style="display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:4px;padding:14px 24px;font-size:15px;font-weight:500;color:#3c4043;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);font-family:'Jost','Helvetica Neue',Arial,sans-serif;letter-spacing:0.03em;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
    </div>

    <div id="auth-rejected" style="display:none;flex-direction:column;align-items:center;text-align:center;padding:0 48px;width:100%;">
      <img src="Morshed Group Logo White.png" alt="Morshed Group" style="width:204px;margin-bottom:-24px;opacity:0.92;" />
      <div style="font-size:2.2rem;font-weight:300;color:#C9A45A;margin-bottom:6px;letter-spacing:0.26em;text-transform:uppercase;">TMG App</div>
      <div style="font-size:0.7rem;font-weight:400;color:#8899BB;margin-bottom:44px;letter-spacing:0.2em;text-transform:uppercase;">The Morshed Group</div>
      <div style="font-size:1.1rem;font-weight:500;color:#FCFBF8;margin-bottom:10px;letter-spacing:0.04em;">Access denied</div>
      <div style="font-size:0.88rem;color:#8899BB;margin-bottom:32px;line-height:1.7;">Your account doesn't have access yet.<br/>Contact <span style="color:#C9A45A;">operations@themorshedgroup.com</span> to be added.</div>
      <button onclick="SupabaseAuth.signOut()" style="display:flex;align-items:center;gap:10px;background:none;border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:12px 26px;font-size:13px;color:#8899BB;cursor:pointer;font-family:'Jost','Helvetica Neue',Arial,sans-serif;letter-spacing:0.08em;text-transform:uppercase;">Sign out</button>
    </div>
  </div>

  <div id="root"></div>

  <!-- ─── Dev localhost mock ─── -->
  <script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
    window.SupabaseAuth = {
      _state: { session: { user: { id: 'dev-user-id', email: 'symon@morshedgroup.com', user_metadata: { full_name: 'Symon', avatar_url: '' } }, access_token: 'dev-token' } },
      signInWithGoogle: function() {},
      signOut: function() { location.reload(); },
      getSession: function() { return Promise.resolve(window.SupabaseAuth._state.session); },
      onAuthStateChange: function(cb) { setTimeout(function() { cb({ session: window.SupabaseAuth._state.session }); }, 50); }
    };
  }
  </script>

  <!-- ─── React App ─── -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Design tokens (TMG Brand) ───────────────────────────────────
    const C = {
      bg:           '#FCFBF8',
      surface:      '#FFFFFF',
      surfaceHover: '#F3EBDA',
      border:       '#E4DFD4',
      navy:         '#001A4A',
      navyHover:    '#0A2552',
      gold:         '#AD832F',
      goldSoft:     '#C9A45A',
      textPrimary:  '#001A4A',
      textSecondary:'#6B6B6B',
      textMuted:    '#9B9380',
      red:          '#C0392B',
      green:        '#1E6B40',
      amber:        '#B07A00',
      navBg:        '#001A4A',
      fontSans:     "-apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif",
      fontDisplay:  "'Cormorant Garamond', Georgia, serif",
    };

    // ─── AI backend ──────────────────────────────────────────────────
    const AI_ENDPOINT = 'https://ipqoqhsnjubopybujetn.supabase.co/functions/v1/ai-chat';
    const SUPABASE_ANON = 'sb_publishable_Jg-roLg8M-BZJ7dBfjEeig_HIdniPaV';

    const SYSTEM_PROMPT =
      "You are the TMG assistant, an AI helper for The Morshed Group, a real estate team. " +
      "Be warm, concise, and conversational — talk like a helpful colleague, not a report. " +
      "Help with general questions, drafting, and day-to-day tasks.";

    function authToken() {
      return window.SupabaseAuth?._state?.session?.access_token || SUPABASE_ANON;
    }

    // Sends the running conversation to the ai-chat Edge Function and returns the reply text.
    async function callAI(messages) {
      const res = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken(),
          'apikey': SUPABASE_ANON,
        },
        body: JSON.stringify({ messages, system: SYSTEM_PROMPT, max_tokens: 4096 }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) {
        throw new Error(data.error || ('Request failed (' + res.status + ')'));
      }
      return data.text || '';
    }

    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }

    // Generates a short conversation title via the edge function; falls back to the first message.
    async function generateTitle(firstUserText) {
      const fallback = (firstUserText || 'New chat').replace(/\s+/g, ' ').trim().slice(0, 40);
      try {
        const res = await fetch(AI_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken(), 'apikey': SUPABASE_ANON },
          body: JSON.stringify({
            messages: [{ role: 'user', content: 'Conversation starts with: "' + firstUserText + '"\n\nReply with ONLY a 3-6 word title for it, no quotes, no punctuation at the end.' }],
            system: 'You write short, specific chat titles. Reply with only the title text.',
            max_tokens: 24,
          }),
        });
        const data = await res.json().catch(() => ({}));
        const t = (data.text || '').replace(/^["'\s]+|["'\s.]+$/g, '').trim();
        return t || fallback;
      } catch (e) {
        return fallback;
      }
    }

    // ─── Conversations DB (Supabase on prod; no-op/in-memory on localhost) ──
    const ConvDB = {
      client() { return window.SupabaseAuth?._client || null; },
      userId()  { return window.SupabaseAuth?._state?.session?.user?.id || null; },

      async loadConversations() {
        if (!this.client()) return [];
        const { data, error } = await this.client()
          .from('ai_conversations').select('*')
          .order('pinned', { ascending: false })
          .order('updated_at', { ascending: false });
        if (error) { console.error('[ConvDB] load:', error.message); return []; }
        return (data || []).map(r => ({
          id: r.id, type: r.type, workRequest: r.work_request,
          title: r.title || 'New chat', pinned: !!r.pinned, archived: !!r.archived,
          updatedAt: r.updated_at,
        }));
      },

      async createConversation({ type, workRequest, title }) {
        if (!this.client()) {
          return { id: 'local-' + Date.now(), type, workRequest: workRequest || null, title: title || 'New chat', pinned: false, archived: false };
        }
        const { data, error } = await this.client().from('ai_conversations').insert({
          user_id: this.userId(),
          type: type || 'ai',
          work_request: workRequest || null,
          title: title || null,
        }).select().single();
        if (error) { console.error('[ConvDB] create:', error.message); throw error; }
        return { id: data.id, type: data.type, workRequest: data.work_request, title: data.title || 'New chat', pinned: false, archived: false };
      },

      async updateConversation(id, fields) {
        if (!this.client() || String(id).startsWith('local-')) return;
        const mapped = { updated_at: new Date().toISOString() };
        if (fields.title    !== undefined) mapped.title    = fields.title;
        if (fields.pinned   !== undefined) mapped.pinned   = fields.pinned;
        if (fields.archived !== undefined) mapped.archived = fields.archived;
        const { error } = await this.client().from('ai_conversations').update(mapped).eq('id', id);
        if (error) console.error('[ConvDB] update:', error.message);
      },

      async touchConversation(id) {
        if (!this.client() || String(id).startsWith('local-')) return;
        await this.client().from('ai_conversations').update({ updated_at: new Date().toISOString() }).eq('id', id);
      },

      async deleteConversation(id) {
        if (!this.client() || String(id).startsWith('local-')) return;
        const { error } = await this.client().from('ai_conversations').delete().eq('id', id);
        if (error) console.error('[ConvDB] delete:', error.message);
      },

      async loadMessages(convId) {
        if (!this.client() || String(convId).startsWith('local-')) return [];
        const { data, error } = await this.client()
          .from('ai_messages').select('*').eq('conversation_id', convId)
          .order('created_at', { ascending: true });
        if (error) { console.error('[ConvDB] loadMessages:', error.message); return []; }
        const rows = data || [];
        const out = [];
        for (const r of rows) {
          const atts = Array.isArray(r.attachments) ? r.attachments : [];
          for (const a of atts) { if (a.path) a.url = await this.signedUrl(a.path); }
          out.push({ role: r.role, content: r.content || '', attachments: atts });
        }
        return out;
      },

      async insertMessage(convId, role, content, attachments) {
        if (!this.client() || String(convId).startsWith('local-')) return;
        // Strip transient fields (url/objectURL/textContent) before persisting.
        const slim = (attachments || []).map(a => ({
          kind: a.kind, name: a.name, mediaType: a.mediaType, path: a.path, size: a.size,
          ...(a.kind === 'text' ? { textContent: a.textContent } : {}),
        }));
        const { error } = await this.client().from('ai_messages').insert({
          conversation_id: convId, role, content,
          attachments: slim.length ? slim : null,
        });
        if (error) console.error('[ConvDB] insertMessage:', error.message);
      },

      async uploadAttachment(file, convId) {
        if (!this.client()) return null;
        const safe = (file.name || 'file').replace(/[^\w.\-]+/g, '_').slice(-80);
        const path = `${this.userId()}/${convId || 'tmp'}/${crypto.randomUUID()}-${safe}`;
        const { error } = await this.client().storage.from('chat-attachments').upload(path, file, {
          contentType: file.type || 'application/octet-stream', upsert: false,
        });
        if (error) { console.error('[ConvDB] upload:', error.message); throw error; }
        return path;
      },

      async signedUrl(path) {
        if (!this.client() || !path) return null;
        const { data, error } = await this.client().storage.from('chat-attachments').createSignedUrl(path, 7200);
        if (error) { console.error('[ConvDB] signedUrl:', error.message); return null; }
        return data?.signedUrl || null;
      },
    };

    // ─── Profiles / access ───────────────────────────────────────────
    // access → allowed bottom-nav tab ids. null = all tabs. 'more' is always allowed.
    const ROLE_TABS = {
      admin:      null,
      operations: null,
      agent:      ['chat', 'teamchat', 'calls', 'tasks', 'kpis', 'deals', 'more'],
      tc:         ['chat', 'teamchat', 'tasks', 'more'],
    };

    const ProfileDB = {
      client() { return window.SupabaseAuth?._client || null; },
      uid() { return window.SupabaseAuth?._state?.session?.user?.id || null; },

      // Returns the user's profile; auto-creates a pending one on first sign-in. Fail-open (null) on error.
      async ensureProfile(user) {
        if (!this.client()) return null;
        try {
          const { data, error } = await this.client().from('profiles').select('*').eq('id', user.id).maybeSingle();
          if (error) { console.error('[ProfileDB] load:', error.message); return null; }
          if (data) return data;
          const full = (user.user_metadata?.full_name || '').trim();
          const parts = full.split(' ');
          const first = parts.shift() || null;
          const last = parts.join(' ') || null;
          const { data: ins, error: e2 } = await this.client().from('profiles').insert({
            id: user.id, email: user.email, first_name: first, last_name: last,
            avatar_url: user.user_metadata?.avatar_url || null,
          }).select().single();
          if (e2) { console.error('[ProfileDB] create:', e2.message); return null; }
          return ins;
        } catch (e) { console.error('[ProfileDB] ensure:', e); return null; }
      },

      async loadAll() {
        if (!this.client()) return [];
        const { data, error } = await this.client().from('profiles').select('*').order('created_at', { ascending: true });
        if (error) { console.error('[ProfileDB] loadAll:', error.message); return []; }
        return data || [];
      },

      async updateMine(fields) {
        if (!this.client()) return;
        const { error } = await this.client().from('profiles').update({
          first_name: fields.first_name || null, last_name: fields.last_name || null, phone: fields.phone || null,
        }).eq('id', this.uid());
        if (error) { console.error('[ProfileDB] updateMine:', error.message); throw error; }
      },

      async adminUpdate(id, fields) {
        if (!this.client()) return;
        const mapped = {};
        ['employee_id', 'title', 'reports_to', 'access', 'status'].forEach(k => { if (fields[k] !== undefined) mapped[k] = fields[k] || null; });
        const { error } = await this.client().from('profiles').update(mapped).eq('id', id);
        if (error) { console.error('[ProfileDB] adminUpdate:', error.message); throw error; }
      },
    };

    // Maps a UI message to Claude API content (string, or blocks when it has attachments).
    function toApiContent(msg) {
      const atts = msg.attachments || [];
      if (!atts.length) return msg.content || '';
      const blocks = [];
      for (const a of atts) {
        if (a.kind === 'image' && a.url)      blocks.push({ type: 'image',    source: { type: 'url', url: a.url } });
        else if (a.kind === 'pdf' && a.url)   blocks.push({ type: 'document', source: { type: 'url', url: a.url } });
        else if (a.kind === 'text')           blocks.push({ type: 'text', text: 'Attached file "' + a.name + '":\n' + (a.textContent || '') });
      }
      if (msg.content) blocks.push({ type: 'text', text: msg.content });
      return blocks.length ? blocks : (msg.content || '');
    }

    const WORK_REQUESTS = [
      { key: 'kpis',                 label: 'Enter KPIs',                  short: 'KPIs' },
      { key: 'listing_presentation', label: 'Request Listing Presentation', short: 'Listing' },
    ];

    // ─── AI Chat Tab ─────────────────────────────────────────────────
    function AIChatTab({ user, messages, loading, mode, dark, onChip }) {
      const firstName = (user?.user_metadata?.full_name || 'there').split(' ')[0];
      const scrollRef = useRef(null);
      const CHIPS = [
        { label: 'Enter KPIs',           icon: 'ti-chart-bar',      iconL: '#AD832F', iconD: '#C9A45A' },
        { label: 'Listing Presentation', icon: 'ti-presentation',   iconL: '#AD832F', iconD: '#C9A45A' },
        { label: 'Add Showing',          icon: 'ti-home',           iconL: '#001A4A', iconD: 'rgba(255,255,255,0.6)' },
        { label: 'Commission Log',       icon: 'ti-currency-dollar', iconL: '#0F6E56', iconD: '#5DCAA5' },
        { label: 'Team Scorecard',       icon: 'ti-users',          iconL: '#AD832F', iconD: '#C9A45A' },
        { label: 'EOD Report',           icon: 'ti-file-text',      iconL: '#AD832F', iconD: '#C9A45A' },
        { label: 'Weekly Summary',       icon: 'ti-calendar-stats', iconL: '#001A4A', iconD: 'rgba(255,255,255,0.6)' },
      ];

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, loading]);

      const empty = messages.length === 0;

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          {/* Messages */}
          <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', padding: '20px 16px' }}>
            {empty ? (
              <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '0 24px' }}>
                <div style={{ fontSize: '2rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, fontFamily: C.fontDisplay }}>
                  {greeting()}, {firstName}
                </div>
                <div style={{ fontSize: '0.8rem', color: C.textSecondary, marginTop: 8, letterSpacing: '0.04em' }}>
                  {mode === 'work' ? 'What would you like to do?' : 'How can I help you today?'}
                </div>
                {/* Action chip row — horizontally scrolling */}
                <div style={{ width: '100%', maxWidth: 340, marginTop: 16, overflowX: 'auto', display: 'flex', gap: 7, paddingBottom: 2 }}>
                  {CHIPS.map((chip, i) => (
                    <button key={i} onClick={() => onChip(chip.label)} style={{
                      display: 'flex', alignItems: 'center', gap: 6, borderRadius: 20, padding: '7px 13px', cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0,
                      background: dark ? '#0A1730' : '#FFFFFF', border: `1px solid ${dark ? '#152545' : '#E4DFD4'}`,
                    }}>
                      <i className={`ti ${chip.icon}`} style={{ fontSize: 13, color: dark ? chip.iconD : chip.iconL }} />
                      <span style={{ fontFamily: "'Jost', sans-serif", fontSize: 9, fontWeight: 500, letterSpacing: '0.08em', color: dark ? 'rgba(255,255,255,0.7)' : '#001A4A' }}>{chip.label}</span>
                    </button>
                  ))}
                </div>
                <div style={{ fontFamily: "'Jost', sans-serif", fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 8, color: dark ? 'rgba(255,255,255,0.2)' : '#B4B2A9' }}>swipe for more</div>
              </div>
            ) : (
              messages.map((m, i) => {
                const isUser = m.role === 'user';
                return (
                  <div key={i} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start', marginBottom: 12 }}>
                    <div style={{
                      maxWidth: '82%', padding: '10px 14px', borderRadius: 16,
                      fontSize: '0.9rem', lineHeight: 1.55, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                      background: isUser ? C.navy : (m.error ? '#FDECEA' : C.surface),
                      color: isUser ? '#fff' : (m.error ? C.red : C.textPrimary),
                      border: isUser ? 'none' : `1px solid ${m.error ? C.red + '55' : C.border}`,
                      borderBottomRightRadius: isUser ? 4 : 16,
                      borderBottomLeftRadius: isUser ? 16 : 4,
                      boxShadow: isUser ? 'none' : '0 1px 2px rgba(0,26,74,0.05)',
                    }}>
                      {(m.attachments || []).length > 0 && (
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: m.content ? 8 : 0 }}>
                          {m.attachments.map((a, ai) => (
                            a.kind === 'image' && a.url ? (
                              <a key={ai} href={a.url} target="_blank" rel="noopener noreferrer">
                                <img src={a.url} alt={a.name} style={{ maxWidth: 200, maxHeight: 200, borderRadius: 10, display: 'block', objectFit: 'cover' }} />
                              </a>
                            ) : (
                              <a key={ai} href={a.url || undefined} target="_blank" rel="noopener noreferrer" style={{
                                display: 'flex', alignItems: 'center', gap: 7, padding: '8px 10px', borderRadius: 10, maxWidth: 220,

                                textDecoration: 'none', color: isUser ? '#fff' : C.textPrimary,
                              }}>
                                <i className={`ti ${a.kind === 'pdf' ? 'ti-file-type-pdf' : 'ti-file-text'}`} style={{ fontSize: 18, color: isUser ? '#fff' : C.gold, flexShrink: 0 }} />
                                <span style={{ fontSize: '0.75rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{a.name}</span>
                              </a>
                            )
                          ))}
                        </div>
                      )}
                      {m.content}

            {loading && (
              <div style={{ display: 'flex', justifyContent: 'flex-start', marginBottom: 12 }}>
                <div style={{ padding: '10px 14px', borderRadius: 16, borderBottomLeftRadius: 4, background: C.surface, border: `1px solid ${C.border}`, color: C.textMuted, fontSize: '0.9rem', fontStyle: 'italic' }}>
                  Thinking…
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Settings Tab (placeholder for now) ──────────────────────────
    const ACCESS_LABEL = { admin: 'Admin', operations: 'Operations', agent: 'Agent', tc: 'TC', pending: 'Pending' };
    const CARD = { background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)', borderRadius: 14, padding: 16, marginBottom: 14 };

    // Admin-only user-management console (under the More tab). Replaces editing in Supabase.
    function AdminUsers() {
      const [users, setUsers] = useState([]);
      const [openId, setOpenId] = useState(null);
      const refresh = () => ProfileDB.loadAll().then(setUsers);
      useEffect(() => { refresh(); }, []);
      const nameOf = (u) => (((u.first_name || '') + ' ' + (u.last_name || '')).trim()) || u.email || 'User';
      const pending = users.filter(u => u.status === 'pending');
      const others = users.filter(u => u.status !== 'pending');
      const inp = { width: '100%', padding: '8px 10px', background: C.surfaceHover, border: `1px solid ${C.border}`, borderRadius: 8, color: C.textPrimary, fontSize: '0.82rem', outline: 'none', fontFamily: C.fontSans };
      const lbl = { fontSize: '0.6rem', color: C.textSecondary, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 3, fontFamily: C.fontSans };

      const Editor = ({ u }) => {
        const [emp, setEmp] = useState(u.employee_id || '');
        const [title, setTitle] = useState(u.title || '');
        const [reports, setReports] = useState(u.reports_to || '');
        const [access, setAccess] = useState(u.access || 'pending');
        const [status, setStatus] = useState(u.status || 'pending');
        const [saving, setSaving] = useState(false);
        async function save() {
          setSaving(true);
          try { await ProfileDB.adminUpdate(u.id, { employee_id: emp, title, reports_to: reports || null, access, status }); await refresh(); setOpenId(null); }
          catch (e) { alert('Could not save: ' + (e.message || e)); }
          finally { setSaving(false); }
        }
        return (
          <div style={{ padding: '10px 12px', background: C.bg, borderRadius: 10, marginTop: 6 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
              <div><div style={lbl}>Employee ID</div><input value={emp} onChange={e => setEmp(e.target.value)} style={inp} /></div>
              <div><div style={lbl}>Title</div><input value={title} onChange={e => setTitle(e.target.value)} style={inp} /></div>
              <div><div style={lbl}>Access</div><select value={access} onChange={e => setAccess(e.target.value)} style={inp}>{['admin', 'operations', 'agent', 'tc', 'pending'].map(a => <option key={a} value={a}>{ACCESS_LABEL[a]}</option>)}</select></div>
              <div><div style={lbl}>Status</div><select value={status} onChange={e => setStatus(e.target.value)} style={inp}>{['active', 'pending', 'disabled'].map(s => <option key={s} value={s}>{s}</option>)}</select></div>
              <div style={{ gridColumn: 'span 2' }}><div style={lbl}>Reports to</div><select value={reports} onChange={e => setReports(e.target.value)} style={inp}><option value="">— None —</option>{users.filter(x => x.id !== u.id).map(x => <option key={x.id} value={x.id}>{nameOf(x)}</option>)}</select></div>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button onClick={save} disabled={saving} style={{ flex: 1, padding: '8px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.8rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>{saving ? 'Saving…' : 'Save'}</button>
              <button onClick={() => setOpenId(null)} style={{ flex: 1, padding: '8px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.8rem', cursor: 'pointer', fontFamily: C.fontSans }}>Close</button>
            </div>
          </div>
        );
      };

      const row = (u) => (
        <div key={u.id} style={{ borderBottom: `1px solid ${C.border}`, padding: '8px 0' }}>
          <div onClick={() => setOpenId(openId === u.id ? null : u.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '0.86rem', fontWeight: 600, color: C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{nameOf(u)}</div>
              <div style={{ fontSize: '0.7rem', color: C.textSecondary, marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{u.email}</div>
            </div>
            <span style={{ flexShrink: 0, fontSize: '0.58rem', fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: u.status === 'active' ? C.green : (u.status === 'pending' ? C.amber : C.red) }}>{u.status}</span>
            <span style={{ flexShrink: 0, fontSize: '0.6rem', fontWeight: 600, padding: '2px 7px', borderRadius: 8, background: C.surfaceHover, color: C.gold }}>{ACCESS_LABEL[u.access] || u.access || '—'}</span>
            <i className={`ti ti-chevron-${openId === u.id ? 'up' : 'down'}`} style={{ fontSize: 14, color: C.textMuted, flexShrink: 0 }} />
          </div>
          {openId === u.id && <Editor u={u} />}
        </div>
      );

      return (
        <div style={CARD}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 4, fontFamily: C.fontSans, display: 'flex', alignItems: 'center', gap: 6 }}>
            <i className="ti ti-users" style={{ fontSize: 14 }} />Manage Users
          </div>
          <div style={{ fontSize: '0.74rem', color: C.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>Approve new sign-ins and set each person's access, title, employee ID, and reporting line.</div>
          {pending.length > 0 && <div style={{ fontSize: '0.58rem', fontWeight: 600, color: C.amber, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 2 }}>Pending approval</div>}
          {pending.map(row)}
          {others.length > 0 && <div style={{ fontSize: '0.58rem', fontWeight: 600, color: C.textMuted, letterSpacing: '0.1em', textTransform: 'uppercase', margin: '12px 0 2px' }}>Team</div>}
          {others.map(row)}
          {users.length === 0 && <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '16px 0' }}>No users yet.</div>}
        </div>
      );
    }

    // Claude pricing — USD per 1,000,000 tokens, matched by model-id substring.
    // Update these when Anthropic changes prices; historical rows re-cost on view.
    const PRICING = {
      'claude-3-5-haiku':  { in: 0.80, out: 4.00 },
      'claude-3-5-sonnet': { in: 3.00, out: 15.00 },
      'claude-3-haiku':    { in: 0.25, out: 1.25 },
      'claude-3-opus':     { in: 15.00, out: 75.00 },
      'claude-haiku-4':    { in: 1.00, out: 5.00 },
      'claude-sonnet-4':   { in: 3.00, out: 15.00 },
      'claude-opus-4':     { in: 15.00, out: 75.00 },
    };
    const priceFor = (model) => { const m = model || ''; const k = Object.keys(PRICING).find(x => m.includes(x)); return PRICING[k] || PRICING['claude-3-5-sonnet']; };
    const rowCost = (r) => { const p = priceFor(r.model); return (Number(r.input_tokens) || 0) / 1e6 * p.in + (Number(r.output_tokens) || 0) / 1e6 * p.out; };
    const fmtTok = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n); };
    const fmtUsd = (n) => '$' + (Number(n) || 0).toFixed(2);

    // Admin-only AI usage + estimated cost per user. Reads the usage_summary RPC.
    function AdminUsage() {
      const [rows, setRows] = useState(null); // null = loading
      const [users, setUsers] = useState([]);
      const [days, setDays] = useState(30);
      useEffect(() => {
        const c = window.SupabaseAuth && window.SupabaseAuth._client;
        if (!c) { setRows([]); return; }
        setRows(null);
        Promise.all([c.rpc('usage_summary', { days }), ProfileDB.loadAll()]).then(([res, us]) => {
          if (res.error) { console.error('[Usage]', res.error.message); setRows([]); }
          else setRows(res.data || []);
          setUsers(us || []);
        });
      }, [days]);

      const nameOf = (id) => { const u = users.find(x => x.id === id); return u ? ((((u.first_name || '') + ' ' + (u.last_name || '')).trim()) || u.email) : 'Unknown user'; };

      const byUser = {};
      (rows || []).forEach(r => {
        const k = r.user_id || 'unknown';
        if (!byUser[k]) byUser[k] = { inTok: 0, outTok: 0, calls: 0, cost: 0 };
        byUser[k].inTok += Number(r.input_tokens) || 0;
        byUser[k].outTok += Number(r.output_tokens) || 0;
        byUser[k].calls += Number(r.calls) || 0;
        byUser[k].cost += rowCost(r);
      });
      const list = Object.entries(byUser).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.cost - a.cost);
      const total = list.reduce((s, u) => ({ inTok: s.inTok + u.inTok, outTok: s.outTok + u.outTok, calls: s.calls + u.calls, cost: s.cost + u.cost }), { inTok: 0, outTok: 0, calls: 0, cost: 0 });

      const pill = (d, label) => (
        <button key={d} onClick={() => setDays(d)} style={{ padding: '5px 11px', borderRadius: 8, cursor: 'pointer', fontFamily: C.fontSans, fontSize: '0.72rem', fontWeight: days === d ? 600 : 500, border: `1px solid ${days === d ? C.navy : C.border}`, background: days === d ? C.navy : 'none', color: days === d ? '#fff' : C.textSecondary }}>{label}</button>
      );

      return (
        <div style={CARD}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 4, fontFamily: C.fontSans, display: 'flex', alignItems: 'center', gap: 6 }}>
            <i className="ti ti-coin" style={{ fontSize: 14 }} />AI Usage &amp; Cost
          </div>
          <div style={{ fontSize: '0.74rem', color: C.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>Estimated Claude spend per person. Approximate, based on public token prices.</div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>{[[7, '7 days'], [30, '30 days'], [90, '90 days']].map(([d, l]) => pill(d, l))}</div>
          {rows === null ? (
            <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '14px 0' }}>Loading…</div>
          ) : (
            <React.Fragment>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: C.bg, borderRadius: 10, marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: '0.58rem', textTransform: 'uppercase', letterSpacing: '0.08em', color: C.textMuted, fontFamily: C.fontSans }}>Total · {days}d</div>
                  <div style={{ fontSize: '1.15rem', fontWeight: 700, color: C.navy, fontFamily: C.fontSans }}>{fmtUsd(total.cost)}</div>
                </div>
                <div style={{ textAlign: 'right', fontSize: '0.7rem', color: C.textSecondary, fontFamily: C.fontSans, lineHeight: 1.5 }}>
                  {fmtTok(total.inTok)} in · {fmtTok(total.outTok)} out<br />{total.calls} calls
                </div>
              </div>
              {list.length === 0 && <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '12px 0' }}>No AI usage in this period.</div>}
              {list.map(u => (
                <div key={u.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: '0.86rem', fontWeight: 600, color: C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{nameOf(u.id)}</div>
                    <div style={{ fontSize: '0.68rem', color: C.textSecondary, marginTop: 1, fontFamily: C.fontSans }}>{fmtTok(u.inTok)} in · {fmtTok(u.outTok)} out · {u.calls} calls</div>
                  </div>
                  <div style={{ flexShrink: 0, fontSize: '0.92rem', fontWeight: 700, color: C.gold, fontFamily: C.fontSans }}>{fmtUsd(u.cost)}</div>
                </div>
              ))}
            </React.Fragment>
          )}
        </div>
      );
    }

    function SettingsTab({ user, profile, historySide, setHistorySide }) {
      const [me, setMe] = useState(profile || null);
      const [allUsers, setAllUsers] = useState([]);
      const [editing, setEditing] = useState(false);
      const [first, setFirst] = useState((profile && profile.first_name) || '');
      const [last, setLast] = useState((profile && profile.last_name) || '');
      const [phone, setPhone] = useState((profile && profile.phone) || '');
      const [saving, setSaving] = useState(false);

      useEffect(() => { ProfileDB.loadAll().then(setAllUsers); }, []);

      const isAdmin = !!(me && (me.access === 'admin' || me.access === 'operations'));
      const fullName = ((((me && me.first_name) || '') + ' ' + ((me && me.last_name) || '')).trim()) || (user && user.user_metadata && user.user_metadata.full_name) || 'User';
      const email = (me && me.email) || (user && user.email) || '';

      async function saveMine() {
        setSaving(true);
        try { await ProfileDB.updateMine({ first_name: first, last_name: last, phone }); setMe(prev => ({ ...(prev || {}), first_name: first, last_name: last, phone })); setEditing(false); }

          <span style={{ fontSize: '0.72rem', color: C.textSecondary, fontFamily: C.fontSans, flexShrink: 0 }}>{label}</span>
          <span style={{ fontSize: '0.85rem', color: C.textPrimary, fontFamily: C.fontSans, fontWeight: 500, textAlign: 'right', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{value || '—'}</span>

      const inputStyle = { width: '100%', padding: '10px 12px', background: C.surfaceHover, border: `1px solid ${C.border}`, borderRadius: 10, color: C.textPrimary, fontSize: '0.87rem', outline: 'none', fontFamily: C.fontSans };
      const sideBtn = (val, label, icon) => {
        const on = historySide === val;
        return (
          <button onClick={() => setHistorySide(val)} style={{
            flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            padding: '10px', borderRadius: 10, cursor: 'pointer',
            border: `1px solid ${on ? C.navy : C.border}`,

            fontFamily: C.fontSans, fontSize: '0.85rem', fontWeight: on ? 600 : 500,
          }}>
            <i className={`ti ${icon}`} style={{ fontSize: 16 }} />{label}
          </button>
        );
      };

      return (
        <div style={{ padding: '20px 16px 100px', height: '100%', overflowY: 'auto' }}>
          <div style={{ fontSize: '1.5rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, marginBottom: 24, fontFamily: C.fontDisplay }}>Settings</div>

          {/* My Profile */}
          <div style={CARD}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
              {avatar
                ? <img src={avatar} alt={fullName} style={{ width: 48, height: 48, borderRadius: '50%', objectFit: 'cover', flexShrink: 0 }} />
                : <div style={{ width: 48, height: 48, borderRadius: '50%', background: C.navy, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.goldSoft, fontWeight: 300, fontSize: '1.3rem', fontFamily: C.fontSans, flexShrink: 0 }}>{initial}</div>}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: C.textPrimary, fontWeight: 600, fontSize: '1rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{fullName}</div>
                <div style={{ color: C.textSecondary, fontSize: '0.8rem', marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{(me && me.title) || email}</div>
              </div>
              <span style={{ flexShrink: 0, fontSize: '0.6rem', fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', padding: '3px 8px', borderRadius: 8, background: C.surfaceHover, color: C.gold }}>{ACCESS_LABEL[me && me.access] || '—'}</span>
            </div>
            {!editing ? (
              <React.Fragment>
                {fieldRow('Employee ID', me && me.employee_id)}
                {fieldRow('Title', me && me.title)}

                {fieldRow('Phone', me && me.phone)}
                {fieldRow('Email', email)}
                <button onClick={() => { setFirst((me && me.first_name) || ''); setLast((me && me.last_name) || ''); setPhone((me && me.phone) || ''); setEditing(true); }} style={{ width: '100%', padding: 11, marginTop: 12, background: 'none', border: `1px solid ${C.navy}`, borderRadius: 12, color: C.navy, fontSize: '0.9rem', cursor: 'pointer', fontWeight: 500, fontFamily: C.fontSans }}>Edit my info</button>
              </React.Fragment>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <input placeholder="First name" value={first} onChange={e => setFirst(e.target.value)} style={inputStyle} />
                <input placeholder="Last name" value={last} onChange={e => setLast(e.target.value)} style={inputStyle} />

          <div style={CARD}>

            borderRadius: 12, color: C.red, fontSize: '15px', cursor: 'pointer', fontWeight: 500, fontFamily: C.fontSans,
          }}>Sign out</button>
        </div>
      );

    // ─── Placeholder (not-yet-built tabs) ────────────────────────────

    // ─── Chat (Team Chat) Tab — preview mockup ───────────────────────
    const TCHAT_PHOTOS = {

      symon:   'https://themorshedgroup.com/wp-content/uploads/2025/01/Hidenori-Symon-Yongco-headshot.jpg',

    };

    function ChatTab({ dark }) {
      const J = "'Jost', sans-serif";
      const bg          = dark ? '#000D26' : '#FCFBF8';
      const bannerBg    = dark ? '#7F1D1D' : '#9B1C1C';
      const headTitle   = dark ? '#FFFFFF' : '#001A4A';
      const composeBg   = dark ? 'rgba(173,131,47,0.15)' : '#F3EBDA';
      const composeCol  = dark ? '#C9A45A' : '#AD832F';

    // ─── Calendar Popover ────────────────────────────────────────────
    function CalendarPopover({ dark, onClose }) {
      const J = "'Jost', sans-serif";
      const today = new Date();
      const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const mondayOf = (d) => { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0); return x; };
      const [weekStart, setWeekStart] = useState(() => mondayOf(today));
      const [selected, setSelected] = useState(() => iso(today));
      const [vis, setVis] = useState(false);
      useEffect(() => { const r = requestAnimationFrame(() => setVis(true)); return () => cancelAnimationFrame(r); }, []);

      const days = [];
      for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); days.push(d); }
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const monthLabel = days[3].toLocaleString('en-US', { month: 'long', year: 'numeric' });
      const navWeek = (dir) => setWeekStart(prev => { const x = new Date(prev); x.setDate(prev.getDate() + dir * 7); return x; });

      const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
      const EVENTS = {};
      EVENTS[iso(today)] = [
        { c: dark ? '#C9A45A' : '#001A4A', t: 'Team Standup', time: '9:30 – 10:00 AM' },
        { c: '#AD832F', t: 'Forest Hill Offer Review', time: '10:30 – 11:30 AM' },
        { c: dark ? '#5DCAA5' : '#0F6E56', t: 'Lunch — EO Member', time: '12:00 – 12:45 PM' },
        { c: '#AD832F', t: 'Jinx Ave Showing', time: '2:00 – 3:00 PM' },
      ];
      EVENTS[iso(tomorrow)] = [{ c: '#AD832F', t: 'Listing Presentation Prep', time: '11:00 – 11:30 AM' }];
      const events = EVENTS[selected] || [];

      const chevCol = dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9';
      const dotCol = dark ? '#C9A45A' : '#AD832F';
      const seg = (t, k) => <span key={k} style={{ fontFamily: J, fontSize: 9, letterSpacing: '0.16em', fontWeight: 500, color: '#fff', textTransform: 'uppercase' }}>{t}</span>;
      const sepEl = (k) => <span key={k} style={{ fontFamily: J, fontSize: 9, color: 'rgba(255,255,255,0.4)' }}>·</span>;

      return (
        <React.Fragment>
          {/* Overlay — dims content only, sits below the top bar / pill nav */}
          <div onClick={onClose} style={{ position: 'fixed', top: 'calc(54px + env(safe-area-inset-top))', left: 0, right: 0, bottom: 0, zIndex: 40, background: dark ? 'rgba(0,0,0,0.3)' : 'rgba(0,26,74,0.08)' }} />
          {/* Popout */}
          <div onClick={(e) => e.stopPropagation()} style={{
            position: 'fixed', top: 'calc(54px + env(safe-area-inset-top))', right: 10, width: '75%', zIndex: 60,
            borderRadius: 14, overflow: 'hidden', boxShadow: '0 8px 32px rgba(0,0,0,0.18)',
            background: dark ? '#0A1730' : '#FFFFFF', border: `1px solid ${dark ? '#152545' : '#E4DFD4'}`,
            opacity: vis ? 1 : 0, transition: 'opacity 150ms ease',
          }}>
            {/* Banner */}
            <div style={{ background: dark ? '#7F1D1D' : '#9B1C1C', padding: '6px 14px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
              {seg('Coming Soon', 's1')}{sepEl('p1')}{seg('Calendar', 's2')}{sepEl('p2')}{seg('Q3 2026', 's3')}
            </div>
            {/* Header */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px 6px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <i className="ti ti-chevron-left" onClick={() => navWeek(-1)} style={{ fontSize: 13, cursor: 'pointer', color: chevCol }} />
                <span style={{ fontFamily: J, fontSize: 12, fontWeight: 600, letterSpacing: '0.04em', color: dark ? '#fff' : '#001A4A' }}>{monthLabel}</span>
                <i className="ti ti-chevron-right" onClick={() => navWeek(1)} style={{ fontSize: 13, cursor: 'pointer', color: chevCol }} />
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <i className="ti ti-search" style={{ fontSize: 13, color: dark ? 'rgba(255,255,255,0.3)' : '#B4B2A9' }} />
                <i className="ti ti-plus" style={{ fontSize: 13, color: dark ? '#C9A45A' : '#AD832F' }} />
              </div>
            </div>
            {/* Week strip */}
            <div style={{ borderTop: `1px solid ${dark ? '#152545' : '#F0EBE3'}`, padding: '6px 10px 8px', display: 'flex', gap: 2 }}>
              {days.map((d, i) => {
                const weekend = i >= 5;
                const isSel = iso(d) === selected;
                const hasEv = !!EVENTS[iso(d)];
                const labelCol = isSel ? (dark ? '#C9A45A' : '#AD832F') : (weekend ? (dark ? 'rgba(255,255,255,0.15)' : '#D4D0CC') : (dark ? 'rgba(255,255,255,0.3)' : '#B4B2A9'));
                const numCol = isSel ? '#fff' : (weekend ? (dark ? 'rgba(255,255,255,0.2)' : '#D4D0CC') : (dark ? 'rgba(255,255,255,0.5)' : '#6B6B6B'));
                return (
                  <div key={i} onClick={() => setSelected(iso(d))} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, cursor: 'pointer', padding: '4px 2px', borderRadius: 8, background: isSel ? (dark ? 'rgba(173,131,47,0.15)' : '#F3EBDA') : 'transparent' }}>
                    <span style={{ fontFamily: J, fontSize: 7, letterSpacing: '0.12em', fontWeight: 500, textTransform: 'uppercase', color: labelCol }}>{dayLabels[i]}</span>
                    <div style={{ width: 27, height: 27, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: J, fontSize: 13, fontWeight: 500, background: isSel ? (dark ? '#AD832F' : '#001A4A') : 'transparent', color: numCol }}>{d.getDate()}</div>
                    <div style={{ width: 4, height: 4, borderRadius: '50%', background: hasEv ? dotCol : 'transparent' }} />
                  </div>
                );
              })}
            </div>
            {/* Event list */}
            <div style={{ borderTop: `1px solid ${dark ? '#152545' : '#F0EBE3'}`, padding: '6px 12px 10px' }}>
              {events.length === 0 ? (
                <div style={{ textAlign: 'center', fontFamily: J, fontSize: 9, padding: '12px 0', color: dark ? 'rgba(255,255,255,0.25)' : '#B4B2A9' }}>No events</div>
              ) : events.map((e, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, padding: '6px 0', borderBottom: i === events.length - 1 ? 'none' : `1px solid ${dark ? '#152545' : '#F5F2EE'}` }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', flexShrink: 0, marginTop: 3, background: e.c }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: J, fontSize: 10, fontWeight: 500, color: dark ? '#fff' : '#001A4A' }}>{e.t}</div>
                    <div style={{ fontFamily: J, fontSize: 8, letterSpacing: '0.06em', marginTop: 1, color: dark ? 'rgba(255,255,255,0.35)' : '#B4B2A9' }}>{e.time}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ─── Chat History Drawer ─────────────────────────────────────────
    // Short timestamp like "11:42p", "Yest", "Mon", "Jun 3".
    function shortTime(iso) {
      if (!iso) return '';
      const d = new Date(iso), now = new Date();
      if (d.toDateString() === now.toDateString()) {
        let h = d.getHours(); const m = d.getMinutes();
        const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12;
        return h + ':' + String(m).padStart(2, '0') + ap;
      }
      const yest = new Date(now); yest.setDate(now.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return 'Yest';
      if (Math.floor((now - d) / 86400000) < 7) return d.toLocaleDateString('en-US', { weekday: 'short' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // In-flow chat history panel — fills the area between the top bar and the bottom zone.

      const btnBg      = dark ? '#AD832F' : '#001A4A';
      const rowBord    = dark ? '#0D1E3A' : '#F5F2EE';

      const timeCol    = dark ? 'rgba(255,255,255,0.3)' : '#B4B2A9';
      const J = "'Jost', sans-serif";
      const list = (conversations || []).filter(c => !c.archived);
      const ico = (type) => type === 'work'
        ? { bg: dark ? 'rgba(173,131,47,0.15)' : '#F3EBDA', color: dark ? '#C9A45A' : '#AD832F', icon: 'ti-briefcase' }
        : { bg: dark ? 'rgba(255,255,255,0.07)' : '#EEF0F8', color: dark ? 'rgba(255,255,255,0.6)' : '#001A4A', icon: 'ti-sparkles' };

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: panelBg }}>
          {/* Header */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 14px 9px', borderBottom: `1px solid ${headBord}`, flexShrink: 0 }}>
            <div style={{ fontFamily: J, fontSize: 10, letterSpacing: '0.18em', fontWeight: 600, color: titleCol }}>Chats</div>
            <button onClick={onNewChat} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '5px 10px', borderRadius: 20, border: 'none', cursor: 'pointer', background: btnBg, color: '#fff', fontFamily: J, fontSize: 8, letterSpacing: '0.14em', fontWeight: 500 }}>
              <i className="ti ti-plus" style={{ fontSize: 11 }} />New
            </button>

          {/* List */}
          <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {list.length === 0 && (
              <div style={{ textAlign: 'center', color: previewCol, fontSize: '0.8rem', padding: '32px 16px', fontFamily: J }}>No conversations yet.</div>
            )}
            {list.map((c, i) => {
              const k = ico(c.type);

              return (
                <div key={c.id} onClick={() => onSelect(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '9px 14px', cursor: 'pointer', borderBottom: last ? 'none' : `1px solid ${rowBord}` }}>
                  <div style={{ width: 28, height: 28, borderRadius: 6, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: k.bg }}>

                    {c.preview && <div style={{ fontFamily: J, fontSize: 9, color: previewCol, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginTop: 2 }}>{c.preview}</div>}
                  </div>
                  <div style={{ flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ fontFamily: J, fontSize: 8, color: timeCol }}>{shortTime(c.updatedAt)}</div>
                    {c.unread > 0 && (
                      <div style={{ width: 16, height: 16, borderRadius: '50%', background: '#AD832F', color: '#fff', fontFamily: J, fontSize: 8, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{c.unread}</div>
                    )}
                    <button onClick={(e) => { e.stopPropagation(); onRename(c.id); }} title="Rename" style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, color: timeCol, fontSize: 15, display: 'flex', alignItems: 'center' }}>

                    c.archived
                      ? { t: 'Restore', i: 'ti-refresh', fn: () => onArchive(c.id, false) }
                      : (c.pinned ? { t: 'Unpin', i: 'ti-pinned-off', fn: () => onPin(c.id, false) } : { t: 'Pin', i: 'ti-pin', fn: () => onPin(c.id, true) }),
                    !c.archived && { t: 'Rename', i: 'ti-pencil', fn: () => onRename(c.id) },
                    !c.archived && { t: 'Archive', i: 'ti-archive', fn: () => onArchive(c.id, true) },
                    { t: 'Delete', i: 'ti-trash', fn: () => onDelete(c.id), danger: true },
                  ].filter(Boolean).map(a => (
                    <button key={a.t} onClick={() => { setMenuId(null); a.fn(); }} style={{
                      display: 'flex', alignItems: 'center', gap: 9, width: '100%', textAlign: 'left',
                      padding: '9px 10px', borderRadius: 7, border: 'none', cursor: 'pointer', background: 'none',
                      color: a.danger ? C.red : textCol, fontSize: '0.82rem', fontFamily: C.fontSans,
                    }}>
                      <i className={`ti ${a.i}`} style={{ fontSize: 15 }} />{a.t}
                    </button>
                  ))}
                </div>
              </React.Fragment>
            )}
          </div>
        );
      };

      return (
        <React.Fragment>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,13,38,0.45)' }} />
          <div style={{
            position: 'fixed', top: 0, bottom: 0, [side]: 0, zIndex: 301,
            width: 'min(86vw, 320px)', background: panelBg,
            borderRight: side === 'left' ? `1px solid ${borderCol}` : 'none',
            borderLeft: side === 'right' ? `1px solid ${borderCol}` : 'none',
            display: 'flex', flexDirection: 'column',
            boxShadow: '0 0 40px rgba(0,0,0,0.3)',
          }}>
            {/* Header */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: 'calc(14px + env(safe-area-inset-top)) 14px 12px', borderBottom: `1px solid ${borderCol}` }}>
              <div style={{ fontSize: '1rem', fontWeight: 600, color: textCol, fontFamily: C.fontSans }}>Chats</div>
              <button onClick={onNewChat} style={{
                display: 'flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 9, cursor: 'pointer',
                background: dark ? C.gold : C.navy, color: '#fff', border: 'none', fontFamily: C.fontSans, fontSize: '0.8rem', fontWeight: 500,
              }}><i className="ti ti-plus" style={{ fontSize: 15 }} />New</button>
            </div>

            {/* List */}
            <div style={{ flex: 1, overflowY: 'auto', padding: '4px 0 20px' }}>
              {active.length === 0 && (
                <div style={{ textAlign: 'center', color: subCol, fontSize: '0.8rem', padding: '32px 16px' }}>No conversations yet.</div>
              )}
              {pinned.length > 0 && sectionLabel('Pinned')}
              {pinned.map(row)}
              {recent.length > 0 && sectionLabel('Recent')}
              {recent.map(row)}

              {archived.length > 0 && (
                <React.Fragment>
                  <button onClick={() => setShowArchived(s => !s)} style={{
                    display: 'flex', alignItems: 'center', gap: 6, width: '100%', background: 'none', border: 'none', cursor: 'pointer',
                    color: subCol, fontSize: '0.62rem', fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
                    padding: '16px 14px 6px', fontFamily: C.fontSans,
                  }}>
                    <i className={`ti ti-chevron-${showArchived ? 'down' : 'right'}`} style={{ fontSize: 13 }} />
                    Archived ({archived.length})
                  </button>
                  {showArchived && archived.map(row)}
                </React.Fragment>
              )}
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ─── Root App ────────────────────────────────────────────────────
    function App({ user, profile }) {
      const [activeTab, setActiveTab] = useState('chat');
      const [dark, setDark] = useState(() => localStorage.getItem('tmg-theme') === 'dark');
      const [showCalendar, setShowCalendar] = useState(false);

      // Role-based tabs: filter the nav to what this access role may see.
      const allowedIds = profile ? ROLE_TABS[profile.access] : undefined;
      const visibleTabs = Array.isArray(allowedIds) ? TABS.filter(t => allowedIds.includes(t.id)) : TABS;
      useEffect(() => {
        if (!visibleTabs.some(t => t.id === activeTab)) setActiveTab((visibleTabs[0] || { id: 'more' }).id);
      }, [profile]);

      // Chat state (lifted so the input lives in the shared bottom zone)
      const [messages, setMessages] = useState([]); // { role:'user'|'assistant', content, error? }
      const [input, setInput] = useState(() => localStorage.getItem('tmg-draft-new') || '');
      const [loading, setLoading] = useState(false);
      const [pendingAttachments, setPendingAttachments] = useState([]); // { id, file, kind, name, mediaType, size, previewUrl, textContent }
      const [mode, setMode] = useState(() => localStorage.getItem('tmg-mode') || 'ai');

      // Conversation persistence + history
      const [conversations, setConversations] = useState([]);
      const [currentConvId, setCurrentConvId] = useState(null);
      const [workRequest, setWorkRequest] = useState(null); // 'kpis' | 'listing_presentation' | null
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [historySide, setHistorySide] = useState(() => localStorage.getItem('tmg-history-side') || 'left');

      const zoneRef = useRef(null);
      const fileInputRef = useRef(null);
      const [zoneH, setZoneH] = useState(96);
      const onChat = activeTab === 'chat';

      function openFilePicker() { if (fileInputRef.current) fileInputRef.current.click(); }
      async function onSelectFiles(fileList) {
        const files = Array.from(fileList || []);
        const additions = [];
        for (const file of files) {
          if (file.size > 20 * 1024 * 1024) { alert('"' + file.name + '" is over 20 MB and was skipped.'); continue; }
          const type = file.type || '';
          let kind = null, textContent = null, previewUrl = null;
          if (type.startsWith('image/')) { kind = 'image'; previewUrl = URL.createObjectURL(file); }
          else if (type === 'application/pdf' || /\.pdf$/i.test(file.name)) { kind = 'pdf'; }
          else if (type.startsWith('text/') || /\.(txt|csv|md|json|log)$/i.test(file.name)) { kind = 'text'; textContent = await file.text(); }
          else { alert('The AI can\'t read "' + file.name + '" yet (unsupported type).'); continue; }
          additions.push({ id: crypto.randomUUID(), file, kind, name: file.name, mediaType: type, size: file.size, previewUrl, textContent });
        }
        if (additions.length) setPendingAttachments(prev => [...prev, ...additions]);
      }
      function removeAttachment(id) {
        setPendingAttachments(prev => prev.filter(a => {
          if (a.id === id && a.previewUrl) { try { URL.revokeObjectURL(a.previewUrl); } catch (e) {} }
          return a.id !== id;
        }));
      }

      const refreshConversations = () => ConvDB.loadConversations().then(setConversations);
      useEffect(() => { refreshConversations(); }, []);
      useEffect(() => { localStorage.setItem('tmg-history-side', historySide); }, [historySide]);

      // Per-conversation draft autosave (device-local). Key 'new' before a conversation exists.
      const draftKey = (id) => 'tmg-draft-' + (id || 'new');
      function updateInput(val) {
        setInput(val);
        try { localStorage.setItem(draftKey(currentConvId), val); } catch (e) {}
      }

      useEffect(() => {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('tmg-theme', dark ? 'dark' : 'light');
      }, [dark]);

      useEffect(() => {
        localStorage.setItem('tmg-mode', mode);
      }, [mode]);

      // Keep content padding in sync with the fixed bottom zone height.
      useEffect(() => {
        if (zoneRef.current) setZoneH(zoneRef.current.offsetHeight);
      }, [activeTab, dark, onChat, input, loading, pendingAttachments]);

      // Core send: persists the user message, gets a reply, persists it, auto-titles a new conversation.
      async function runSend(text, opts = {}) {
        const pend = opts.attachments !== undefined ? opts.attachments : pendingAttachments;
        if ((!text || !text.trim()) && (!pend || !pend.length)) return;
        if (loading) return;
        const startType = opts.type || (mode === 'work' ? 'work' : 'ai');
        const startReq  = opts.workRequest !== undefined ? opts.workRequest : workRequest;
        const isFirst = !currentConvId;

        // Optimistic user message with local previews; clear the picker immediately.
        const localAtts = (pend || []).map(a => ({ kind: a.kind, name: a.name, mediaType: a.mediaType, size: a.size, url: a.previewUrl, textContent: a.textContent }));
        const userMsg = { role: 'user', content: text || '', attachments: localAtts };
        const next = [...messages, userMsg];
        setMessages(next);
        setPendingAttachments([]);
        setLoading(true);

        let convId = currentConvId;
        try {
          if (!convId) {
            const conv = await ConvDB.createConversation({ type: startType, workRequest: startReq });
            convId = conv.id;
            setCurrentConvId(convId);
            refreshConversations();
          }
          // Upload pending files, then resolve signed URLs (needed for Claude + display).
          const uploaded = [];
          for (const a of (pend || [])) {
            let path = null;
            if (a.file) { try { path = await ConvDB.uploadAttachment(a.file, convId); } catch (e) {} }
            const url = path ? await ConvDB.signedUrl(path) : a.previewUrl;
            uploaded.push({ kind: a.kind, name: a.name, mediaType: a.mediaType, size: a.size, path, url, textContent: a.textContent });
          }
          const history = next.map((m, idx) => (idx === next.length - 1 ? { ...m, attachments: uploaded } : m));
          setMessages(history);

          await ConvDB.insertMessage(convId, 'user', text || '', uploaded);
          const apiMsgs = history.map(m => ({ role: m.role, content: toApiContent(m) }));
          const reply = await callAI(apiMsgs);
          setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
          await ConvDB.insertMessage(convId, 'assistant', reply);
          if (isFirst) {
            const seed = text || (uploaded[0] && uploaded[0].name) || 'Shared a file';
            const title = await generateTitle(seed);
            await ConvDB.updateConversation(convId, { title });
          } else {
            await ConvDB.touchConversation(convId);
          }
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', content: String(e.message || e), error: true }]);
        } finally {
          setLoading(false);
          refreshConversations();
        }
      }

      function send() {
        const text = input.trim();
        if ((!text && !pendingAttachments.length) || loading) return;
        try { localStorage.removeItem(draftKey(currentConvId)); } catch (e) {}
        setInput('');
        runSend(text);
      }

      function newChat() {
        setMessages([]);
        setCurrentConvId(null);
        setWorkRequest(null);
        setInput(localStorage.getItem('tmg-draft-new') || '');
      }

      function toggleMode() {
        setMode(m => (m === 'work' ? 'ai' : 'work'));
        newChat();
      }

      async function selectConversation(id) {
        const conv = conversations.find(c => c.id === id);
        setDrawerOpen(false);
        setCurrentConvId(id);
        setInput(localStorage.getItem(draftKey(id)) || '');
        setWorkRequest(conv?.workRequest || null);
        if (conv) setMode(conv.type === 'work' ? 'work' : 'ai');
        setActiveTab('chat');
        const msgs = await ConvDB.loadMessages(id);
        setMessages(msgs);
      }

      function startWorkRequest(key) {
        const req = WORK_REQUESTS.find(w => w.key === key);
        if (!req) return;
        setMode('work');
        setWorkRequest(key);
        setCurrentConvId(null);
        setMessages([]);
        runSend(req.label, { type: 'work', workRequest: key });
      }

      async function pinConversation(id, pinned) { await ConvDB.updateConversation(id, { pinned }); refreshConversations(); }
      async function archiveConversation(id, archived) {
        await ConvDB.updateConversation(id, { archived });
        if (id === currentConvId) newChat();
        refreshConversations();
      }
      async function renameConversation(id) {
        const conv = conversations.find(c => c.id === id);
        const title = window.prompt('Rename conversation', conv?.title || '');
        if (title && title.trim()) { await ConvDB.updateConversation(id, { title: title.trim() }); refreshConversations(); }
      }
      async function removeConversation(id) {
        if (!window.confirm('Delete this conversation permanently?')) return;
        await ConvDB.deleteConversation(id);
        try { localStorage.removeItem(draftKey(id)); } catch (e) {}
        if (id === currentConvId) newChat();
        refreshConversations();
      }

      return (
        <div style={{ height: '100%', background: dark ? '#000D26' : C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary, transition: 'background 0.2s ease' }}>
          <TopBar dark={dark} onToggleDark={() => setDark(d => !d)} onCalendar={() => setShowCalendar(s => !s)} calendarOpen={showCalendar} />
          {showCalendar && <CalendarPopover dark={dark} onClose={() => setShowCalendar(false)} />}
          <div style={{ flex: 1, minHeight: 0, paddingBottom: zoneH }}>
            {activeTab === 'chat' && (
              <div style={{ position: 'relative', height: '100%' }}>
                {/* Chat stays full width behind; history overlaps it at 50% */}
                <AIChatTab user={user} messages={messages} loading={loading} mode={mode} dark={dark} onChip={(t) => runSend(t)} />
                {drawerOpen && (
                  <div style={{
                    position: 'absolute', top: 0, bottom: 0, [historySide === 'right' ? 'right' : 'left']: 0,
                    width: '50%', zIndex: 30,
                    boxShadow: historySide === 'right' ? '-10px 0 28px rgba(0,0,0,0.18)' : '10px 0 28px rgba(0,0,0,0.18)',
                    [historySide === 'right' ? 'borderLeft' : 'borderRight']: `1px solid ${dark ? '#0D1E3A' : '#F0EBE3'}`,
                  }}>
                    <HistoryPanel dark={dark} conversations={conversations} onSelect={selectConversation} onNewChat={() => { newChat(); setDrawerOpen(false); }} onRename={renameConversation} />
                  </div>
                )}
              </div>
            )}
            {activeTab === 'teamchat' && <ChatTab dark={dark} />}
            {activeTab === 'calls' && <CallsTab dark={dark} />}
            {activeTab === 'kpis' && <KpisTab dark={dark} />}
            {activeTab === 'more' && <SettingsTab user={user} profile={profile} historySide={historySide} setHistorySide={setHistorySide} />}
            {!['chat', 'teamchat', 'calls', 'kpis', 'more'].includes(activeTab) && (
              <Placeholder title={(TABS.find(t => t.id === activeTab) || {}).label || ''} />
            )}
          </div>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept="image/*,application/pdf,.txt,.csv,.md,.json,.log,text/*"
            style={{ display: 'none' }}
            onChange={e => { onSelectFiles(e.target.files); e.target.value = ''; }}
          />
          <BottomZone
            active={activeTab}
            tabs={visibleTabs}
            onChange={(t) => { setActiveTab(t); setDrawerOpen(false); }}
            dark={dark}
            mode={mode}
            onToggleMode={toggleMode}
            onOpenHistory={() => setDrawerOpen(o => !o)}
            onOpenAttach={openFilePicker}
            pendingAttachments={pendingAttachments}
            onRemoveAttach={removeAttachment}
            input={input}
            setInput={updateInput}
            onSend={send}
            loading={loading}
            zoneRef={zoneRef}
          />
        </div>
      );
    }

    // ─── Mount ───────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      function showSignin()   { document.getElementById('auth-signin').style.display = 'flex'; document.getElementById('auth-rejected').style.display = 'none'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function showRejected() { document.getElementById('auth-signin').style.display = 'none'; document.getElementById('auth-rejected').style.display = 'flex'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} profile={{ id: 'dev-user-id', email: 'symon@morshedgroup.com', first_name: 'Symon', last_name: 'Yongco', title: 'Operations Manager', employee_id: 'TMG-001', access: 'admin', status: 'active', avatar_url: '' }} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(async function({ session }) {
        if (!session) { showSignin(); return; }
        const profile = await ProfileDB.ensureProfile(session.user);
        // Gate: a profile that exists but isn't active is blocked. No profile (error/not-yet-set-up) → fail open.
        if (profile && profile.status && profile.status !== 'active') { showRejected(); return; }
        root.render(<App user={session.user} profile={profile} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
