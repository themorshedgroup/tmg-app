<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#001A4A" />
  <title>TMG App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root {
      --tmg-navy:      #001A4A;
      --tmg-navy-deep: #000D26;
      --tmg-navy-mid:  #0A1E44;
      --tmg-gold:      #AD832F;
      --tmg-gold-soft: #C9A45A;
      --tmg-paper:     #FCFBF8;
      --tmg-border:    #E4DFD4;
      --tmg-slate:     #6B6B6B;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif;
      background: #FCFBF8;
      overscroll-behavior: none;
      color: #001A4A;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #000D26; color: #FCFBF8; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* ── Auth gate (sign-in + access-denied) — always navy, never inverts ── */
    #auth-overlay { font-family: 'Jost', sans-serif; }
    #auth-overlay * { box-sizing: border-box; margin: 0; padding: 0; }
    #auth-overlay .screen { width:100%; max-width:440px; min-height:100vh; margin:0 auto; display:flex; flex-direction:column; padding:0 32px; position:relative; overflow:hidden; background:radial-gradient(ellipse 80% 50% at 50% 36%, #0A2A6B 0%, #001A4A 62%); }
    #auth-overlay .screen[hidden] { display:none; }
    #auth-overlay .ring { position:absolute; left:50%; transform:translateX(-50%); border:1px solid rgba(201,164,90,.07); border-radius:50%; z-index:1; pointer-events:none; }
    #auth-overlay .r1 { top:-90px; width:360px; height:360px; }
    #auth-overlay .r2 { top:-36px; width:250px; height:250px; border-color:rgba(201,164,90,.05); }
    #auth-overlay .r3 { bottom:-110px; width:320px; height:320px; border-color:rgba(201,164,90,.05); }
    #auth-overlay .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:2; text-align:center; }
    #auth-overlay .foot { display:flex; flex-direction:column; align-items:center; gap:18px; padding-bottom:34px; position:relative; z-index:2; }
    #auth-overlay .glow-gold { position:absolute; top:36%; left:50%; transform:translate(-50%,-50%); width:250px; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(201,164,90,.1) 0%,transparent 66%); z-index:1; pointer-events:none; }
    #auth-overlay .logo { width:195px; object-fit:contain; margin-bottom:26px; }
    #auth-overlay .wordmark { font-size:42px; font-weight:600; letter-spacing:.14em; color:#fff; line-height:1; }
    #auth-overlay .values { display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:center; line-height:1.8; }
    #auth-overlay .val { font-size:8px; letter-spacing:.16em; font-weight:500; text-transform:uppercase; white-space:nowrap; color:#C9A45A; }
    #auth-overlay .sep { font-size:8px; color:rgba(201,164,90,.4); }
    #auth-overlay .btn-wrap { width:100%; }
    #auth-overlay .btn-google { display:flex; align-items:center; justify-content:center; gap:10px; width:80%; margin:0 auto; padding:15px; border-radius:11px; cursor:pointer; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:.14em; font-weight:500; background:#fff; color:#001A4A; border:none; transition:transform .12s ease,opacity .12s ease; }
    #auth-overlay .btn-google:hover { opacity:.92; }
    #auth-overlay .btn-google:active { transform:scale(.98); }
    #auth-overlay .terms { font-size:8px; letter-spacing:.1em; color:rgba(255,255,255,.22); text-align:center; margin-top:10px; }
    #auth-overlay .glow-red { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); width:250px; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(155,28,28,.14) 0%,transparent 66%); z-index:1; pointer-events:none; }
    #auth-overlay .lockwrap { width:60px; height:60px; border-radius:50%; border:1px solid rgba(248,113,113,.3); background:rgba(155,28,28,.12); display:flex; align-items:center; justify-content:center; margin-bottom:24px; }
    #auth-overlay .lockwrap i { font-size:28px; color:#F87171; }
    #auth-overlay .title { font-size:20px; font-weight:600; letter-spacing:.05em; color:#fff; margin-bottom:12px; }
    #auth-overlay .msg { font-size:12px; line-height:1.65; color:rgba(255,255,255,.55); max-width:260px; }
    #auth-overlay .contact-card { width:100%; background:rgba(255,255,255,.04); border:1px solid rgba(201,164,90,.18); border-radius:12px; padding:16px; text-align:center; }
    #auth-overlay .contact-lbl { font-size:8px; letter-spacing:.2em; text-transform:uppercase; color:rgba(201,164,90,.6); margin-bottom:7px; }
    #auth-overlay .contact-email { font-size:12px; font-weight:500; letter-spacing:.02em; color:#C9A45A; text-decoration:none; }
    #auth-overlay .btn-back { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; border-radius:11px; cursor:pointer; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:.14em; font-weight:500; background:transparent; border:1px solid rgba(255,255,255,.16); color:rgba(255,255,255,.6); transition:background .12s ease; }
    #auth-overlay .btn-back:hover { background:rgba(255,255,255,.04); }
    #auth-overlay .btn-back i { font-size:13px; }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── AI backend ──────────────────────────────────────────────────
    const AI_ENDPOINT = 'https://ipqoqhsnjubopybujetn.supabase.co/functions/v1/ai-chat';
    const SUPABASE_ANON = 'sb_publishable_Jg-roLg8M-BZJ7dBfjEeig_HIdniPaV';

    const SYSTEM_PROMPT =
      "You are the TMG assistant, an AI helper for The Morshed Group, a real estate team. " +

    function authToken() {
      return window.SupabaseAuth?._state?.session?.access_token || SUPABASE_ANON;
    }

    // Sends the running conversation to the ai-chat Edge Function and returns the reply text.
    async function callAI(messages) {
      const res = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken(),
          'apikey': SUPABASE_ANON,
        },
        body: JSON.stringify({ messages, system: SYSTEM_PROMPT, max_tokens: 4096 }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) {
        throw new Error(data.error || ('Request failed (' + res.status + ')'));
      }
      return data.text || '';
    }

    // ─── Google Calendar (read-only) via edge function ──────────────
    const CAL_ENDPOINT = 'https://ipqoqhsnjubopybujetn.supabase.co/functions/v1/google-calendar';
    async function callCalendar(payload) {
      const res = await fetch(CAL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken(), 'apikey': SUPABASE_ANON },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }
    async function fetchGoogleEvents(timeMin, timeMax) {
      const { ok, data } = await callCalendar({ action: 'list', timeMin, timeMax });
      if (!ok) { const err = new Error(data.error || 'calendar_error'); err.code = data.error; err.detail = data.detail || ''; throw err; }
      return data.events || [];
    }
    function connectGoogleCalendar(refreshToken) {
      callCalendar({ action: 'connect', refresh_token: refreshToken }).catch(() => {});
    }

    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }

    // Generates a short conversation title via the edge function; falls back to the first message.
    async function generateTitle(firstUserText) {
      const fallback = (firstUserText || 'New chat').replace(/\s+/g, ' ').trim().slice(0, 40);
      try {
        const res = await fetch(AI_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken(), 'apikey': SUPABASE_ANON },
          body: JSON.stringify({
            messages: [{ role: 'user', content: 'Conversation starts with: "' + firstUserText + '"\n\nReply with ONLY a 3-6 word title for it, no quotes, no punctuation at the end.' }],
            system: 'You write short, specific chat titles. Reply with only the title text.',
            max_tokens: 24,
          }),
        });
        const data = await res.json().catch(() => ({}));
        const t = (data.text || '').replace(/^["'\s]+|["'\s.]+$/g, '').trim();
        return t || fallback;
      } catch (e) {
        return fallback;
      }
    }

    // ─── Conversations DB (Supabase on prod; no-op/in-memory on localhost) ──
    const ConvDB = {
      client() { return window.SupabaseAuth?._client || null; },
      userId()  { return window.SupabaseAuth?._state?.session?.user?.id || null; },

      async loadConversations() {
        if (!this.client()) return [];
        const { data, error } = await this.client()
          .from('ai_conversations').select('*')
          .order('pinned', { ascending: false })
          .order('updated_at', { ascending: false });
        if (error) { console.error('[ConvDB] load:', error.message); return []; }
        return (data || []).map(r => ({
          id: r.id, type: r.type, workRequest: r.work_request,
          title: r.title || 'New chat', pinned: !!r.pinned, archived: !!r.archived,
          updatedAt: r.updated_at,
        }));
      },

      async createConversation({ type, workRequest, title }) {
        if (!this.client()) {
          return { id: 'local-' + Date.now(), type, workRequest: workRequest || null, title: title || 'New chat', pinned: false, archived: false };
        }
        const { data, error } = await this.client().from('ai_conversations').insert({
          user_id: this.userId(),
          type: type || 'ai',
          work_request: workRequest || null,
          title: title || null,
        }).select().single();
        if (error) { console.error('[ConvDB] create:', error.message); throw error; }
        return { id: data.id, type: data.type, workRequest: data.work_request, title: data.title || 'New chat', pinned: false, archived: false };
      },

      async updateConversation(id, fields) {
        if (!this.client() || String(id).startsWith('local-')) return;
        const mapped = { updated_at: new Date().toISOString() };
        if (fields.title    !== undefined) mapped.title    = fields.title;
        if (fields.pinned   !== undefined) mapped.pinned   = fields.pinned;
        if (fields.archived !== undefined) mapped.archived = fields.archived;
        const { error } = await this.client().from('ai_conversations').update(mapped).eq('id', id);
        if (error) console.error('[ConvDB] update:', error.message);
      },

      async touchConversation(id) {
        if (!this.client() || String(id).startsWith('local-')) return;
        await this.client().from('ai_conversations').update({ updated_at: new Date().toISOString() }).eq('id', id);
      },

      async deleteConversation(id) {
        if (!this.client() || String(id).startsWith('local-')) return;
        const { error } = await this.client().from('ai_conversations').delete().eq('id', id);
        if (error) console.error('[ConvDB] delete:', error.message);
      },

      async loadMessages(convId) {
        if (!this.client() || String(convId).startsWith('local-')) return [];
        const { data, error } = await this.client()
          .from('ai_messages').select('*').eq('conversation_id', convId)
          .order('created_at', { ascending: true });
        if (error) { console.error('[ConvDB] loadMessages:', error.message); return []; }
        const rows = data || [];
        const out = [];
        for (const r of rows) {
          const atts = Array.isArray(r.attachments) ? r.attachments : [];
          for (const a of atts) { if (a.path) a.url = await this.signedUrl(a.path); }
          out.push({ role: r.role, content: r.content || '', attachments: atts });
        }
        return out;
      },

      async insertMessage(convId, role, content, attachments) {
        if (!this.client() || String(convId).startsWith('local-')) return;
        // Strip transient fields (url/objectURL/textContent) before persisting.
        const slim = (attachments || []).map(a => ({
          kind: a.kind, name: a.name, mediaType: a.mediaType, path: a.path, size: a.size,
          ...(a.kind === 'text' ? { textContent: a.textContent } : {}),
        }));
        const { error } = await this.client().from('ai_messages').insert({
          conversation_id: convId, role, content,
          attachments: slim.length ? slim : null,
        });
        if (error) console.error('[ConvDB] insertMessage:', error.message);
      },

      async uploadAttachment(file, convId) {
        if (!this.client()) return null;
        const safe = (file.name || 'file').replace(/[^\w.\-]+/g, '_').slice(-80);
        const path = `${this.userId()}/${convId || 'tmp'}/${crypto.randomUUID()}-${safe}`;
        const { error } = await this.client().storage.from('chat-attachments').upload(path, file, {
          contentType: file.type || 'application/octet-stream', upsert: false,
        });
        if (error) { console.error('[ConvDB] upload:', error.message); throw error; }
        return path;
      },

      async signedUrl(path) {
        if (!this.client() || !path) return null;
        const { data, error } = await this.client().storage.from('chat-attachments').createSignedUrl(path, 7200);
        if (error) { console.error('[ConvDB] signedUrl:', error.message); return null; }
        return data?.signedUrl || null;
      },
    };

    // ─── Profiles / access ───────────────────────────────────────────
    // access → allowed bottom-nav tab ids. null = all tabs. 'more' is always allowed.
    const ROLE_TABS = {
      admin:      null,
      operations: null,
      agent:      ['chat', 'teamchat', 'calls', 'tasks', 'kpis', 'deals', 'more'],
      tc:         ['chat', 'teamchat', 'tasks', 'more'],
    };

    const ProfileDB = {
      client() { return window.SupabaseAuth?._client || null; },
      uid() { return window.SupabaseAuth?._state?.session?.user?.id || null; },

      // Returns the user's profile; auto-creates a pending one on first sign-in. Fail-open (null) on error.
      async ensureProfile(user) {
        if (!this.client()) return null;
        try {
          const { data, error } = await this.client().from('profiles').select('*').eq('id', user.id).maybeSingle();
          if (error) { console.error('[ProfileDB] load:', error.message); return null; }
          if (data) return data;
          const full = (user.user_metadata?.full_name || '').trim();
          const parts = full.split(' ');
          const first = parts.shift() || null;
          const last = parts.join(' ') || null;
          const { data: ins, error: e2 } = await this.client().from('profiles').insert({
            id: user.id, email: user.email, first_name: first, last_name: last,
            avatar_url: user.user_metadata?.avatar_url || null,
          }).select().single();
          if (e2) { console.error('[ProfileDB] create:', e2.message); return null; }
          return ins;
        } catch (e) { console.error('[ProfileDB] ensure:', e); return null; }
      },

      async loadAll() {
        if (!this.client()) return [];
        const { data, error } = await this.client().from('profiles').select('*').order('created_at', { ascending: true });
        if (error) { console.error('[ProfileDB] loadAll:', error.message); return []; }
        return data || [];
      },

      async updateMine(fields) {
        if (!this.client()) return;
        const { error } = await this.client().from('profiles').update({
          first_name: fields.first_name || null, last_name: fields.last_name || null, phone: fields.phone || null,
        }).eq('id', this.uid());
        if (error) { console.error('[ProfileDB] updateMine:', error.message); throw error; }
      },

      async adminUpdate(id, fields) {
        if (!this.client()) return;
        const mapped = {};
        ['employee_id', 'title', 'reports_to', 'access', 'status'].forEach(k => { if (fields[k] !== undefined) mapped[k] = fields[k] || null; });
        const { error } = await this.client().from('profiles').update(mapped).eq('id', id);
        if (error) { console.error('[ProfileDB] adminUpdate:', error.message); throw error; }
      },
    };

    // Maps a UI message to Claude API content (string, or blocks when it has attachments).
    function toApiContent(msg) {
      const atts = msg.attachments || [];
      if (!atts.length) return msg.content || '';
      const blocks = [];
      for (const a of atts) {
        if (a.kind === 'image' && a.url)      blocks.push({ type: 'image',    source: { type: 'url', url: a.url } });
        else if (a.kind === 'pdf' && a.url)   blocks.push({ type: 'document', source: { type: 'url', url: a.url } });
        else if (a.kind === 'text')           blocks.push({ type: 'text', text: 'Attached file "' + a.name + '":\n' + (a.textContent || '') });
      }
      if (msg.content) blocks.push({ type: 'text', text: msg.content });
      return blocks.length ? blocks : (msg.content || '');
    }

    const WORK_REQUESTS = [
      { key: 'kpis',                 label: 'Enter KPIs',                  short: 'KPIs' },
      { key: 'listing_presentation', label: 'Request Listing Presentation', short: 'Listing' },
    ];

    // ─── Work Mode pills ─────────────────────────────────────────────
    // Default pills shown when the work_pills table is empty/unreadable (preserves prior behavior).
    const FALLBACK_PILLS = [

      { id: 'fb-listing', label: 'Listing Presentation', icon: 'ti-presentation',    colorLight: '#AD832F', colorDark: '#C9A45A',               type: 'prompt', config: { prompt: 'Listing Presentation' }, enabled: true },
      { id: 'fb-showing', label: 'Add Showing',          icon: 'ti-home',            colorLight: '#001A4A', colorDark: 'rgba(255,255,255,0.6)', type: 'prompt', config: { prompt: 'Add Showing' },          enabled: true },
      { id: 'fb-comm',    label: 'Commission Log',       icon: 'ti-currency-dollar', colorLight: '#0F6E56', colorDark: '#5DCAA5',               type: 'prompt', config: { prompt: 'Commission Log' },       enabled: true },
      { id: 'fb-score',   label: 'Team Scorecard',       icon: 'ti-users',           colorLight: '#AD832F', colorDark: '#C9A45A',               type: 'prompt', config: { prompt: 'Team Scorecard' },        enabled: true },
      { id: 'fb-eod',     label: 'EOD Report',           icon: 'ti-file-text',       colorLight: '#AD832F', colorDark: '#C9A45A',               type: 'prompt', config: { prompt: 'EOD Report' },            enabled: true },
      { id: 'fb-weekly',  label: 'Weekly Summary',       icon: 'ti-calendar-stats',  colorLight: '#001A4A', colorDark: 'rgba(255,255,255,0.6)', type: 'prompt', config: { prompt: 'Weekly Summary' },        enabled: true },
    ];

    // Curated icon set for the pill builder's icon picker (all verified Tabler names).
    const PILL_ICONS = ['ti-chart-bar', 'ti-presentation', 'ti-home', 'ti-currency-dollar', 'ti-users', 'ti-file-text', 'ti-calendar-stats', 'ti-sparkles', 'ti-clipboard', 'ti-clipboard-list', 'ti-mail', 'ti-phone', 'ti-map-pin', 'ti-building', 'ti-key', 'ti-calendar', 'ti-checklist', 'ti-notes', 'ti-report', 'ti-target', 'ti-trophy', 'ti-coin', 'ti-briefcase', 'ti-message'];

    // Color presets (light/dark pair) for pills.
    const PILL_COLORS = [
      { l: '#AD832F', d: '#C9A45A' },                 // gold
      { l: '#001A4A', d: 'rgba(255,255,255,0.6)' },   // navy
      { l: '#0F6E56', d: '#5DCAA5' },                 // green
      { l: '#9A3B3B', d: '#E58A8A' },                 // red
      { l: '#5A3FA0', d: '#B79CEB' },                 // purple
    ];

    // Make a safe template key from a label/question.
    function slugKey(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24); }

    // Fill {key} placeholders from collected values; fall back to "Label: value" lines.
    function composeFromTemplate(template, values, items) {
      if (template && template.trim()) {
        return template.replace(/\{(\w+)\}/g, (m, k) => (values[k] !== undefined && values[k] !== '' ? values[k] : ''));
      }
      return (items || []).map(it => ((it.label || it.question || it.key) + ': ' + (values[it.key] || ''))).join('\n');
    }

    // Supabase helper for work_pills (mirrors ConvDB/ProfileDB: fail-open reads, throwing writes).
    const PillDB = {
      client() { return window.SupabaseAuth?._client || null; },
      uid() { return window.SupabaseAuth?._state?.session?.user?.id || null; },
      _map(r) { return { id: r.id, label: r.label, icon: r.icon, colorLight: r.color_light, colorDark: r.color_dark, type: r.type, config: r.config || {}, enabled: r.enabled, sortOrder: r.sort_order }; },
      async list() {
        if (!this.client()) return null;
        const { data, error } = await this.client().from('work_pills').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true });
        if (error) { console.error('[PillDB] list:', error.message); return null; }
        return (data || []).map(this._map);
      },
      async create(p) {
        if (!this.client()) return;
        const { error } = await this.client().from('work_pills').insert({
          label: p.label, icon: p.icon, color_light: p.colorLight, color_dark: p.colorDark,
          type: p.type, config: p.config || {}, enabled: p.enabled !== false, sort_order: p.sortOrder || 0, created_by: this.uid(),
        });
        if (error) { console.error('[PillDB] create:', error.message); throw error; }
      },
      async update(id, f) {
        if (!this.client()) return;
        const m = {};
        if (f.label !== undefined) m.label = f.label;
        if (f.icon !== undefined) m.icon = f.icon;
        if (f.colorLight !== undefined) m.color_light = f.colorLight;
        if (f.colorDark !== undefined) m.color_dark = f.colorDark;
        if (f.type !== undefined) m.type = f.type;
        if (f.config !== undefined) m.config = f.config;
        if (f.enabled !== undefined) m.enabled = f.enabled;
        if (f.sortOrder !== undefined) m.sort_order = f.sortOrder;
        const { error } = await this.client().from('work_pills').update(m).eq('id', id);
        if (error) { console.error('[PillDB] update:', error.message); throw error; }
      },
      async remove(id) {
        if (!this.client()) return;
        const { error } = await this.client().from('work_pills').delete().eq('id', id);
        if (error) { console.error('[PillDB] remove:', error.message); throw error; }
      },
      async reorder(ids) {
        if (!this.client()) return;
        for (let i = 0; i < ids.length; i++) {
          const { error } = await this.client().from('work_pills').update({ sort_order: i }).eq('id', ids[i]);
          if (error) { console.error('[PillDB] reorder:', error.message); throw error; }
        }
      },
    };

    // SMS follow-up message templates (single row id=1). n8n reads these at send time.
    const TemplateDB = {
      client() { return window.SupabaseAuth?._client || null; },
      async load() {
        const defs = { msg1: '', msg2: '', msg3: '' };
        if (!this.client()) return defs;
        const { data, error } = await this.client().from('followup_templates').select('msg1,msg2,msg3').eq('id', 1).maybeSingle();
        if (error) { console.error('[TemplateDB] load:', error.message); return defs; }
        return data || defs;
      },
      async save(t) {
        if (!this.client()) return;
        const { error } = await this.client().from('followup_templates').upsert({ id: 1, msg1: t.msg1 || '', msg2: t.msg2 || '', msg3: t.msg3 || '', updated_at: new Date().toISOString() });
        if (error) { console.error('[TemplateDB] save:', error.message); throw error; }
      },
    };

    // ─── AI Chat Tab ─────────────────────────────────────────────────
    function AIChatTab({ user, messages, loading, mode, dark, pills, onPill }) {
      const firstName = (user?.user_metadata?.full_name || 'there').split(' ')[0];
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, loading]);

      const empty = messages.length === 0;

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative' }}>
          {/* Messages */}
          <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', padding: mode === 'work' ? '20px 16px 64px' : '20px 16px' }}>
            {empty ? (
              <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '0 24px' }}>
                <div style={{ fontSize: '2rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, fontFamily: C.fontDisplay }}>
                  {greeting()}, {firstName}
                </div>
                <div style={{ fontSize: '0.8rem', color: C.textSecondary, marginTop: 8, letterSpacing: '0.04em' }}>
                  {mode === 'work' ? 'What would you like to do?' : 'How can I help you today?'}
                </div>
              </div>
            ) : (
              messages.map((m, i) => {
                const isUser = m.role === 'user';
                return (
                  <div key={i} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start', marginBottom: 12 }}>
                    <div style={{
                      maxWidth: '82%', padding: '10px 14px', borderRadius: 16,
                      fontSize: '0.9rem', lineHeight: 1.55, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                      background: isUser ? C.navy : (m.error ? '#FDECEA' : C.surface),
                      color: isUser ? '#fff' : (m.error ? C.red : C.textPrimary),
                      border: isUser ? 'none' : `1px solid ${m.error ? C.red + '55' : C.border}`,
                      borderBottomRightRadius: isUser ? 4 : 16,
                      borderBottomLeftRadius: isUser ? 16 : 4,
                      boxShadow: isUser ? 'none' : '0 1px 2px rgba(0,26,74,0.05)',
                    }}>
                      {(m.attachments || []).length > 0 && (
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: m.content ? 8 : 0 }}>
                          {m.attachments.map((a, ai) => (
                            a.kind === 'image' && a.url ? (
                              <a key={ai} href={a.url} target="_blank" rel="noopener noreferrer">
                                <img src={a.url} alt={a.name} style={{ maxWidth: 200, maxHeight: 200, borderRadius: 10, display: 'block', objectFit: 'cover' }} />
                              </a>
                            ) : (
                              <a key={ai} href={a.url || undefined} target="_blank" rel="noopener noreferrer" style={{
                                display: 'flex', alignItems: 'center', gap: 7, padding: '8px 10px', borderRadius: 10, maxWidth: 220,
                                background: isUser ? 'rgba(255,255,255,0.12)' : C.bg,
                                border: `1px solid ${isUser ? 'rgba(255,255,255,0.18)' : C.border}`,
                                textDecoration: 'none', color: isUser ? '#fff' : C.textPrimary,
                              }}>
                                <i className={`ti ${a.kind === 'pdf' ? 'ti-file-type-pdf' : 'ti-file-text'}`} style={{ fontSize: 18, color: isUser ? '#fff' : C.gold, flexShrink: 0 }} />
                                <span style={{ fontSize: '0.75rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{a.name}</span>
                              </a>
                            )
                          ))}
                        </div>
                      )}
                      {m.content}
                    </div>
                  </div>
                );
              })
            )}

                  Thinking…
                </div>
              </div>
            )}
          </div>
          {/* Work-mode quick-action chips — floated above the chat bar so the greeting stays put */}
          {mode === 'work' && pills && pills.length > 0 && (
            <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, display: 'flex', gap: 7, overflowX: 'auto', padding: '10px 16px', borderTop: `1px solid ${dark ? '#152545' : C.border}`, background: dark ? '#000D26' : C.bg }}>
              {pills.map((chip) => (
                <button key={chip.id} onClick={() => onPill(chip)} style={{

                </button>

            </div>

      );
    }

    // ─── Settings Tab (placeholder for now) ──────────────────────────
    const ACCESS_LABEL = { admin: 'Admin', operations: 'Operations', agent: 'Agent', tc: 'TC', pending: 'Pending' };
    const CARD = { background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)', borderRadius: 14, padding: 16, marginBottom: 14 };

    // Admin-only user-management console (under the More tab). Replaces editing in Supabase.
    function AdminUsers() {
      const [users, setUsers] = useState([]);
      const [openId, setOpenId] = useState(null);
      const refresh = () => ProfileDB.loadAll().then(setUsers);
      useEffect(() => { refresh(); }, []);
      const nameOf = (u) => (((u.first_name || '') + ' ' + (u.last_name || '')).trim()) || u.email || 'User';
      const pending = users.filter(u => u.status === 'pending');
      const others = users.filter(u => u.status !== 'pending');
      const inp = { width: '100%', padding: '8px 10px', background: C.surfaceHover, border: `1px solid ${C.border}`, borderRadius: 8, color: C.textPrimary, fontSize: '0.82rem', outline: 'none', fontFamily: C.fontSans };
      const lbl = { fontSize: '0.6rem', color: C.textSecondary, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 3, fontFamily: C.fontSans };

      const Editor = ({ u }) => {
        const [emp, setEmp] = useState(u.employee_id || '');
        const [title, setTitle] = useState(u.title || '');
        const [reports, setReports] = useState(u.reports_to || '');
        const [access, setAccess] = useState(u.access || 'pending');
        const [status, setStatus] = useState(u.status || 'pending');
        const [saving, setSaving] = useState(false);
        async function save() {
          setSaving(true);
          try { await ProfileDB.adminUpdate(u.id, { employee_id: emp, title, reports_to: reports || null, access, status }); await refresh(); setOpenId(null); }
          catch (e) { alert('Could not save: ' + (e.message || e)); }
          finally { setSaving(false); }
        }
        return (
          <div style={{ padding: '10px 12px', background: C.bg, borderRadius: 10, marginTop: 6 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
              <div><div style={lbl}>Employee ID</div><input value={emp} onChange={e => setEmp(e.target.value)} style={inp} /></div>
              <div><div style={lbl}>Title</div><input value={title} onChange={e => setTitle(e.target.value)} style={inp} /></div>
              <div><div style={lbl}>Access</div><select value={access} onChange={e => setAccess(e.target.value)} style={inp}>{['admin', 'operations', 'agent', 'tc', 'pending'].map(a => <option key={a} value={a}>{ACCESS_LABEL[a]}</option>)}</select></div>
              <div><div style={lbl}>Status</div><select value={status} onChange={e => setStatus(e.target.value)} style={inp}>{['active', 'pending', 'disabled'].map(s => <option key={s} value={s}>{s}</option>)}</select></div>
              <div style={{ gridColumn: 'span 2' }}><div style={lbl}>Reports to</div><select value={reports} onChange={e => setReports(e.target.value)} style={inp}><option value="">— None —</option>{users.filter(x => x.id !== u.id).map(x => <option key={x.id} value={x.id}>{nameOf(x)}</option>)}</select></div>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button onClick={save} disabled={saving} style={{ flex: 1, padding: '8px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.8rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>{saving ? 'Saving…' : 'Save'}</button>
              <button onClick={() => setOpenId(null)} style={{ flex: 1, padding: '8px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.8rem', cursor: 'pointer', fontFamily: C.fontSans }}>Close</button>
            </div>
          </div>
        );
      };

      const row = (u) => (
        <div key={u.id} style={{ borderBottom: `1px solid ${C.border}`, padding: '8px 0' }}>
          <div onClick={() => setOpenId(openId === u.id ? null : u.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '0.86rem', fontWeight: 600, color: C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{nameOf(u)}</div>
              <div style={{ fontSize: '0.7rem', color: C.textSecondary, marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{u.email}</div>
            </div>
            <span style={{ flexShrink: 0, fontSize: '0.58rem', fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: u.status === 'active' ? C.green : (u.status === 'pending' ? C.amber : C.red) }}>{u.status}</span>
            <span style={{ flexShrink: 0, fontSize: '0.6rem', fontWeight: 600, padding: '2px 7px', borderRadius: 8, background: C.surfaceHover, color: C.gold }}>{ACCESS_LABEL[u.access] || u.access || '—'}</span>
            <i className={`ti ti-chevron-${openId === u.id ? 'up' : 'down'}`} style={{ fontSize: 14, color: C.textMuted, flexShrink: 0 }} />
          </div>
          {openId === u.id && <Editor u={u} />}
        </div>
      );

      return (
        <div style={CARD}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 4, fontFamily: C.fontSans, display: 'flex', alignItems: 'center', gap: 6 }}>
            <i className="ti ti-users" style={{ fontSize: 14 }} />Manage Users
          </div>
          <div style={{ fontSize: '0.74rem', color: C.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>Approve new sign-ins and set each person's access, title, employee ID, and reporting line.</div>
          {pending.length > 0 && <div style={{ fontSize: '0.58rem', fontWeight: 600, color: C.amber, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 2 }}>Pending approval</div>}
          {pending.map(row)}
          {others.length > 0 && <div style={{ fontSize: '0.58rem', fontWeight: 600, color: C.textMuted, letterSpacing: '0.1em', textTransform: 'uppercase', margin: '12px 0 2px' }}>Team</div>}
          {others.map(row)}
          {users.length === 0 && <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '16px 0' }}>No users yet.</div>}
        </div>
      );
    }

    // Claude pricing — USD per 1,000,000 tokens, matched by model-id substring.
    // Update these when Anthropic changes prices; historical rows re-cost on view.
    const PRICING = {
      'claude-3-5-haiku':  { in: 0.80, out: 4.00 },
      'claude-3-5-sonnet': { in: 3.00, out: 15.00 },
      'claude-3-haiku':    { in: 0.25, out: 1.25 },
      'claude-3-opus':     { in: 15.00, out: 75.00 },
      'claude-haiku-4':    { in: 1.00, out: 5.00 },
      'claude-sonnet-4':   { in: 3.00, out: 15.00 },
      'claude-opus-4':     { in: 15.00, out: 75.00 },
    };
    const priceFor = (model) => { const m = model || ''; const k = Object.keys(PRICING).find(x => m.includes(x)); return PRICING[k] || PRICING['claude-3-5-sonnet']; };
    const rowCost = (r) => { const p = priceFor(r.model); return (Number(r.input_tokens) || 0) / 1e6 * p.in + (Number(r.output_tokens) || 0) / 1e6 * p.out; };
    const fmtTok = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n); };
    const fmtUsd = (n) => '$' + (Number(n) || 0).toFixed(2);

    // Admin-only AI usage + estimated cost per user. Reads the usage_summary RPC.
    function AdminUsage() {
      const [rows, setRows] = useState(null); // null = loading
      const [users, setUsers] = useState([]);
      const [days, setDays] = useState(30);
      useEffect(() => {
        const c = window.SupabaseAuth && window.SupabaseAuth._client;
        if (!c) { setRows([]); return; }
        setRows(null);
        Promise.all([c.rpc('usage_summary', { days }), ProfileDB.loadAll()]).then(([res, us]) => {
          if (res.error) { console.error('[Usage]', res.error.message); setRows([]); }
          else setRows(res.data || []);
          setUsers(us || []);
        });
      }, [days]);

      const nameOf = (id) => { const u = users.find(x => x.id === id); return u ? ((((u.first_name || '') + ' ' + (u.last_name || '')).trim()) || u.email) : 'Unknown user'; };

      const byUser = {};
      (rows || []).forEach(r => {
        const k = r.user_id || 'unknown';
        if (!byUser[k]) byUser[k] = { inTok: 0, outTok: 0, calls: 0, cost: 0 };
        byUser[k].inTok += Number(r.input_tokens) || 0;
        byUser[k].outTok += Number(r.output_tokens) || 0;
        byUser[k].calls += Number(r.calls) || 0;
        byUser[k].cost += rowCost(r);
      });
      const list = Object.entries(byUser).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.cost - a.cost);
      const total = list.reduce((s, u) => ({ inTok: s.inTok + u.inTok, outTok: s.outTok + u.outTok, calls: s.calls + u.calls, cost: s.cost + u.cost }), { inTok: 0, outTok: 0, calls: 0, cost: 0 });

      const pill = (d, label) => (
        <button key={d} onClick={() => setDays(d)} style={{ padding: '5px 11px', borderRadius: 8, cursor: 'pointer', fontFamily: C.fontSans, fontSize: '0.72rem', fontWeight: days === d ? 600 : 500, border: `1px solid ${days === d ? C.navy : C.border}`, background: days === d ? C.navy : 'none', color: days === d ? '#fff' : C.textSecondary }}>{label}</button>
      );

      return (
        <div style={CARD}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 4, fontFamily: C.fontSans, display: 'flex', alignItems: 'center', gap: 6 }}>
            <i className="ti ti-coin" style={{ fontSize: 14 }} />AI Usage &amp; Cost
          </div>
          <div style={{ fontSize: '0.74rem', color: C.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>Estimated Claude spend per person. Approximate, based on public token prices.</div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>{[[7, '7 days'], [30, '30 days'], [90, '90 days']].map(([d, l]) => pill(d, l))}</div>
          {rows === null ? (
            <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '14px 0' }}>Loading…</div>
          ) : (
            <React.Fragment>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: C.bg, borderRadius: 10, marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: '0.58rem', textTransform: 'uppercase', letterSpacing: '0.08em', color: C.textMuted, fontFamily: C.fontSans }}>Total · {days}d</div>
                  <div style={{ fontSize: '1.15rem', fontWeight: 700, color: C.navy, fontFamily: C.fontSans }}>{fmtUsd(total.cost)}</div>
                </div>
                <div style={{ textAlign: 'right', fontSize: '0.7rem', color: C.textSecondary, fontFamily: C.fontSans, lineHeight: 1.5 }}>
                  {fmtTok(total.inTok)} in · {fmtTok(total.outTok)} out<br />{total.calls} calls
                </div>
              </div>
              {list.length === 0 && <div style={{ textAlign: 'center', color: C.textMuted, fontSize: '0.8rem', padding: '12px 0' }}>No AI usage in this period.</div>}
              {list.map(u => (
                <div key={u.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: '0.86rem', fontWeight: 600, color: C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{nameOf(u.id)}</div>
                    <div style={{ fontSize: '0.68rem', color: C.textSecondary, marginTop: 1, fontFamily: C.fontSans }}>{fmtTok(u.inTok)} in · {fmtTok(u.outTok)} out · {u.calls} calls</div>
                  </div>
                  <div style={{ flexShrink: 0, fontSize: '0.92rem', fontWeight: 700, color: C.gold, fontFamily: C.fontSans }}>{fmtUsd(u.cost)}</div>
                </div>
              ))}
            </React.Fragment>
          )}
        </div>
      );
    }

    // ─── Work Mode builder (admin) ───────────────────────────────────
    function IconGridPicker({ dark, value, onChange }) {
      const bord = dark ? '#152545' : C.border;
      return (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
          {PILL_ICONS.map(name => {
            const on = value === name;
            return (
              <button key={name} onClick={() => onChange(name)} style={{ width: 38, height: 38, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? (dark ? 'rgba(173,131,47,0.2)' : '#F3EBDA') : (dark ? '#06101F' : '#F7F4EE'), border: on ? `2px solid ${dark ? C.gold : C.navy}` : `1px solid ${bord}`, color: dark ? '#fff' : C.navy }}>
                <i className={`ti ${name}`} style={{ fontSize: 18 }} />
              </button>
            );
          })}
        </div>
      );
    }

    function PromptConfigEditor({ config, setConfig, inp, lbl, sub }) {
      return (
        <div>
          <div style={lbl}>AI instruction</div>
          <textarea value={config.prompt || ''} onChange={e => setConfig({ ...config, prompt: e.target.value })} placeholder="e.g. Ask me for this week's KPIs (calls, appointments, contracts) and format them into a clean summary." rows={5} style={{ ...inp, resize: 'vertical', lineHeight: 1.5 }} />
          <div style={{ fontSize: '0.68rem', color: sub, marginTop: 6, lineHeight: 1.5, fontFamily: C.fontSans }}>Sent to the AI when the pill is tapped.</div>
        </div>
      );
    }

    function FormConfigEditor({ config, setConfig, inp, lbl, sub, bord }) {
      const fields = config.fields || [];
      const setFields = (fs) => setConfig({ ...config, fields: fs });
      const update = (i, patch) => setFields(fields.map((f, idx) => idx === i ? { ...f, ...patch } : f));
      const add = () => setFields([...fields, { key: '', label: '', kind: 'text' }]);
      const remove = (i) => setFields(fields.filter((_, idx) => idx !== i));
      const small = { ...inp, padding: '7px 9px', fontSize: '0.8rem' };
      return (
        <div>
          <div style={lbl}>Fields</div>
          {fields.map((f, i) => (
            <div key={i} style={{ border: `1px solid ${bord}`, borderRadius: 10, padding: 10, marginBottom: 8 }}>
              <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
                <input value={f.label} onChange={e => update(i, { label: e.target.value, key: f.key || slugKey(e.target.value) })} placeholder="Question / label" style={{ ...small, flex: 1 }} />
                <button onClick={() => remove(i)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.red, fontSize: 16, padding: 2 }}><i className="ti ti-x" /></button>
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <input value={f.key} onChange={e => update(i, { key: e.target.value })} placeholder="key" style={{ ...small, width: 110 }} />
                <select value={f.kind} onChange={e => update(i, { kind: e.target.value })} style={{ ...small, flex: 1 }}>
                  <option value="text">Text</option>
                  <option value="number">Number</option>
                  <option value="select">Choices</option>
                </select>
              </div>
              {f.kind === 'select' && <input value={(f.options || []).join(', ')} onChange={e => update(i, { options: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })} placeholder="Option A, Option B, Option C" style={{ ...small, marginTop: 6 }} />}
            </div>
          ))}
          <button onClick={add} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '7px 11px', borderRadius: 9, border: `1px dashed ${bord}`, background: 'none', cursor: 'pointer', color: sub, fontFamily: C.fontSans, fontSize: '0.8rem', marginBottom: 12 }}><i className="ti ti-plus" style={{ fontSize: 14 }} />Add field</button>
          <div style={lbl}>Message template <span style={{ textTransform: 'none', fontWeight: 400 }}>(use {'{key}'})</span></div>
          <textarea value={config.template || ''} onChange={e => setConfig({ ...config, template: e.target.value })} placeholder="Create a listing presentation for {address}, listed at {price}." rows={3} style={{ ...inp, resize: 'vertical', lineHeight: 1.5 }} />
          <div style={{ fontSize: '0.68rem', color: sub, marginTop: 6, lineHeight: 1.5, fontFamily: C.fontSans }}>On submit, values replace {'{key}'} and the message is sent to the AI. Leave blank to send each field as “Label: value”.</div>
        </div>
      );
    }

    function StepsConfigEditor({ config, setConfig, inp, lbl, sub, bord }) {
      const steps = config.steps || [];
      const setSteps = (ss) => setConfig({ ...config, steps: ss });
      const update = (i, patch) => setSteps(steps.map((s, idx) => idx === i ? { ...s, ...patch } : s));
      const add = () => setSteps([...steps, { key: '', question: '' }]);
      const remove = (i) => setSteps(steps.filter((_, idx) => idx !== i));
      const move = (i, dir) => { const j = i + dir; if (j < 0 || j >= steps.length) return; const a = steps.slice(); const t = a[i]; a[i] = a[j]; a[j] = t; setSteps(a); };
      const small = { ...inp, padding: '7px 9px', fontSize: '0.8rem' };
      return (
        <div>
          <div style={lbl}>Intro <span style={{ textTransform: 'none', fontWeight: 400 }}>(optional)</span></div>
          <input value={config.intro || ''} onChange={e => setConfig({ ...config, intro: e.target.value })} placeholder="Let's build your report." style={inp} />
          <div style={{ ...lbl, marginTop: 14 }}>Questions</div>
          {steps.map((s, i) => (
            <div key={i} style={{ border: `1px solid ${bord}`, borderRadius: 10, padding: 10, marginBottom: 8 }}>
              <div style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'flex-start' }}>
                <span style={{ color: sub, fontSize: '0.8rem', fontWeight: 600, paddingTop: 8 }}>{i + 1}.</span>
                <input value={s.question} onChange={e => update(i, { question: e.target.value, key: s.key || slugKey(e.target.value) })} placeholder="What's the goal?" style={{ ...small, flex: 1 }} />
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  <button onClick={() => move(i, -1)} disabled={i === 0} style={{ background: 'none', border: 'none', cursor: i === 0 ? 'default' : 'pointer', color: sub, fontSize: 13, padding: 0 }}><i className="ti ti-chevron-up" /></button>
                  <button onClick={() => move(i, 1)} disabled={i === steps.length - 1} style={{ background: 'none', border: 'none', cursor: i === steps.length - 1 ? 'default' : 'pointer', color: sub, fontSize: 13, padding: 0 }}><i className="ti ti-chevron-down" /></button>
                </div>
                <button onClick={() => remove(i)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.red, fontSize: 16, padding: 2 }}><i className="ti ti-x" /></button>
              </div>
              <input value={s.key} onChange={e => update(i, { key: e.target.value })} placeholder="key" style={{ ...small, width: 110 }} />
            </div>
          ))}
          <button onClick={add} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '7px 11px', borderRadius: 9, border: `1px dashed ${bord}`, background: 'none', cursor: 'pointer', color: sub, fontFamily: C.fontSans, fontSize: '0.8rem', marginBottom: 12 }}><i className="ti ti-plus" style={{ fontSize: 14 }} />Add question</button>
          <div style={lbl}>Final message template <span style={{ textTransform: 'none', fontWeight: 400 }}>(use {'{key}'})</span></div>
          <textarea value={config.template || ''} onChange={e => setConfig({ ...config, template: e.target.value })} placeholder="Write an EOD report. Goal: {goal}. Audience: {audience}." rows={3} style={{ ...inp, resize: 'vertical', lineHeight: 1.5 }} />
          <div style={{ fontSize: '0.68rem', color: sub, marginTop: 6, lineHeight: 1.5, fontFamily: C.fontSans }}>After the last question, answers replace {'{key}'} and the message is sent to the AI.</div>
        </div>
      );
    }

    function PillEditor({ dark, pill, onCancel, onSave }) {
      const [label, setLabel] = useState(pill?.label || '');
      const [icon, setIcon] = useState(pill?.icon || 'ti-sparkles');
      const [colorLight, setColorLight] = useState(pill?.colorLight || PILL_COLORS[0].l);
      const [colorDark, setColorDark] = useState(pill?.colorDark || PILL_COLORS[0].d);
      const [type, setType] = useState(pill?.type || 'prompt');
      const [enabled, setEnabled] = useState(pill?.enabled !== false);
      const [config, setConfig] = useState(pill?.config || {});
      const [saving, setSaving] = useState(false);

      const bord = dark ? '#152545' : C.border;
      const cardBg = dark ? '#0A1730' : '#FFFFFF';
      const txt = dark ? '#FFFFFF' : C.navy;
      const sub = dark ? 'rgba(255,255,255,0.55)' : C.textSecondary;
      const inp = { width: '100%', padding: '9px 11px', background: dark ? '#06101F' : C.surfaceHover, border: `1px solid ${bord}`, borderRadius: 9, color: dark ? '#fff' : C.textPrimary, fontSize: '0.85rem', outline: 'none', fontFamily: C.fontSans, boxSizing: 'border-box' };
      const lbl = { fontSize: '0.62rem', color: sub, letterSpacing: '0.07em', textTransform: 'uppercase', marginBottom: 5, fontFamily: C.fontSans, fontWeight: 600 };
      const section = { background: cardBg, border: `1px solid ${bord}`, borderRadius: 12, padding: 14, marginBottom: 12 };

      function validate() {
        if (!label.trim()) return 'Please enter a label.';
        if (type === 'prompt' && !(config.prompt || '').trim()) return 'Please enter the AI instruction.';
        if (type === 'form') {
          const fs = config.fields || [];
          if (!fs.length) return 'Add at least one field.';
          const keys = fs.map(f => (f.key || '').trim());
          if (keys.some(k => !k)) return 'Every field needs a key.';
          if (new Set(keys).size !== keys.length) return 'Field keys must be unique.';
        }
        if (type === 'steps') {
          const ss = config.steps || [];
          if (!ss.length) return 'Add at least one question.';
          const keys = ss.map(s => (s.key || '').trim());
          if (keys.some(k => !k)) return 'Every question needs a key.';
          if (new Set(keys).size !== keys.length) return 'Question keys must be unique.';
          if (ss.some(s => !(s.question || '').trim())) return 'Every step needs a question.';
        }
        return null;
      }

      async function submit() {
        const err = validate();
        if (err) { alert(err); return; }
        setSaving(true);
        try { await onSave({ label: label.trim(), icon, colorLight, colorDark, type, enabled, config }, pill?.id); }
        finally { setSaving(false); }
      }

      return (
        <div>
          <div style={section}>
            <div style={lbl}>Label</div>
            <input value={label} onChange={e => setLabel(e.target.value)} placeholder="e.g. Enter KPIs" style={inp} />
            <div style={{ ...lbl, marginTop: 14 }}>Icon</div>
            <IconGridPicker dark={dark} value={icon} onChange={setIcon} />
            <div style={{ ...lbl, marginTop: 14 }}>Color</div>
            <div style={{ display: 'flex', gap: 10 }}>
              {PILL_COLORS.map((c, i) => {
                const on = colorLight === c.l && colorDark === c.d;
                return <button key={i} onClick={() => { setColorLight(c.l); setColorDark(c.d); }} style={{ width: 30, height: 30, borderRadius: '50%', cursor: 'pointer', background: dark ? c.d : c.l, border: on ? `2px solid ${dark ? '#fff' : C.navy}` : '2px solid transparent', outline: on ? `2px solid ${dark ? c.d : c.l}` : 'none', outlineOffset: 2 }} />;
              })}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 16 }}>
              <span style={{ ...lbl, marginBottom: 0 }}>Enabled</span>
              <button onClick={() => setEnabled(v => !v)} style={{ width: 44, height: 26, borderRadius: 13, border: 'none', cursor: 'pointer', background: enabled ? (dark ? C.gold : C.navy) : (dark ? '#1E3360' : '#D8D2C6'), position: 'relative', transition: 'background 0.15s' }}>
                <span style={{ position: 'absolute', top: 3, left: enabled ? 21 : 3, width: 20, height: 20, borderRadius: '50%', background: '#fff', transition: 'left 0.15s' }} />
              </button>
            </div>
          </div>

          <div style={section}>
            <div style={lbl}>What happens when tapped</div>
            <select value={type} onChange={e => setType(e.target.value)} style={inp}>
              <option value="prompt">Send an AI prompt</option>
              <option value="form">Open a form</option>
              <option value="steps">Guided questions</option>
            </select>
            <div style={{ marginTop: 14 }}>
              {type === 'prompt' && <PromptConfigEditor config={config} setConfig={setConfig} inp={inp} lbl={lbl} sub={sub} />}
              {type === 'form' && <FormConfigEditor config={config} setConfig={setConfig} inp={inp} lbl={lbl} sub={sub} bord={bord} />}
              {type === 'steps' && <StepsConfigEditor config={config} setConfig={setConfig} inp={inp} lbl={lbl} sub={sub} bord={bord} />}
            </div>
          </div>

          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={submit} disabled={saving} style={{ flex: 1, padding: 12, background: dark ? C.gold : C.navy, color: '#fff', border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>{saving ? 'Saving…' : 'Save pill'}</button>
            <button onClick={onCancel} style={{ flex: 1, padding: 12, background: 'none', color: sub, border: `1px solid ${bord}`, borderRadius: 12, fontSize: '0.9rem', cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button>
          </div>
        </div>
      );
    }

    function PillRow({ dark, pill, first, last, onEdit, onDelete, onUp, onDown }) {
      const cardBg = dark ? '#0A1730' : '#FFFFFF';
      const bord = dark ? '#152545' : C.border;
      const txt = dark ? '#FFFFFF' : C.navy;
      const sub = dark ? 'rgba(255,255,255,0.5)' : C.textSecondary;
      const typeLabel = { prompt: 'Prompt', form: 'Form', steps: 'Steps' }[pill.type] || pill.type;
      const arrow = (dir, disabled, fn) => <button onClick={fn} disabled={disabled} style={{ background: 'none', border: 'none', cursor: disabled ? 'default' : 'pointer', color: disabled ? (dark ? 'rgba(255,255,255,0.15)' : '#D8D2C6') : sub, fontSize: 15, padding: 0, display: 'flex' }}><i className={`ti ti-chevron-${dir}`} /></button>;
      return (

          <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={onEdit}>

        </div>

    function WorkModeBuilder({ dark, onClose, onSaved }) {
      const [pills, setPills] = useState(null);
      const [editing, setEditing] = useState(null); // pill | { __new:true } | null
      const refresh = () => PillDB.list().then(r => setPills(r || []));
      useEffect(() => { refresh(); }, []);

      const bg = dark ? '#000D26' : C.bg;
      const bord = dark ? '#152545' : C.border;
      const txt = dark ? '#FFFFFF' : C.navy;
      const sub = dark ? 'rgba(255,255,255,0.55)' : C.textSecondary;

      async function savePill(obj, id) {
        if (id) await PillDB.update(id, obj);
        else await PillDB.create({ ...obj, sortOrder: (pills ? pills.length : 0) });
        setEditing(null);
        await refresh();
        onSaved && onSaved();
      }
      async function deletePill(id) {
        if (!window.confirm('Delete this pill?')) return;
        try { await PillDB.remove(id); await refresh(); onSaved && onSaved(); }
        catch (e) { alert('Could not delete: ' + (e.message || e)); }
      }
      async function move(idx, dir) {
        if (!pills) return;
        const j = idx + dir;
        if (j < 0 || j >= pills.length) return;
        const arr = pills.slice();
        const t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
        setPills(arr);
        try { await PillDB.reorder(arr.map(p => p.id)); onSaved && onSaved(); }
        catch (e) { alert('Could not reorder: ' + (e.message || e)); refresh(); }
      }

      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 50, background: bg, display: 'flex', flexDirection: 'column' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 'calc(12px + env(safe-area-inset-top)) 16px 12px', borderBottom: `1px solid ${bord}`, flexShrink: 0 }}>
            <button onClick={editing ? () => setEditing(null) : onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: txt, fontSize: 22, display: 'flex', alignItems: 'center', padding: 0 }}><i className="ti ti-chevron-left" /></button>
            <div style={{ flex: 1, fontFamily: C.fontDisplay, fontStyle: 'italic', fontSize: '1.25rem', color: txt }}>{editing ? (editing.__new ? 'New Pill' : 'Edit Pill') : 'Work Mode Pills'}</div>
            {!editing && <button onClick={() => setEditing({ __new: true })} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '7px 12px', borderRadius: 20, border: 'none', cursor: 'pointer', background: dark ? C.gold : C.navy, color: '#fff', fontFamily: C.fontSans, fontSize: '0.8rem', fontWeight: 500 }}><i className="ti ti-plus" style={{ fontSize: 14 }} />Add</button>}
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px 40px' }}>
            {editing ? (
              <PillEditor dark={dark} pill={editing.__new ? null : editing} onCancel={() => setEditing(null)} onSave={savePill} />
            ) : pills === null ? (
              <div style={{ textAlign: 'center', color: sub, fontSize: '0.85rem', padding: '40px 0' }}>Loading…</div>
            ) : pills.length === 0 ? (
              <div style={{ textAlign: 'center', color: sub, fontSize: '0.85rem', padding: '40px 16px', lineHeight: 1.6 }}>No pills yet.<br />Tap <b style={{ color: txt }}>Add</b> to create your first Work Mode pill.</div>
            ) : (
              pills.map((p, i) => (
                <PillRow key={p.id} dark={dark} pill={p} first={i === 0} last={i === pills.length - 1} onEdit={() => setEditing(p)} onDelete={() => deletePill(p.id)} onUp={() => move(i, -1)} onDown={() => move(i, 1)} />
              ))
            )}
          </div>
        </div>
      );
    }

    // ─── Work Mode runtime sheets (form / guided steps) ──────────────
    function FormSheet({ dark, pill, onClose, onSubmit }) {
      const fields = (pill.config && pill.config.fields) || [];
      const [vals, setVals] = useState(() => { const o = {}; fields.forEach(f => { o[f.key] = f.kind === 'select' ? ((f.options && f.options[0]) || '') : ''; }); return o; });
      const bord = dark ? '#152545' : C.border;
      const panelBg = dark ? '#0A1730' : '#FFFFFF';
      const txt = dark ? '#fff' : C.navy;
      const sub = dark ? 'rgba(255,255,255,0.55)' : C.textSecondary;
      const inp = { width: '100%', padding: '10px 12px', background: dark ? '#06101F' : C.surfaceHover, border: `1px solid ${bord}`, borderRadius: 10, color: dark ? '#fff' : C.textPrimary, fontSize: '0.88rem', outline: 'none', fontFamily: C.fontSans, boxSizing: 'border-box' };
      const lbl = { fontSize: '0.66rem', color: sub, letterSpacing: '0.05em', marginBottom: 5, fontFamily: C.fontSans, fontWeight: 600 };
      function submit() {
        for (const f of fields) { if (f.required && !String(vals[f.key] || '').trim()) { alert('Please fill in "' + (f.label || f.key) + '".'); return; } }
        onSubmit(vals);
      }
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 55, background: 'rgba(0,13,38,0.5)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 480, background: panelBg, borderTopLeftRadius: 18, borderTopRightRadius: 18, padding: '18px 18px calc(20px + env(safe-area-inset-bottom))', maxHeight: '82vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 14 }}>
              <i className={`ti ${pill.icon}`} style={{ fontSize: 20, color: dark ? pill.colorDark : pill.colorLight }} />
              <div style={{ flex: 1, fontFamily: C.fontSans, fontSize: '1rem', fontWeight: 600, color: txt }}>{pill.label}</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: sub, fontSize: 20, display: 'flex' }}><i className="ti ti-x" /></button>
            </div>
            {fields.length === 0 && <div style={{ color: sub, fontSize: '0.82rem', marginBottom: 12 }}>This pill has no fields configured.</div>}
            {fields.map(f => (
              <div key={f.key} style={{ marginBottom: 12 }}>
                <div style={lbl}>{f.label || f.key}{f.required && <span style={{ color: C.red }}> *</span>}</div>
                {f.kind === 'select'
                  ? <select value={vals[f.key]} onChange={e => setVals({ ...vals, [f.key]: e.target.value })} style={inp}>{(f.options || []).map(o => <option key={o} value={o}>{o}</option>)}</select>
                  : <input type={f.kind === 'number' ? 'number' : 'text'} value={vals[f.key]} onChange={e => setVals({ ...vals, [f.key]: e.target.value })} style={inp} />}
              </div>
            ))}
            <button onClick={submit} style={{ width: '100%', padding: 12, marginTop: 6, background: dark ? C.gold : C.navy, color: '#fff', border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>Send</button>
          </div>
        </div>
      );
    }

    function StepSheet({ dark, pill, onClose, onComplete }) {
      const steps = (pill.config && pill.config.steps) || [];
      const [idx, setIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [val, setVal] = useState('');
      const cur = steps[idx];
      const bord = dark ? '#152545' : C.border;
      const panelBg = dark ? '#0A1730' : '#FFFFFF';
      const txt = dark ? '#fff' : C.navy;
      const sub = dark ? 'rgba(255,255,255,0.55)' : C.textSecondary;
      const inp = { width: '100%', padding: '10px 12px', background: dark ? '#06101F' : C.surfaceHover, border: `1px solid ${bord}`, borderRadius: 10, color: dark ? '#fff' : C.textPrimary, fontSize: '0.88rem', outline: 'none', fontFamily: C.fontSans, boxSizing: 'border-box' };
      if (!cur) return null;
      function next() {
        const a = { ...answers, [cur.key]: val };
        setAnswers(a);
        if (idx < steps.length - 1) { setIdx(idx + 1); setVal(a[steps[idx + 1].key] || ''); }
        else { onComplete(a); }
      }
      function back() {
        if (idx === 0) return;
        const a = { ...answers, [cur.key]: val };
        setAnswers(a);
        setIdx(idx - 1); setVal(a[steps[idx - 1].key] || '');
      }
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 55, background: 'rgba(0,13,38,0.5)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 480, background: panelBg, borderTopLeftRadius: 18, borderTopRightRadius: 18, padding: '18px 18px calc(20px + env(safe-area-inset-bottom))' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 4 }}>
              <i className={`ti ${pill.icon}`} style={{ fontSize: 20, color: dark ? pill.colorDark : pill.colorLight }} />
              <div style={{ flex: 1, fontFamily: C.fontSans, fontSize: '1rem', fontWeight: 600, color: txt }}>{pill.label}</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: sub, fontSize: 20, display: 'flex' }}><i className="ti ti-x" /></button>
            </div>
            {pill.config.intro && idx === 0 && <div style={{ fontSize: '0.78rem', color: sub, marginBottom: 10, lineHeight: 1.5, fontFamily: C.fontSans }}>{pill.config.intro}</div>}
            <div style={{ fontFamily: C.fontSans, fontSize: '0.62rem', color: sub, letterSpacing: '0.08em', textTransform: 'uppercase', marginTop: 8, marginBottom: 6 }}>Step {idx + 1} of {steps.length}</div>
            <div style={{ fontFamily: C.fontSans, fontSize: '0.95rem', fontWeight: 500, color: txt, marginBottom: 10 }}>{cur.question}</div>
            <textarea value={val} onChange={e => setVal(e.target.value)} rows={2} style={{ ...inp, resize: 'vertical', lineHeight: 1.5 }} />
            <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
              {idx > 0 && <button onClick={back} style={{ flex: 1, padding: 11, background: 'none', color: sub, border: `1px solid ${bord}`, borderRadius: 12, fontSize: '0.88rem', cursor: 'pointer', fontFamily: C.fontSans }}>Back</button>}
              <button onClick={next} style={{ flex: 2, padding: 11, background: dark ? C.gold : C.navy, color: '#fff', border: 'none', borderRadius: 12, fontSize: '0.88rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>{idx < steps.length - 1 ? 'Next' : 'Send'}</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Bottom Nav ──────────────────────────────────────────────────
    const TABS = [
      { id: 'chat',     label: 'AI',    icon: 'ti-sparkles'        },

    function BottomZone({ active, tabs, onChange, dark, mode, onToggleMode, onOpenHistory, onOpenAttach, pendingAttachments, onRemoveAttach, input, setInput, onSend, loading, zoneRef }) {

          dark:  { barBg: '#0A1730', barBord: '#152545', ham: 'rgba(255,255,255,0.25)', tagIcon: '#C9A45A', tagLabel: '#C9A45A', div: '#1E3360', ph: 'rgba(255,255,255,0.25)', clip: 'rgba(255,255,255,0.25)', send: '#AD832F' },

          {isAI && pending.length > 0 && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {pending.map(a => (

                  {a.kind === 'image' ? (
                    <img src={a.previewUrl} alt={a.name} style={{ width: 46, height: 46, borderRadius: 10, objectFit: 'cover', display: 'block', border: `1px solid ${dark ? '#152545' : '#E0D8CC'}` }} />
                  ) : (
                    <div style={{ height: 46, display: 'flex', alignItems: 'center', gap: 6, padding: '0 10px', borderRadius: 10, maxWidth: 160, background: dark ? '#0A1730' : '#FFFFFF', border: `1px solid ${dark ? '#152545' : '#E0D8CC'}` }}>
                      <i className={`ti ${a.kind === 'pdf' ? 'ti-file-type-pdf' : 'ti-file-text'}`} style={{ fontSize: 18, color: C.gold, flexShrink: 0 }} />
                      <span style={{ fontSize: '0.7rem', color: dark ? '#fff' : C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontFamily: C.fontSans }}>{a.name}</span>
                    </div>
                  )}
                  <button onClick={() => onRemoveAttach(a.id)} style={{
                    position: 'absolute', top: -6, right: -6, width: 18, height: 18, borderRadius: '50%', border: '2px solid ' + (dark ? '#000D26' : '#FCFBF8'),
                    cursor: 'pointer', background: C.navy, color: '#fff', fontSize: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
                  }}><i className="ti ti-x" /></button>

          {/* Input bar (AI tab only) — themed by active mode */}
          {isAI && (

                color: M.tagLabel,
                fontFamily: "'Jost', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.13em',
              }}>
                <i className={`ti ${modeIcon}`} style={{ fontSize: 16, color: M.tagIcon }} />

              </button>
              {/* Divider */}
              <div style={{ flexShrink: 0, width: 1, height: 24, background: M.div }} />
              {/* Input */}
              <input
                className="tmg-ai-input"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={onKeyDown}
                placeholder="Message TMG assistant…"
                style={{
                  flex: 1, height: 61, minWidth: 0, border: 'none', outline: 'none',
                  background: 'transparent', padding: '0 10px',
                  fontFamily: "'Jost', sans-serif", fontSize: 12,
                  color: dark ? '#FFFFFF' : '#001A4A',
                }}
              />
              {/* Attach file / photo */}
              <button onClick={onOpenAttach} title="Attach file or photo" style={{
                flexShrink: 0, width: 34, height: 61, display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: 'none', border: 'none', cursor: 'pointer',
                color: M.clip, fontSize: 18,
              }}>
                <i className="ti ti-paperclip" />
              </button>
              {/* Send */}
              <button onClick={onSend} disabled={loading} style={{
                flexShrink: 0, width: 44, height: 44, marginRight: 8, borderRadius: '50%', border: 'none',
                background: M.send,
                color: '#fff', cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18,
                transition: 'background-color 200ms ease',
              }}>
                <i className="ti ti-arrow-up" />

          {/* Pill nav */}
          <div style={{
            display: 'flex', alignItems: 'center',
            background: dark ? '#0A1730' : '#001A4A',

          }}>
            {navTabs.map(({ id, label, icon }) => {
              const isActive = active === id;
              const activeColor = dark ? '#FFFFFF' : '#001A4A';
              const inactiveColor = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.28)';
              const color = isActive ? activeColor : inactiveColor;
              return (
                <button key={id} onClick={() => onChange(id)} style={{
                  flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
                  justifyContent: 'center', gap: 3,

                  transition: 'background 0.2s ease',
                }}>
                  <i className={`ti ${icon}`} style={{ fontSize: 18, display: 'block', color, lineHeight: 1 }} />
                  <span style={{
                    fontFamily: "'Jost', sans-serif", fontSize: 7, fontWeight: 500,
                    letterSpacing: '0.11em', color,
                  }}>{label}</span>
                </button>

            })}
          </div>
        </div>
      );

    // ─── Top Bar ─────────────────────────────────────────────────────
    function TopBar({ dark, onToggleDark, onCalendar, calendarOpen }) {
      const iconBtn = (onClick, iconClass, title, active) => (
        <button
          onClick={onClick}
          title={title}
          style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '4px 7px', color: active ? C.goldSoft : 'rgba(255,255,255,0.65)', fontSize: 18, lineHeight: 1, display: 'flex', alignItems: 'center' }}
        >
          <i className={iconClass} />
        </button>
      );
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '12px 16px', paddingTop: 'calc(12px + env(safe-area-inset-top))',
          background: dark ? '#0A1730' : '#001A4A', backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderBottom: '1px solid rgba(255,255,255,0.08)', flexShrink: 0,
        }}>
          <div style={{ fontSize: '0.95rem', fontWeight: 300, color: C.goldSoft, letterSpacing: '0.26em', textTransform: 'uppercase', fontFamily: C.fontSans }}>TMG APP</div>

            {iconBtn(onCalendar, 'ti ti-calendar', 'Calendar', calendarOpen)}
          </div>
        </div>
