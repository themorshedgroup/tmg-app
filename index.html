    // ─── Helpers ─────────────────────────────────────────────────────
    function getProperty(pid) { return PROPERTIES.find(p => p.id === pid); }

    // ─── Database helper (Supabase on production, mock on localhost) ──
    const DB = {
      client() { return window.SupabaseAuth?._client || null; },

      async loadShowings() {
        if (!this.client()) {
          // localhost: enrich mock showings with propertyAddress
          return SHOWINGS.map(s => {
            const p = PROPERTIES.find(pr => pr.id === s.pid);
            return { ...s, propertyAddress: p?.address || '' };
          });
        }
        const { data, error } = await this.client()
          .from('showings').select('*').order('created_at', { ascending: false });
        if (error) { console.error('[DB] loadShowings:', error.message); return []; }
        return (data || []).map(row => ({
          id: row.id,
          propertyAddress: row.property_address,
          agent: row.agent_name,
          phone: row.agent_phone || '—',
          office: row.agent_office || '—',
          date: row.showing_date || '—',
          status: row.status || 'in_progress',
          addedByName: row.added_by_name,
        }));
      },

      async insertShowing(formData, property, user) {
        if (!this.client()) {
          return {
            id: 's' + Date.now(),
            propertyAddress: property.address,
            agent: formData.agent,
            phone: formData.phone || '—',
            office: formData.office || '—',
            date: formData.date || 'Just added',
            status: 'in_progress',
          };
        }
        const { data, error } = await this.client().from('showings').insert({
          property_address: property.address,
          property_city: property.city,
          property_mls: property.mls,
          property_price: property.price,
          property_beds: String(property.beds),
          property_baths: String(property.baths),
          property_sqft: property.sqft,
          agent_name: formData.agent,
          agent_phone: formData.phone || null,
          agent_office: formData.office || null,
          showing_date: formData.date || null,
          added_by_id: user?.id || null,
          added_by_name: user?.user_metadata?.full_name || user?.email || null,
        }).select().single();
        if (error) throw error;
        return {
          id: data.id,
          propertyAddress: data.property_address,
          agent: data.agent_name,
          phone: data.agent_phone || '—',
          office: data.agent_office || '—',
          date: data.showing_date || '—',
          status: data.status,
          addedByName: data.added_by_name,
        };
      },

      async updateShowing(id, fields) {
        if (!this.client()) return;
        const mapped = {};
        if (fields.agent  !== undefined) mapped.agent_name   = fields.agent;
        if (fields.phone  !== undefined) mapped.agent_phone  = fields.phone;
        if (fields.office !== undefined) mapped.agent_office = fields.office;
        if (fields.date   !== undefined) mapped.showing_date = fields.date;
        if (fields.status !== undefined) mapped.status       = fields.status;
        const { error } = await this.client().from('showings').update(mapped).eq('id', id);
        if (error) console.error('[DB] updateShowing:', error.message);
      },

      async loadThread(showingId) {
        if (!this.client()) return SMS_THREADS[showingId] || [];
        const { data, error } = await this.client()
          .from('sms_messages').select('*')
          .eq('showing_id', showingId).order('sent_at', { ascending: true });
        if (error) { console.error('[DB] loadThread:', error.message); return []; }
        return (data || []).map(row => ({
          id: row.id,
          dir: row.direction,
          touch: row.touch_number,
          time: new Date(row.sent_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
          body: row.body,
          sentByName: row.sent_by_name,
        }));
      },

        const { error } = await this.client().from('sms_messages').insert({
          showing_id: showingId,
          direction: 'out',
          touch_number: null,
          body: msg.body,
          sent_by_id: user?.id || null,
          sent_by_name: user?.user_metadata?.full_name || user?.email || null,

          city: '',

      },

        if (!this.client()) {
          return {
            id: 'p' + Date.now(),
            address: formData.address,
            city: '', mls: formData.mls || '',

          mls: formData.mls || null,
          listing_agent: formData.agent || null,
          added_by_name: user?.user_metadata?.full_name || user?.email || null,

          address: data.address,
          city: '', mls: data.mls || '',
          agent: data.listing_agent || '',
          price: '', beds: '', baths: '', sqft: '',

          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      ),
      Kanban: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="3" width="5" height="18" rx="1.5"/>
          <rect x="9.5" y="3" width="5" height="13" rx="1.5"/>
          <rect x="16" y="3" width="5" height="16" rx="1.5"/>
        </svg>
      ),
      Gear: ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      ),
      Menu:   ({ size=22, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      ),
      X:      ({ size=20, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      ),
      Plus:   ({ size=20, color=C.gold }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      ),
      Upload: ({ size=20, color=C.gold }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
      ),
      Chevron: ({ size=16, color=C.textSecondary, down=true }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: down ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform 0.2s' }}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      ),
      Msg: ({ size=14, color=C.textSecondary }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
    };

    // ─── Status Badge ─────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const { label, color, bg } = STATUS[status] || STATUS.in_progress;
      return (
        <span style={{
          fontSize: '0.68rem', fontWeight: 600, color,
          background: bg, border: `1px solid ${color}33`,
          borderRadius: 20, padding: '3px 9px', whiteSpace: 'nowrap',
        }}>
          {label}
        </span>
      );
    }

    // ─── SMS Thread ───────────────────────────────────────────────────
    function SmsThread({ thread }) {
      if (!thread.length) return (
        <div style={{ padding: '12px 0 4px', textAlign: 'center', color: C.textMuted, fontSize: '0.8rem' }}>
          No messages yet
        </div>
      );
      return (
        <div style={{ paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {thread.map((msg, i) => {
            const isOut = msg.dir === 'out';
            return (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: isOut ? 'flex-end' : 'flex-start' }}>
                <div style={{ fontSize: '0.65rem', color: isOut ? C.gold : C.green, marginBottom: 3, paddingLeft: isOut ? 0 : 2, paddingRight: isOut ? 2 : 0, letterSpacing: '0.04em' }}>
                  {isOut
                    ? (msg.touch ? `Day ${msg.touch} · ${msg.time}` : `${msg.sentByName || 'You'} · ${msg.time}`)
                    : `Reply · ${msg.time}`}
                </div>
                <div style={{
                  maxWidth: '88%',
                  background: isOut ? C.navy : C.surfaceHover,
                  border: `1px solid ${isOut ? C.navy : C.border}`,
                  borderRadius: isOut ? '6px 6px 2px 6px' : '6px 6px 6px 2px',
                  padding: '8px 12px',
                  fontSize: '0.83rem', color: isOut ? '#FFFFFF' : C.textPrimary, lineHeight: 1.5,
                }}>
                  {msg.body}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Property Card (Overview) ─────────────────────────────────────
    function PropertyCard({ property, allShowings, user }) {
      const [expanded,      setExpanded]      = useState(false);
      const [openShowingId, setOpenShowingId] = useState(null);
      const [editing,       setEditing]       = useState(false);
      const [editAddr,  setEditAddr]  = useState(property.address);
      const [editMls,   setEditMls]   = useState(property.mls);
      const [editAgent, setEditAgent] = useState(property.agent);
      const [dispAddr,  setDispAddr]  = useState(property.address);
      const [dispMls,   setDispMls]   = useState(property.mls);
      const [dispAgent, setDispAgent] = useState(property.agent);

      const showings = allShowings.filter(s => s.propertyAddress === dispAddr);
      const active   = showings.filter(s => s.status === 'in_progress').length;
      const closed   = showings.filter(s => s.status === 'closed').length;
      const unreadCount = showings.filter(s => {
        const t = SMS_THREADS[s.id] || [];
        return t.length > 0 && t[t.length - 1].dir === 'in';
      }).length;

      async function handleSaveEdit() {
        setDispAddr(editAddr); setDispMls(editMls); setDispAgent(editAgent);
        setEditing(false);
        await DB.updateProperty(property.id, { address: editAddr, mls: editMls, agent: editAgent });
      }
      function handleCancelEdit() {
        setEditAddr(dispAddr); setEditMls(dispMls); setEditAgent(dispAgent);
        setEditing(false);
      }

      const inputStyle = {
        width: '100%', padding: '7px 10px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.83rem', fontFamily: C.fontSans, outline: 'none',
      };

      // Minimalist emoji chip
      function EmojiChip({ emoji, count, color }) {
        if (!count) return null;
        return (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 3,
            background: color + '18', borderRadius: 20,
            padding: '2px 7px',
          }}>
            <span style={{ fontSize: '0.72rem' }}>{emoji}</span>
            <span style={{ fontSize: '0.7rem', fontWeight: 600, color }}>{count}</span>
          </div>
        );
      }

      return (
        <div style={{
          background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)',
          borderRadius: 16, overflow: 'hidden', marginBottom: 12,
        }}>
          {/* Property header */}
          <div
            onClick={() => { if (!editing) setExpanded(e => !e); }}
            style={{ padding: '14px 16px', cursor: editing ? 'default' : 'pointer' }}
          >
            {/* Row 1: address + emoji chips + envelope + pencil + chevron */}
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: editing ? 12 : 3, gap: 6 }}>
              <div style={{ fontWeight: 700, fontSize: '0.97rem', color: C.textPrimary, flex: 1, minWidth: 0 }}>
                {dispAddr}
              </div>
              {!editing && (
                <>
                  {/* Emoji stat chips */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                    <EmojiChip emoji="👀" count={showings.length} color={C.gold} />
                    <EmojiChip emoji="🟢" count={active}          color={C.green} />
                    <EmojiChip emoji="🔴" count={closed}          color={C.red} />
                  </div>
                  {/* Mail badge */}
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0,
                    background: unreadCount > 0 ? C.red + '18' : 'transparent',
                    border: `1px solid ${unreadCount > 0 ? C.red + '44' : C.border}`,
                    borderRadius: 12, padding: '3px 8px', minWidth: 38, justifyContent: 'center',
                  }}>
                    <i className="ti ti-mail" style={{ fontSize: 14, color: unreadCount > 0 ? C.red : C.textMuted }} />
                    {unreadCount > 0 && (
                      <span style={{ fontSize: '0.72rem', fontWeight: 700, color: C.red, fontFamily: C.fontSans, lineHeight: 1 }}>
                        {unreadCount}
                      </span>
                    )}
                  </div>
                </>
              )}
              {/* Pencil edit button */}
              <button
                onClick={e => { e.stopPropagation(); setEditing(true); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 4px', color: editing ? C.gold : C.textMuted, fontSize: 14, lineHeight: 1, display: 'flex', alignItems: 'center', flexShrink: 0 }}
              ><i className="ti ti-pencil" /></button>
              {!editing && <Icon.Chevron size={14} color={C.textSecondary} down={expanded} />}
            </div>

            {editing ? (
              /* ── Inline edit form ── */
              <div onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                  {[
                    { label: 'Property Address', val: editAddr,  set: setEditAddr  },
                    { label: 'MLS Number',        val: editMls,   set: setEditMls   },
                    { label: 'Listing Agent',     val: editAgent, set: setEditAgent },
                  ].map(({ label, val, set }) => (
                    <div key={label}>
                      <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>{label}</div>
                      <input value={val} onChange={e => set(e.target.value)} style={inputStyle} />
                    </div>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={handleSaveEdit}   style={{ flex: 1, padding: '9px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.82rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>Save</button>
                  <button onClick={handleCancelEdit} style={{ flex: 1, padding: '9px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.82rem', cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button>
                </div>
              </div>
            ) : (
              <>
                {/* Row 2: city · MLS */}
                <div style={{ fontSize: '0.75rem', color: C.textSecondary, marginBottom: 2 }}>
                  {dispMls ? `MLS# ${dispMls}` : ''}
                </div>
                {/* Row 3: listing agent */}
                {dispAgent ? (
                  <div style={{ fontSize: '0.73rem', color: C.textMuted }}>{dispAgent}</div>
                ) : null}
              </>
            )}
          </div>

          {/* Expanded showing list */}
          {expanded && !editing && (
            <div style={{ borderTop: `1px solid ${C.border}` }}>
              {showings.map(s => (
                <ShowingRow
                  key={s.id}
                  showing={s}
                  user={user}
                  isOpen={openShowingId === s.id}
                  onToggle={(forceOpen) => setOpenShowingId(cur =>
                    forceOpen ? s.id : (cur === s.id ? null : s.id)
                  )}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function StatChip({ value, label, color }) {
      return (
        <div style={{
          flex: 1, textAlign: 'center',
          background: C.surfaceHover, boxShadow: '0 1px 3px rgba(0,26,74,0.05)',
          borderRadius: 10, padding: '7px 4px',
        }}>
          <div style={{ fontSize: '1.3rem', fontWeight: 400, fontStyle: 'italic', color, fontFamily: C.fontDisplay }}>{value}</div>
          <div style={{ fontSize: '0.58rem', color: C.textSecondary, textTransform: 'uppercase', letterSpacing: '0.14em', marginTop: 1, fontFamily: C.fontSans }}>{label}</div>
        </div>
      );
    }

    function ShowingRow({ showing, isOpen = false, onToggle = () => {}, user }) {
      const [status,       setStatus]       = useState(showing.status);
      const [localThread,  setLocalThread]  = useState(() => SMS_THREADS[showing.id] || []);
      const [threadLoaded, setThreadLoaded] = useState(false);
      const [replyText,    setReplyText]    = useState('');
      const [editing,      setEditing]      = useState(false);

      // Load thread from DB when first expanded
      useEffect(() => {
        if (isOpen && !threadLoaded) {
          setThreadLoaded(true);
          DB.loadThread(showing.id).then(t => setLocalThread(t));
        }
      }, [isOpen]);
      const [editAgent,   setEditAgent]   = useState(showing.agent);
      const [editPhone,   setEditPhone]   = useState(showing.phone);
      const [editOffice,  setEditOffice]  = useState(showing.office);
      const [editDate,    setEditDate]    = useState(showing.date);
      // Display values (updated on save)
      const [dispAgent,   setDispAgent]   = useState(showing.agent);
      const [dispPhone,   setDispPhone]   = useState(showing.phone);
      const [dispOffice,  setDispOffice]  = useState(showing.office);
      const [dispDate,    setDispDate]    = useState(showing.date);

      const hasUnread     = localThread.length > 0 && localThread[localThread.length - 1].dir === 'in';
      const inboundCount  = localThread.filter(m => m.dir === 'in').length;

      async function handleSend() {
        const txt = replyText.trim();
        if (!txt) return;
        const senderName = user?.user_metadata?.full_name || user?.email || 'You';
        const msg = { dir: 'out', touch: null, time: 'Just now', body: txt, sentByName: senderName };
        setLocalThread(t => [...t, msg]);
        setReplyText('');
        await DB.insertMessage(showing.id, msg, user);
      }

      async function handleSaveEdit() {
        setDispAgent(editAgent); setDispPhone(editPhone);
        setDispOffice(editOffice); setDispDate(editDate);
        setEditing(false);
        await DB.updateShowing(showing.id, { agent: editAgent, phone: editPhone, office: editOffice, date: editDate });
      }

      function handleCancelEdit() {
        setEditAgent(dispAgent); setEditPhone(dispPhone);
        setEditOffice(dispOffice); setEditDate(dispDate);
        setEditing(false);
      }

      const inputStyle = {
        width: '100%', padding: '7px 10px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.83rem', fontFamily: C.fontSans, outline: 'none',
      };

      return (
        <div style={{ borderBottom: `1px solid ${C.border}` }}>
          {/* Row header */}
          <div
            onClick={() => { if (!editing) onToggle(); }}
            style={{ display: 'flex', alignItems: 'center', padding: '12px 16px', cursor: 'pointer', gap: 10 }}
          >
            {/* Message icon + inbound count badge */}
            <div style={{ position: 'relative', flexShrink: 0 }}>
              <Icon.Msg size={15} color={inboundCount > 0 ? C.gold : C.textMuted} />
              {inboundCount > 0 && (
                <div style={{
                  position: 'absolute', top: -5, right: -7,
                  minWidth: 15, height: 15, borderRadius: 8,
                  background: C.red, border: `1.5px solid ${C.surface}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: '0.58rem', fontWeight: 700, color: '#fff',
                  fontFamily: C.fontSans, padding: '0 2px',
                }}>{inboundCount}</div>
              )}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '0.88rem', fontWeight: 500, color: C.textPrimary }}>{dispAgent}</div>
              <div style={{ fontSize: '0.72rem', color: C.textSecondary }}>{dispDate} · {dispPhone}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexShrink: 0 }}>
              {/* Pencil edit button */}
              <button
                onClick={e => { e.stopPropagation(); setEditing(true); onToggle(true); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 4px', color: C.textMuted, fontSize: 14, lineHeight: 1, display: 'flex', alignItems: 'center' }}
              ><i className="ti ti-pencil" /></button>
              {/* Status dropdown as pill */}
              <select
                value={status}
                onClick={e => e.stopPropagation()}
                onChange={e => { e.stopPropagation(); const v = e.target.value; setStatus(v); DB.updateShowing(showing.id, { status: v }); }}
                style={{
                  padding: '3px 8px',
                  border: `1px solid ${STATUS[status]?.color || '#888'}44`,
                  borderRadius: 20,
                  background: STATUS[status]?.bg || C.surfaceHover,
                  color: STATUS[status]?.color || C.textSecondary,
                  fontSize: '0.68rem', fontWeight: 600,
                  fontFamily: C.fontSans, outline: 'none', cursor: 'pointer',
                  appearance: 'none', WebkitAppearance: 'none',
                }}
              >
                <option value="in_progress">In Progress</option>
                <option value="closed">Closed</option>
              </select>
              <Icon.Chevron size={13} color={C.textSecondary} down={isOpen} />
            </div>
          </div>

          {/* Expanded panel */}
          {isOpen && (
            <div style={{ background: C.bg, borderTop: `1px solid ${C.border}`, padding: '12px 16px 16px' }}>

              {editing ? (
                /* ── Edit form ── */
                <div>
                  <div style={{ fontSize: '0.62rem', fontWeight: 600, color: C.navy, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10, fontFamily: C.fontSans }}>Edit Showing Details</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                    {[
                      { label: 'Agent Name', val: editAgent, set: setEditAgent },
                      { label: 'Phone',      val: editPhone, set: setEditPhone },
                      { label: 'Office',     val: editOffice,set: setEditOffice },
                      { label: 'Date / Time',val: editDate,  set: setEditDate  },
                    ].map(({ label, val, set }) => (
                      <div key={label}>
                        <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>{label}</div>
                        <input value={val} onChange={e => set(e.target.value)} style={inputStyle} />
                      </div>
                    ))}
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={handleSaveEdit} style={{ flex: 1, padding: '9px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.82rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>Save</button>
                    <button onClick={handleCancelEdit} style={{ flex: 1, padding: '9px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.82rem', cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button>
                  </div>
                </div>
              ) : (
                /* ── Normal view ── */
                <div>
                  <div style={{ fontSize: '0.72rem', color: C.textMuted, marginBottom: 10 }}>{dispOffice}</div>
                  <SmsThread thread={localThread} />
                  {/* Spacer before reply box */}
                  <div style={{ marginTop: 20, paddingTop: 14, borderTop: `1px solid ${C.border}` }} />
                  <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
                    <textarea
                      rows={2}
                      placeholder="Type a reply…"
                      value={replyText}
                      onChange={e => setReplyText(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                      style={{
                        flex: 1, padding: '8px 12px', resize: 'none',
                        border: `1px solid ${C.border}`, borderRadius: 8,
                        background: C.surface, color: C.textPrimary,
                        fontSize: '0.85rem', fontFamily: C.fontSans,
                        outline: 'none', lineHeight: 1.5,
                      }}
                    />
                    <button
                      onClick={handleSend}
                      style={{
                        padding: '8px 14px', borderRadius: 8, border: 'none',
                        background: replyText.trim() ? C.navy : C.border,
                        color: replyText.trim() ? '#FFFFFF' : C.textMuted,
                        fontSize: '0.8rem', fontWeight: 500, cursor: 'pointer',
                        fontFamily: C.fontSans, transition: 'background 0.15s',
                        flexShrink: 0, alignSelf: 'stretch',
                      }}
                    >Send</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ─── Overview Tab ─────────────────────────────────────────────────
    function OverviewTab({ user, liveShowings, properties }) {
      const firstName = user?.user_metadata?.full_name?.split(' ')[0] || user?.email?.split('@')[0] || 'there';

      return (
        <div style={{ padding: '20px 16px 100px' }}>
          {/* Greeting */}
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: '2.2rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, fontFamily: C.fontDisplay }}>Hi, {firstName}</div>
            <div style={{ fontSize: '0.7rem', color: C.textSecondary, marginTop: 4, letterSpacing: '0.16em', textTransform: 'uppercase', fontFamily: C.fontSans }}>Showing Feedback Follow-Up App</div>
          </div>

          {properties.map(p => (
            <PropertyCard key={p.id} property={p} allShowings={liveShowings} user={user} />
          ))}
        </div>
      );
    }

    // ─── Settings Tab ─────────────────────────────────────────────────
    const SMS_TEMPLATE_DEFAULTS = [
      { touch: 1, day: 1, body: "Hi {{agent_first_name}}! This is Tarek with The Morshed Group. Just following up on your showing at {{address}} — did your clients enjoy the property? Any feedback would be appreciated! 🏡" },
      { touch: 2, day: 3, body: "Hi {{agent_first_name}}, just checking back in on {{address}} — did your clients have any thoughts they'd like to share? Happy to answer any questions too!" },
      { touch: 3, day: 5, body: "Hi {{agent_first_name}}, last check-in on {{address}}. Feel free to reach out anytime if your clients have questions. Thanks for showing the property!" },
    ];

    function SettingsTab({ user }) {
      const fullName = user?.user_metadata?.full_name || 'User';
      const email    = user?.email || '';
      const initial  = fullName.charAt(0).toUpperCase();
      const [templates, setTemplates] = useState(SMS_TEMPLATE_DEFAULTS.map(t => t.body));

      return (
        <div style={{ padding: '20px 16px 100px', overflowY: 'auto', height: '100%' }}>
          <div style={{ fontSize: '1.5rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, marginBottom: 24, fontFamily: C.fontDisplay }}>Settings</div>

          {/* Account */}
          <SectionCard title="Account" mb={14}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
              <div style={{ width: 44, height: 44, borderRadius: '50%', background: C.navy, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.goldSoft, fontWeight: 300, fontSize: '1.2rem', fontFamily: C.fontSans, flexShrink: 0 }}>
                {initial}
              </div>
              <div>
                <div style={{ color: C.textPrimary, fontWeight: 600, fontSize: '0.95rem' }}>{fullName}</div>
                <div style={{ color: C.textSecondary, fontSize: '0.8rem', marginTop: 2 }}>{email}</div>
              </div>
            </div>
            <ActionButton label="Sign out" danger onClick={() => window.SupabaseAuth.signOut()} />
          </SectionCard>

          {/* SMS Templates */}
          <SectionCard title="SMS Follow-up Templates" mb={14}>
            <div style={{ fontSize: '0.78rem', color: C.textSecondary, marginBottom: 14, lineHeight: 1.5 }}>
              Use <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{agent_first_name}}'}</span> and <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{address}}'}</span> as placeholders.
            </div>
            {SMS_TEMPLATE_DEFAULTS.map((t, i) => (
              <div key={t.touch} style={{ marginBottom: i < 2 ? 14 : 0 }}>
                <div style={{ fontSize: '0.62rem', fontWeight: 500, color: C.navy, letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 6, fontFamily: C.fontSans }}>
                  Follow-up {t.touch} · Day {t.day}
                </div>
                <textarea
                  value={templates[i]}
                  onChange={e => { const n = [...templates]; n[i] = e.target.value; setTemplates(n); }}
                  rows={3}
                  style={{
                    width: '100%', background: C.bg, border: `1px solid ${C.border}`,
                    borderRadius: 10, padding: '10px 12px', color: C.textPrimary,
                    fontSize: '0.83rem', lineHeight: 1.6, resize: 'none',
                    fontFamily: C.fontSans,
                    outline: 'none',
                  }}
                />
              </div>
            ))}
            <div style={{ marginTop: 14 }}>
              <ActionButton label="Save Templates" onClick={() => {}} />
            </div>
          </SectionCard>

          {/* Twilio */}
          <SectionCard title="Twilio SMS">
            <div style={{ fontSize: '0.83rem', color: C.textSecondary, lineHeight: 1.6, marginBottom: 14 }}>
              SMS send configuration. Set up your Twilio account to activate automated follow-ups.
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <SettingsField label="Twilio Phone Number" placeholder="+1 (512) 000-0000" />
              <SettingsField label="Send Time (local)" placeholder="10:00 AM Central" />
            </div>
            <div style={{ marginTop: 14 }}>
              <ActionButton label="Send Test SMS" onClick={() => {}} />
            </div>
          </SectionCard>
        </div>
      );
    }

    function SectionCard({ title, children, mb = 0 }) {
      return (
        <div style={{
          background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)',
          borderRadius: 14, padding: 16, marginBottom: mb,
        }}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 14, fontFamily: C.fontSans }}>
            {title}
          </div>
          {children}
        </div>
      );
    }

    function ActionButton({ label, onClick, danger = false }) {
      return (
        <button onClick={onClick} style={{
          width: '100%', padding: 12,
          background: danger ? 'none' : C.navy,
          border: `1px solid ${danger ? C.red : C.navy}`,
          borderRadius: 12, color: danger ? C.red : '#FFFFFF',
          fontSize: '15px', cursor: 'pointer', fontWeight: 500,
          fontFamily: C.fontSans,
        }}>
          {label}
        </button>
      );
    }

    function SettingsField({ label, placeholder }) {
      return (
        <div>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.textSecondary, marginBottom: 5 }}>{label}</div>
          <input
            placeholder={placeholder}
            style={{
              width: '100%', padding: '10px 12px', background: C.surfaceHover,
              border: `1px solid ${C.border}`, borderRadius: 10,
              color: C.textPrimary, fontSize: '0.87rem', outline: 'none',
              fontFamily: C.fontSans,
            }}
          />
        </div>
      );
    }

    // ─── Add Property Modal ───────────────────────────────────────────
    function AddPropertyModal({ onClose, onAdd, user }) {
      const [address, setAddress] = useState('');
      const [mls,     setMls]     = useState('');
      const [agent,   setAgent]   = useState('');

      const inputStyle = {
        width: '100%', padding: '9px 12px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.88rem', fontFamily: C.fontSans, outline: 'none',
      };
      const labelStyle = {
        fontSize: '0.65rem', color: C.textSecondary, marginBottom: 4,
        fontFamily: C.fontSans, textTransform: 'uppercase', letterSpacing: '0.1em',
      };

      async function handleSubmit() {
        if (!address.trim()) return;
        const formData = { address: address.trim(), mls: mls.trim(), agent: agent.trim() };
        try {
          const newProperty = await DB.insertProperty(formData, user);
          onAdd(newProperty);
          onClose();
        } catch (e) {
          console.error('[AddProperty]', e);
          alert('Failed to save property. Please try again.');
        }
      }

      return (
        <>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,26,74,0.45)' }} />
          <div style={{
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 301,
            background: C.surface, borderRadius: '20px 20px 0 0',
            padding: '24px 20px 40px',
            boxShadow: '0 -4px 32px rgba(0,26,74,0.15)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ fontSize: '1.2rem', fontStyle: 'italic', fontFamily: C.fontDisplay, color: C.navy }}>Add Property</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, color: C.textMuted, fontSize: 20, display: 'flex' }}>
                <i className="ti ti-x" />
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div>
                <div style={labelStyle}>Property Address *</div>
                <input value={address} onChange={e => setAddress(e.target.value)} placeholder="e.g. 1808 Forest Hill Dr, Austin TX" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>MLS Number</div>
                <input value={mls} onChange={e => setMls(e.target.value)} placeholder="e.g. 5129346" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Listing Agent</div>
                <input value={agent} onChange={e => setAgent(e.target.value)} placeholder="e.g. Tarek Morshed" style={inputStyle} />
              </div>
            </div>

            <button
              onClick={handleSubmit}
              style={{
                marginTop: 20, width: '100%', padding: 14,
                background: address.trim() ? C.navy : C.border,
                color: address.trim() ? '#fff' : C.textMuted,
                border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 500,
                cursor: address.trim() ? 'pointer' : 'default',
                fontFamily: C.fontSans, transition: 'background 0.15s',
              }}
            >Add Property</button>
          </div>
        </>
      );
    }

    // ─── Add Showing Modal ────────────────────────────────────────────
    function AddShowingModal({ onClose, onAdd, user, properties }) {
      const [pid,    setPid]    = useState((properties || PROPERTIES)[0]?.id || '');
      const [agent,  setAgent]  = useState('');
      const [phone,  setPhone]  = useState('');
      const [office, setOffice] = useState('');
      const [date,   setDate]   = useState('');

      const inputStyle = {
        width: '100%', padding: '9px 12px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.88rem', fontFamily: C.fontSans, outline: 'none',
      };
      const labelStyle = {
        fontSize: '0.65rem', color: C.textSecondary, marginBottom: 4,
        fontFamily: C.fontSans, textTransform: 'uppercase', letterSpacing: '0.1em',
      };

      async function handleSubmit() {
        if (!agent.trim()) return;
        const property = (properties || PROPERTIES).find(p => p.id === pid) || getProperty(pid);
        const formData = { pid, agent: agent.trim(), phone: phone.trim(), office: office.trim(), date: date.trim() };
        try {
          const newShowing = await DB.insertShowing(formData, property, user);
          onAdd(newShowing);
          onClose();
        } catch (e) {
          console.error('[AddShowing]', e);
          alert('Failed to save showing. Please try again.');
        }
      }

      return (
        <>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,26,74,0.45)' }} />
          <div style={{
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 301,
            background: C.surface, borderRadius: '20px 20px 0 0',
            padding: '24px 20px 40px',
            boxShadow: '0 -4px 32px rgba(0,26,74,0.15)',
          }}>
            {/* Header */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ fontSize: '1.2rem', fontStyle: 'italic', fontFamily: C.fontDisplay, color: C.navy }}>Add Showing</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, color: C.textMuted, fontSize: 20, display: 'flex' }}>
                <i className="ti ti-x" />
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {/* Property select */}
              <div>
                <div style={labelStyle}>Property</div>
                <select value={pid} onChange={e => setPid(e.target.value)} style={{ ...inputStyle, appearance: 'none', WebkitAppearance: 'none' }}>
                  {(properties || PROPERTIES).map(p => <option key={p.id} value={p.id}>{p.address}</option>)}
                </select>
              </div>
              <div>
                <div style={labelStyle}>Agent Name *</div>
                <input value={agent} onChange={e => setAgent(e.target.value)} placeholder="e.g. Jane Smith" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Phone</div>
                <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. (512) 555-1234" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Brokerage / Office</div>
                <input value={office} onChange={e => setOffice(e.target.value)} placeholder="e.g. Compass RE Texas" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Date &amp; Time</div>
                <input value={date} onChange={e => setDate(e.target.value)} placeholder="e.g. Jun 7, 10:30 AM" style={inputStyle} />
              </div>
            </div>

            <button
              onClick={handleSubmit}
              style={{
                marginTop: 20, width: '100%', padding: 14,
                background: agent.trim() ? C.navy : C.border,
                color: agent.trim() ? '#fff' : C.textMuted,
                border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 500,
                cursor: agent.trim() ? 'pointer' : 'default',
                fontFamily: C.fontSans, transition: 'background 0.15s',
              }}
            >Add Showing</button>
          </div>
        </>
      );
    }

    // ─── Bottom Nav (floating pill) ──────────────────────────────────
    const TABS = [
      { id: 'overview', label: 'Overview', icon: 'ti-layout-grid' },
      { id: 'settings', label: 'Settings', icon: 'ti-settings'    },
    ];

    function BottomNav({ active, onChange, dark }) {
      return (
        <nav style={{
          position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50,
          background: dark ? '#000D26' : '#FCFBF8',
          borderTop: dark ? 'none' : '1px solid #E4DFD4',
          display: 'flex', justifyContent: 'center',
          padding: `8px 16px calc(8px + env(safe-area-inset-bottom))`,
        }}>
          {/* Pill container */}
          <div style={{
            display: 'flex', alignItems: 'center',
            background: dark ? '#0A1E44' : '#001A4A',
            borderRadius: 40, padding: 4, gap: 2,
          }}>
            {TABS.map(({ id, label, icon }) => {
              const isActive = active === id;
              return (
                <button key={id} onClick={() => onChange(id)} style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  justifyContent: 'center', gap: 2,
                  padding: '7px 20px', borderRadius: 30, border: 'none', cursor: 'pointer',
                  background: isActive ? '#AD832F' : (dark ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.32)'),
                  transition: 'background 0.2s ease',
                }}>
                  <i className={`ti ${icon}`} style={{ fontSize: 14, display: 'block', color: '#FFFFFF', lineHeight: 1 }} />
                  <span style={{
                    fontSize: 8, fontFamily: "'Jost', sans-serif",
                    letterSpacing: '0.14em', fontWeight: 500,
                    textTransform: 'uppercase', color: '#FFFFFF',
                  }}>{label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // ─── Top Bar ──────────────────────────────────────────────────────
    function TopBar({ dark, onToggleDark, onAddProperty, onAddShowing, onUploadSupra, onSettings }) {
      const iconBtn = (onClick, iconClass, title) => (
        <button
          onClick={onClick}
          title={title}
          style={{
            background: 'none', border: 'none', cursor: 'pointer',
            padding: '4px 7px', color: 'rgba(255,255,255,0.65)',
            fontSize: 18, lineHeight: 1, display: 'flex', alignItems: 'center',
          }}
        >
          <i className={iconClass} />
        </button>
      );
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '12px 16px', paddingTop: 'calc(12px + env(safe-area-inset-top))',
          background: 'rgba(0,26,74,0.88)', backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderBottom: '1px solid rgba(255,255,255,0.08)', flexShrink: 0,
        }}>
          <div style={{ fontSize: '0.95rem', fontWeight: 300, color: C.goldSoft, letterSpacing: '0.26em', textTransform: 'uppercase', fontFamily: C.fontSans }}>SFFU APP</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
            {iconBtn(onToggleDark,   dark ? 'ti ti-sun' : 'ti ti-moon', dark ? 'Light mode' : 'Dark mode')}
            <div style={{ width: 1, height: 16, background: 'rgba(255,255,255,0.15)', margin: '0 4px' }} />
            {iconBtn(onAddProperty,  'ti ti-home-plus',    'Add Property')}
            {iconBtn(onAddShowing,   'ti ti-calendar-plus','Add Showing')}
            {iconBtn(onUploadSupra,  'ti ti-cloud-upload', 'Upload Supra')}
            {iconBtn(onSettings,     'ti ti-settings',     'Settings')}
          </div>
        </div>
      );
    }

    // ─── Root App ─────────────────────────────────────────────────────
    function App({ user }) {
      const [activeTab,          setActiveTab]          = useState('overview');
      const [showAddModal,       setShowAddModal]       = useState(false);
      const [showAddPropModal,   setShowAddPropModal]   = useState(false);
      const [liveShowings,       setLiveShowings]       = useState([]);
      const [liveProperties,     setLiveProperties]     = useState(PROPERTIES);
      const [dark, setDark] = useState(() => localStorage.getItem('sffu-theme') === 'dark');

      // Load showings and properties from DB on mount
      useEffect(() => {
        DB.loadShowings().then(data => setLiveShowings(data));
        DB.loadProperties().then(data => setLiveProperties(data));
      }, []);

      useEffect(() => {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('sffu-theme', dark ? 'dark' : 'light');
      }, [dark]);

      function handleShowingAdded(newShowing) {
        setLiveShowings(prev => [newShowing, ...prev]);
      }

      function handlePropertyAdded(newProperty) {
        setLiveProperties(prev => [newProperty, ...prev]);
      }

      return (
        <div style={{ height: '100%', background: dark ? '#000D26' : C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary, transition: 'background 0.2s ease' }}>
          <TopBar
            dark={dark}
            onToggleDark={() => setDark(d => !d)}
            onAddProperty={() => setShowAddPropModal(true)}
            onAddShowing={() => setShowAddModal(true)}
            onUploadSupra={() => alert('Supra screenshot parsing coming soon — powered by Claude Vision once the backend is connected.')}
            onSettings={() => setActiveTab('settings')}
          />
          <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {activeTab === 'overview' && <OverviewTab user={user} liveShowings={liveShowings} properties={liveProperties} />}
            {activeTab === 'settings' && <SettingsTab user={user} />}
          </div>
          <BottomNav active={activeTab} onChange={setActiveTab} dark={dark} />
          {showAddPropModal && (
            <AddPropertyModal
              onClose={() => setShowAddPropModal(false)}
              onAdd={handlePropertyAdded}
              user={user}
            />
          )}
          {showAddModal && (
            <AddShowingModal
              onClose={() => setShowAddModal(false)}
              onAdd={handleShowingAdded}
              user={user}
              properties={liveProperties}
            />
          )}
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      function showSignin()   { document.getElementById('auth-signin').style.display = 'flex'; document.getElementById('auth-rejected').style.display = 'none'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function showRejected() { document.getElementById('auth-signin').style.display = 'none'; document.getElementById('auth-rejected').style.display = 'flex'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(function({ session }) {
        if (!session) { showSignin(); return; }
        root.render(<App user={session.user} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
