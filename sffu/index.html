<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#001A4A" />
  <title>SFFU App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root {
      --tmg-navy:      #001A4A;
      --tmg-navy-deep: #000D26;
      --tmg-navy-mid:  #0A1E44;
      --tmg-gold:      #AD832F;
      --tmg-gold-soft: #C9A45A;
      --tmg-paper:     #FCFBF8;
      --tmg-border:    #E4DFD4;
      --tmg-slate:     #6B6B6B;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif;
      background: #FCFBF8;
      overscroll-behavior: none;
      color: #001A4A;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #000D26; color: #FCFBF8; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js?v=2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <!-- ─── Dark mode init (before render to avoid flash) ─── -->
  <script>if (localStorage.getItem('sffu-theme') === 'dark') document.body.classList.add('dark');</script>

  <!-- ─── Auth Overlay ─── -->
  <div id="auth-overlay" style="
    position:fixed;inset:0;z-index:9999;background:#001A4A;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Jost','Helvetica Neue',Arial,sans-serif;">

    <div id="auth-signin" style="display:flex;flex-direction:column;align-items:center;padding:0 48px;width:100%;">
      <img src="Morshed Group Logo White.png" alt="Morshed Group" style="width:204px;margin-bottom:-24px;opacity:0.92;" />
      <div style="font-size:2.2rem;font-weight:300;color:#C9A45A;margin-bottom:6px;letter-spacing:0.26em;text-transform:uppercase;">SFFU App</div>
      <div style="font-size:0.7rem;font-weight:400;color:#8899BB;margin-bottom:4px;letter-spacing:0.2em;text-transform:uppercase;">Showing Feedback</div>
      <div style="font-size:0.7rem;font-weight:400;color:#8899BB;margin-bottom:52px;letter-spacing:0.2em;text-transform:uppercase;">Follow-Up App</div>
      <button onclick="SupabaseAuth.signInWithGoogle()" style="display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:4px;padding:14px 24px;font-size:15px;font-weight:500;color:#3c4043;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);font-family:'Jost','Helvetica Neue',Arial,sans-serif;letter-spacing:0.03em;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
    </div>

    <div id="auth-rejected" style="display:none;flex-direction:column;align-items:center;text-align:center;padding:0 32px;">
      <div style="font-size:2.2rem;font-weight:300;color:#C9A45A;margin-bottom:4px;letter-spacing:0.26em;text-transform:uppercase;">SFFU</div>
      <div style="font-size:0.7rem;color:#8899BB;margin-bottom:48px;letter-spacing:0.2em;text-transform:uppercase;">Showing Feedback Follow Up</div>
      <div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
        <svg width="26" height="26" fill="none" stroke="#E05252" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div style="font-size:1.1rem;font-weight:500;color:#FCFBF8;margin-bottom:8px;letter-spacing:0.04em;">Access denied</div>
      <div style="font-size:0.88rem;color:#8899BB;margin-bottom:32px;line-height:1.7;">Your account doesn't have access.<br/>Contact Symon to be added.</div>
      <button onclick="SupabaseAuth.signOut()" style="background:none;border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:10px 24px;font-size:13px;color:#8899BB;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:0.08em;text-transform:uppercase;">Sign out</button>
    </div>
  </div>

  <div id="root"></div>

  <!-- ─── Dev localhost mock ─── -->
  <script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
    window.SupabaseAuth = {
      _state: { session: { user: { id: 'dev-user-id', email: 'symon@morshedgroup.com', user_metadata: { full_name: 'Symon', avatar_url: '' } }, access_token: 'dev-token' } },
      signInWithGoogle: function() {},
      signOut: function() { location.reload(); },
      getSession: function() { return Promise.resolve(window.SupabaseAuth._state.session); },
      onAuthStateChange: function(cb) { setTimeout(function() { cb({ session: window.SupabaseAuth._state.session }); }, 50); }
    };
  }
  </script>

  <!-- ─── React App ─── -->
    <!-- Compiled ahead of time from src/sffu.jsx -- DO NOT paste JSX back in here.
       Edit src/sffu.jsx; the pre-commit hook rebuilds build/sffu.js. -->
  <script defer src="../build/sffu.js"></script>
</body>
</html>
