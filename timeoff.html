<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#001A4A" />
  <title>Time Off — TMG App</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="TMG App" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif; background: #FCFBF8; overscroll-behavior: none; color: #001A4A; }
    #root { overflow: hidden; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FCFBF8; z-index: 10; }
    #splash .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(201,164,90,.22); border-top-color: #C9A45A; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    input[type=date], input[type=time], input[type=text], input[type=number] { font-family: inherit; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- ─── Dev localhost mock (overrides supabase.js on localhost only; inert in prod) ─── -->
  <script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
    window.SupabaseAuth = {
      _state: { session: { user: { id: 'dev-user-id', email: 'symon@morshedgroup.com', user_metadata: { full_name: 'Symon', avatar_url: '' } }, access_token: 'dev-token' } },
      signInWithGoogle: function() {},
      signOut: function() { location.reload(); },
      getSession: function() { return Promise.resolve(window.SupabaseAuth._state.session); },
      onAuthStateChange: function(cb) { setTimeout(function() { cb({ session: window.SupabaseAuth._state.session }); }, 50); }
    };
  }
  </script>
</head>
<body>
  <div id="splash"><div class="spin"></div></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── Design tokens (TMG Brand) ───────────────────────────────────
    const C = {
      bg: '#FCFBF8', surface: '#FFFFFF', surfaceHover: '#F3EBDA', border: '#E4DFD4',
      navy: '#001A4A', navyHover: '#0A2552', gold: '#AD832F', goldSoft: '#C9A45A',
      textPrimary: '#001A4A', textSecondary: '#6B6B6B', textMuted: '#9B9380',
      red: '#C0392B', green: '#1E6B40', amber: '#B07A00',
      fontSans: "-apple-system, BlinkMacSystemFont, 'Jost', 'Helvetica Neue', Arial, sans-serif",
      fontDisplay: "'Cormorant Garamond', Georgia, serif",
    };

    // ─── Roles (mirror index.html) ───────────────────────────────────
    const ACCESS_LABEL = { admin: 'Admin', operations: 'Operations', agent: 'Sales Agent', tc: 'Transaction Coordinator', pending: 'Pending' };
    const toRoles = (a) => (Array.isArray(a) ? a : (a ? [a] : [])).filter(r => r && r !== 'pending');
    const hasAdmin = (a) => toRoles(a).some(r => r === 'admin' || r === 'operations');

    // ─── Profiles ────────────────────────────────────────────────────
    const ProfileDB = {
      client() { return window.SupabaseAuth?._client || null; },
      uid() { return window.SupabaseAuth?._state?.session?.user?.id || null; },
      async ensureProfile(user) {
        if (!this.client()) return null;
        try {
          const { data, error } = await this.client().from('profiles').select('*').eq('id', user.id).maybeSingle();
          if (error) { console.error('[ProfileDB] load:', error.message); return null; }
          if (data) return data;
          const full = (user.user_metadata?.full_name || '').trim();
          const parts = full.split(' ');
          const { data: ins, error: e2 } = await this.client().from('profiles').insert({
            id: user.id, email: user.email, first_name: parts.shift() || null, last_name: parts.join(' ') || null,
            avatar_url: user.user_metadata?.avatar_url || null,
          }).select().single();
          if (e2) { console.error('[ProfileDB] create:', e2.message); return null; }
          return ins;
        } catch (e) { console.error('[ProfileDB] ensure:', e); return null; }
      },
      async loadAll() {
        if (!this.client()) return [];
        const { data, error } = await this.client().from('profiles').select('*').order('created_at', { ascending: true });
        if (error) { console.error('[ProfileDB] loadAll:', error.message); return []; }
        return data || [];
      },
    };

    // ─── Time Off: policy config (admins write, everyone reads) ───────
    // Global setting only (hours per workday); allotment is now per-person on profiles.
    const TIMEOFF_DEFAULT = { hours_per_workday: 8, year_basis: 'calendar' };
    function normalizeTimeoffPolicy(cfg) {
      const base = (cfg && typeof cfg === 'object') ? cfg : {};
      const hpw = Number(base.hours_per_workday);
      return { hours_per_workday: hpw > 0 ? hpw : 8, year_basis: base.year_basis === 'anniversary' ? 'anniversary' : 'calendar' };
    }
    const PolicyDB = {
      client() { return window.SupabaseAuth?._client || null; },
      async load() {
        if (!this.client()) return null;
        const { data, error } = await this.client().from('time_off_policies').select('config').eq('id', 1).maybeSingle();
        if (error) { console.error('[PolicyDB] load:', error.message); return null; }
        return (data && data.config) || null;
      },
      async save(config) {
        if (!this.client()) return;
        const { error } = await this.client().from('time_off_policies').upsert({ id: 1, config, updated_at: new Date().toISOString() });
        if (error) { console.error('[PolicyDB] save:', error.message); throw error; }
      },
    };

    // ─── Google Calendar (write-only here) — mirrors tasks.html's callCalendar exactly,
    // so an approved time-off request can drop an OOO event on the shared team calendar. ───
    const SUPABASE_ANON = 'sb_publishable_Jg-roLg8M-BZJ7dBfjEeig_HIdniPaV';
    const CAL_ENDPOINT = 'https://ipqoqhsnjubopybujetn.supabase.co/functions/v1/google-calendar';
    const CAL_IS_DEV = (typeof window !== 'undefined') && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:');
    // The shared "TMG" team calendar (confirmed by Symon) — OOO events land here.
    const TEAM_CALENDAR_ID = 'c_u17la9j1annqi72em9qs3e8v44';
    function authToken() { return window.SupabaseAuth?._state?.session?.access_token || SUPABASE_ANON; }
    async function callCalendar(payload) {
      if (CAL_IS_DEV) return { ok: true, status: 200, data: payload.action === 'create' ? { ok: true, id: 'dev-' + Math.random().toString(36).slice(2) } : { ok: true } };
      const res = await fetch(CAL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken(), 'apikey': SUPABASE_ANON },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }
    // Google's all-day event `end.date` is EXCLUSIVE — one day past the last included day.
    function isoPlusOneDay(isoDate) {
      const d = new Date(isoDate + 'T00:00:00'); d.setDate(d.getDate() + 1);
      const p2 = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
    }
    async function createOOOEvent(name, startISO, endISO) {
      const event = { summary: 'OOO - ' + name, start: { date: startISO }, end: { date: isoPlusOneDay(endISO) } };
      const { ok, data } = await callCalendar({ action: 'create', calendarId: TEAM_CALENDAR_ID, event });
      if (!ok) { const err = new Error(data.error || 'calendar_error'); err.code = data.error; throw err; }
      return data.id || null;
    }
    async function deleteOOOEvent(eventId, calendarId) {
      if (!eventId) return;
      try { await callCalendar({ action: 'delete', calendarId: calendarId || TEAM_CALENDAR_ID, eventId }); } catch (e) {}
    }

    // ─── Time Off: request data + balance math ───────────────────────
    const TimeOffDB = {
      client() { return window.SupabaseAuth?._client || null; },
      uid() { return window.SupabaseAuth?._state?.session?.user?.id || null; },
      async listMine() {
        if (!this.client()) return [];
        const { data, error } = await this.client().from('time_off_requests').select('*').eq('user_id', this.uid()).order('start_at', { ascending: false });
        if (error) { console.error('[TimeOffDB] listMine:', error.message); return []; }
        return data || [];
      },
      async listPending() {
        if (!this.client()) return [];
        const { data, error } = await this.client().from('time_off_requests').select('*').eq('status', 'pending').order('start_at', { ascending: true });
        if (error) { console.error('[TimeOffDB] listPending:', error.message); return []; }
        return data || [];
      },
      // Org-wide, for the Team roster. RLS scopes this to what the caller may see —
      // for a true time-off admin that's everyone; for anyone else, just their own + reports'.
      async listAllForYear(year) {
        if (!this.client()) return [];
        const start = year + '-01-01T00:00:00';
        const end = (year + 1) + '-01-01T00:00:00';
        const { data, error } = await this.client().from('time_off_requests').select('*').gte('start_at', start).lt('start_at', end);
        if (error) { console.error('[TimeOffDB] listAllForYear:', error.message); return []; }
        return data || [];
      },
      // forUserId lets a timeoff admin file on behalf of a teammate — the DB guard trigger
      // enforces that only an admin may pass a user_id other than their own.
      async create(req) {
        if (!this.client()) return null;
        const { data, error } = await this.client().from('time_off_requests').insert({
          user_id: req.forUserId || this.uid(), start_at: req.start_at, end_at: req.end_at, full_day: !!req.full_day, reason: req.reason || null,
        }).select().single();
        if (error) { console.error('[TimeOffDB] create:', error.message); throw error; }
        return data;
      },
      // Edits are allowed on any non-cancelled request, including already-decided ones —
      // changing the dates/reason withdraws the prior decision and puts it back up for approval.
      async update(id, req) {
        if (!this.client()) return null;
        const { data, error } = await this.client().from('time_off_requests').update({
          start_at: req.start_at, end_at: req.end_at, full_day: !!req.full_day, reason: req.reason || null,
          status: 'pending', decision_note: null, decided_by: null, decided_at: null,
          calendar_id: null, calendar_event_id: null,
        }).eq('id', id).select().single();
        if (error) { console.error('[TimeOffDB] update:', error.message); throw error; }
        return data;
      },
      async decide(id, status, note) {
        if (!this.client()) return;
        const { error } = await this.client().from('time_off_requests').update({ status, decision_note: note || null }).eq('id', id);
        if (error) { console.error('[TimeOffDB] decide:', error.message); throw error; }
      },
      // Records the OOO calendar event created for an approved request, so a later edit
      // (which withdraws the approval) knows which event to delete.
      async setCalendarEvent(id, calendarId, eventId) {
        if (!this.client()) return;
        const { error } = await this.client().from('time_off_requests').update({ calendar_id: calendarId, calendar_event_id: eventId }).eq('id', id);
        if (error) console.error('[TimeOffDB] setCalendarEvent:', error.message);
      },
      async cancel(id) {
        if (!this.client()) return;
        const { error } = await this.client().from('time_off_requests').update({ status: 'cancelled' }).eq('id', id);
        if (error) { console.error('[TimeOffDB] cancel:', error.message); throw error; }
      },
    };

    const timeoffDate = (v) => new Date(String(v || '').replace(' ', 'T'));
    const timeoffFmtHours = (h) => String(Math.round((Number(h) || 0) * 100) / 100);
    function timeoffClientHours(startISO, endISO, fullDay, hpw) {
      const s = timeoffDate(startISO), e = timeoffDate(endISO);
      if (isNaN(s) || isNaN(e) || e < s) return 0;
      if (fullDay) {
        let d = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        const end = new Date(e.getFullYear(), e.getMonth(), e.getDate());
        let n = 0;
        while (d <= end) { const wd = d.getDay(); if (wd >= 1 && wd <= 5) n++; d.setDate(d.getDate() + 1); }
        return n * (Number(hpw) || 8);
      }
      return Math.max(0, Math.round(((e - s) / 3600000) * 100) / 100);
    }
    // A person hired mid-year gets a prorated allotment for that first calendar year —
    // the fraction of the year remaining from their hire date onward. Hired in an earlier
    // year (or no hire_date on file) → full allotment, unchanged. Hired in a future year
    // (bad data) → 0 for this year.
    function timeoffProration(hireDateStr, year) {
      if (!hireDateStr) return 1;
      const hire = timeoffDate(hireDateStr);
      if (isNaN(hire)) return 1;
      const hireYear = hire.getFullYear();
      if (hireYear < year) return 1;
      if (hireYear > year) return 0;
      const yearStart = new Date(year, 0, 1);
      const yearEnd = new Date(year, 11, 31);
      const hireDay = new Date(hire.getFullYear(), hire.getMonth(), hire.getDate());
      const daysInYear = Math.round((yearEnd - yearStart) / 86400000) + 1;
      const daysRemaining = Math.round((yearEnd - hireDay) / 86400000) + 1;
      return Math.max(0, Math.min(1, daysRemaining / daysInYear));
    }
    // Per-person: allotment hours = the person's profile.time_off_days × hours-per-workday,
    // prorated for the calendar year they were hired in.
    function timeoffBalance(cfg, profile, rows) {
      const days = Math.max(0, Number(profile && profile.time_off_days) || 0);
      const hpw = (cfg && Number(cfg.hours_per_workday)) || 8;
      const tracked = days > 0;
      const year = new Date().getFullYear();
      const proration = timeoffProration(profile && profile.hire_date, year);
      const allot = days * hpw * proration;
      let used = 0, pending = 0;
      (rows || []).forEach(r => {
        if (!r.tracked || timeoffDate(r.start_at).getFullYear() !== year) return;
        const h = Number(r.total_hours) || 0;
        if (r.status === 'approved') used += h; else if (r.status === 'pending') pending += h;
      });
      return { tracked, allot, used, pending, remaining: allot - used, proration };
    }
    function timeoffWhen(r) {
      const s = timeoffDate(r.start_at), e = timeoffDate(r.end_at);
      const dOpt = { month: 'short', day: 'numeric' };
      if (r.full_day) {
        return s.toDateString() === e.toDateString() ? s.toLocaleDateString(undefined, dOpt) : s.toLocaleDateString(undefined, dOpt) + ' – ' + e.toLocaleDateString(undefined, dOpt);
      }
      const tOpt = { hour: 'numeric', minute: '2-digit' };
      return s.toLocaleDateString(undefined, dOpt) + ', ' + s.toLocaleTimeString([], tOpt) + ' – ' + e.toLocaleTimeString([], tOpt);
    }

    function TimeOffTab({ dark, profile, isAdmin, onBack, hideHeader }) {
      const uid = profile && profile.id;
      const [policy, setPolicy] = useState(null);
      const [mine, setMine] = useState([]);
      const [pending, setPending] = useState([]);
      const [people, setPeople] = useState({});
      const [profiles, setProfiles] = useState([]);
      const [yearRequests, setYearRequests] = useState([]);
      const [scope, setScope] = useState('mine'); // 'mine' | 'team' — admins only
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('list');
      const [busy, setBusy] = useState(false);
      const [mode, setMode] = useState('fullday');
      const today = new Date().toISOString().slice(0, 10);
      const [startDate, setStartDate] = useState(today);
      const [endDate, setEndDate] = useState(today);
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('13:00');
      const [reason, setReason] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editingStatus, setEditingStatus] = useState(null);
      const [editingCalEvent, setEditingCalEvent] = useState(null); // { calendarId, eventId } | null
      const [forUserId, setForUserId] = useState(null); // admin-only: filing on behalf of a teammate; null = self

      const reload = async () => {
        const [m, p, yr] = await Promise.all([
          TimeOffDB.listMine(), TimeOffDB.listPending(),
          isAdmin ? TimeOffDB.listAllForYear(new Date().getFullYear()) : Promise.resolve(null),
        ]);
        setMine(m); setPending(p); if (yr) setYearRequests(yr);
      };
      useEffect(() => {
        let on = true;
        (async () => {
          const cfg = normalizeTimeoffPolicy((await PolicyDB.load()) || TIMEOFF_DEFAULT);
          const ppl = await ProfileDB.loadAll();
          const map = {}; ppl.forEach(u => { map[u.id] = (((u.first_name || '') + ' ' + (u.last_name || '')).trim()) || u.email || 'Someone'; });
          const [m, p, yr] = await Promise.all([
            TimeOffDB.listMine(), TimeOffDB.listPending(),
            isAdmin ? TimeOffDB.listAllForYear(new Date().getFullYear()) : Promise.resolve([]),
          ]);
          if (!on) return;
          setPolicy(cfg); setPeople(map); setProfiles(ppl); setMine(m); setPending(p); setYearRequests(yr); setLoading(false);
        })();
        return () => { on = false; };
      }, []);

      const t = dark
        ? { bg: '#0B1830', surface: '#12203B', text: '#EDE6D6', sub: '#A9B2C4', muted: '#7E8AA0', border: '#24314F' }
        : { bg: C.bg, surface: C.surface, text: C.navy, sub: C.textSecondary, muted: C.textMuted, border: C.border };
      const PILL = {
        pending: { bg: dark ? 'rgba(176,122,0,0.18)' : '#FBF1D9', fg: dark ? '#E0B65C' : C.amber, label: 'Pending' },
        approved: { bg: dark ? 'rgba(30,107,64,0.20)' : '#E6F2EC', fg: dark ? '#7FCBA4' : C.green, label: 'Approved' },
        denied: { bg: dark ? 'rgba(192,57,43,0.18)' : '#FDECEA', fg: dark ? '#E89B92' : C.red, label: 'Denied' },
        cancelled: { bg: dark ? 'rgba(255,255,255,0.08)' : '#F0EEE8', fg: dark ? '#98A0AE' : C.textMuted, label: 'Cancelled' },
        noted: { bg: dark ? 'rgba(173,131,47,0.16)' : '#F3EBDA', fg: dark ? '#C9A45A' : C.gold, label: 'Logged' },
      };
      const pill = (s) => { const p = PILL[s] || PILL.pending; return <span style={{ display: 'inline-flex', alignItems: 'center', padding: '3px 9px', borderRadius: 20, background: p.bg, color: p.fg, fontSize: '0.68rem', fontWeight: 700, fontFamily: C.fontSans, letterSpacing: '0.02em' }}>{p.label}</span>; };

      const bal = policy ? timeoffBalance(policy, profile, mine) : null;
      // When an admin is filing on behalf of someone else, show THEIR balance/warnings instead
      // of the admin's own — sourced from yearRequests, which is only loaded for admins.
      const forProfile = (isAdmin && forUserId) ? profiles.find(p => p.id === forUserId) : null;
      const forBal = forProfile ? timeoffBalance(policy, forProfile, yearRequests.filter(r => r.user_id === forUserId)) : bal;
      const hpw = policy ? policy.hours_per_workday : 8;
      const daysEq = (h) => Math.round((h / (hpw || 8)) * 10) / 10;
      // Approver sees: their reports' requests, or (admin/ops) everyone's. A TRUE admin
      // (access has 'admin') may also approve their OWN — matches the DB self-approval carve-out.
      const isSuper = toRoles(profile && profile.access).indexOf('admin') !== -1;
      const toReview = pending.filter(r => (isAdmin || r.manager_id === uid) && (isSuper || r.user_id !== uid));

      const draftStart = mode === 'fullday' ? startDate + 'T00:00:00' : startDate + 'T' + startTime + ':00';
      const draftEnd = mode === 'fullday' ? endDate + 'T00:00:00' : startDate + 'T' + endTime + ':00';
      const draftFull = mode === 'fullday';
      const draftHours = timeoffClientHours(draftStart, draftEnd, draftFull, hpw);
      const draftValid = mode === 'fullday' ? !!(startDate && endDate && endDate >= startDate) : !!(startDate && endTime > startTime);

      const startCreate = () => {
        setEditingId(null); setEditingStatus(null); setEditingCalEvent(null); setForUserId(null);
        setMode('fullday'); setStartDate(today); setEndDate(today); setStartTime('09:00'); setEndTime('13:00'); setReason('');
        setView('new');
      };
      const startEdit = (r) => {
        const pad = n => String(n).padStart(2, '0');
        const dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        const timeStr = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
        const s = timeoffDate(r.start_at), e = timeoffDate(r.end_at);
        setEditingId(r.id); setEditingStatus(r.status); setForUserId(null);
        setEditingCalEvent(r.calendar_event_id ? { calendarId: r.calendar_id, eventId: r.calendar_event_id } : null);
        setMode(r.full_day ? 'fullday' : 'hours');
        setStartDate(dateStr(s)); setEndDate(dateStr(e));
        setStartTime(r.full_day ? '09:00' : timeStr(s)); setEndTime(r.full_day ? '13:00' : timeStr(e));
        setReason(r.reason || '');
        setView('new');
      };
      const submit = async () => {
        if (!draftValid || busy) return;
        setBusy(true);
        try {
          if (editingId) {
            // Editing withdraws any prior approval — drop its OOO event before saving the new dates.
            if (editingCalEvent) await deleteOOOEvent(editingCalEvent.eventId, editingCalEvent.calendarId);
            await TimeOffDB.update(editingId, { start_at: draftStart, end_at: draftEnd, full_day: draftFull, reason });
          } else {
            await TimeOffDB.create({ start_at: draftStart, end_at: draftEnd, full_day: draftFull, reason, forUserId });
          }
          setReason(''); setMode('fullday'); setEditingId(null); setEditingStatus(null); setEditingCalEvent(null); setForUserId(null); setView('list'); await reload();
        }
        catch (e) { alert('Could not file: ' + (e.message || e)); }
        finally { setBusy(false); }
      };
      const doCancel = async (r) => {
        if (!window.confirm('Cancel this time-off request?')) return;
        setBusy(true);
        try { await TimeOffDB.cancel(r.id); await reload(); }
        catch (e) { alert('Could not cancel: ' + (e.message || e)); }
        finally { setBusy(false); }
      };
      const doDecide = async (r, status) => {
        const note = status === 'denied' ? (window.prompt('Reason for denial (optional):') || null) : null;
        setBusy(true);
        try {
          await TimeOffDB.decide(r.id, status, note);
          if (status === 'approved') {
            // Best-effort: the approval itself already succeeded, so a calendar hiccup
            // (e.g. the approver hasn't connected Google Calendar) shouldn't block it.
            try {
              const name = people[r.user_id] || 'Team member';
              const startISO = (r.start_at || '').slice(0, 10);
              const endISO = (r.end_at || '').slice(0, 10) || startISO;
              const eventId = await createOOOEvent(name, startISO, endISO);
              if (eventId) await TimeOffDB.setCalendarEvent(r.id, TEAM_CALENDAR_ID, eventId);
            } catch (ce) {
              alert('Approved — but couldn’t add it to the Team Calendar (' + (ce.message || ce) + '). You can add it there manually.');
            }
          }
          await reload();
        }
        catch (e) { alert('Could not update: ' + (e.message || e)); }
        finally { setBusy(false); }
      };

      const card = { background: t.surface, borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${t.border}`, boxShadow: dark ? 'none' : '0 2px 8px rgba(0,26,74,0.06)' };
      const fld = { width: '100%', padding: '10px 12px', borderRadius: 10, border: `1.5px solid ${t.border}`, background: t.surface, color: t.text, fontSize: '0.9rem', fontFamily: C.fontSans, boxSizing: 'border-box' };
      const lbl = { fontSize: '0.72rem', fontWeight: 600, color: t.sub, fontFamily: C.fontSans, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6, display: 'block' };
      const primaryBtn = { width: '100%', padding: 13, background: C.navy, color: '#fff', border: 'none', borderRadius: 12, fontSize: '0.92rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans };

      const myRow = (r) => {
        const canCancel = r.status === 'pending' || r.status === 'noted';
        const canEdit = r.status !== 'cancelled';
        const who = r.decided_by && people[r.decided_by];
        return (
          <div key={r.id} style={{ ...card, marginBottom: 10, padding: 13 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ flex: 1, fontSize: '0.9rem', fontWeight: 600, color: t.text, fontFamily: C.fontSans }}>{timeoffWhen(r)}</span>
              {pill(r.status)}
            </div>
            <div style={{ fontSize: '0.76rem', color: t.sub, fontFamily: C.fontSans, marginTop: 3 }}>
              {timeoffFmtHours(r.total_hours)}h{r.tracked ? ' · ' + daysEq(r.total_hours) + ' day' + (daysEq(r.total_hours) === 1 ? '' : 's') : ' · visibility'}
              {r.reason ? ' · ' + r.reason : ''}
            </div>
            {r.decision_note ? <div style={{ fontSize: '0.74rem', color: t.muted, fontFamily: C.fontSans, marginTop: 3, fontStyle: 'italic' }}>“{r.decision_note}”{who ? ' — ' + who : ''}</div> : null}
            {canEdit || canCancel ? (
              <div style={{ display: 'flex', gap: 8, marginTop: 9 }}>
                {canEdit ? <button onClick={() => startEdit(r)} disabled={busy} style={{ padding: '7px 12px', background: 'none', border: `1.5px solid ${t.border}`, borderRadius: 9, color: t.text, fontSize: '0.76rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>Edit</button> : null}
                {canCancel ? <button onClick={() => doCancel(r)} disabled={busy} style={{ padding: '7px 12px', background: 'none', border: `1.5px solid ${t.border}`, borderRadius: 9, color: t.sub, fontSize: '0.76rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button> : null}
              </div>
            ) : null}
          </div>
        );
      };
      const reviewRow = (r) => (
        <div key={r.id} style={{ ...card, marginBottom: 10, padding: 13 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ flex: 1, fontSize: '0.9rem', fontWeight: 700, color: t.text, fontFamily: C.fontSans }}>{people[r.user_id] || 'Someone'}</span>
            <span style={{ fontSize: '0.76rem', color: t.sub, fontFamily: C.fontSans }}>{timeoffFmtHours(r.total_hours)}h</span>
          </div>
          <div style={{ fontSize: '0.8rem', color: t.sub, fontFamily: C.fontSans, marginTop: 3 }}>{timeoffWhen(r)}{r.reason ? ' · ' + r.reason : ''}</div>
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button onClick={() => doDecide(r, 'approved')} disabled={busy} style={{ flex: 1, padding: '9px 0', background: C.green, color: '#fff', border: 'none', borderRadius: 9, fontSize: '0.8rem', fontWeight: 700, cursor: 'pointer', fontFamily: C.fontSans }}>Approve</button>
            <button onClick={() => doDecide(r, 'denied')} disabled={busy} style={{ flex: 1, padding: '9px 0', background: 'none', color: C.red, border: `1.5px solid ${dark ? 'rgba(192,57,43,0.5)' : '#F3C9C4'}`, borderRadius: 9, fontSize: '0.8rem', fontWeight: 700, cursor: 'pointer', fontFamily: C.fontSans }}>Deny</button>
          </div>
        </div>
      );
      // Admin-only Team roster: every active profile's balance for the year, side by side.
      const activeProfiles = profiles.filter(p => !p.status || p.status === 'active');
      const rosterRow = (p) => {
        const b = timeoffBalance(policy, p, yearRequests.filter(r => r.user_id === p.id));
        const name = (((p.first_name || '') + ' ' + (p.last_name || '')).trim()) || p.email || 'Someone';
        return (
          <div key={p.id} style={{ ...card, marginBottom: 10, padding: 13 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ flex: 1, fontSize: '0.88rem', fontWeight: 700, color: t.text, fontFamily: C.fontSans }}>{name}</span>
              {!b.tracked ? <span style={{ fontSize: '0.68rem', color: t.muted, fontFamily: C.fontSans }}>Not tracked</span> : null}
            </div>
            {b.tracked ? (
              <div style={{ fontSize: '0.78rem', color: t.sub, fontFamily: C.fontSans, marginTop: 4 }}>
                <b style={{ color: t.text }}>{timeoffFmtHours(b.remaining)}h</b> left · {timeoffFmtHours(b.used)}h used · {timeoffFmtHours(b.pending)}h pending · of {timeoffFmtHours(b.allot)}h
                {b.proration < 1 ? <span style={{ color: C.gold }}> · prorated ({p.hire_date ? timeoffDate(p.hire_date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'started'} start)</span> : null}
              </div>
            ) : null}
          </div>
        );
      };

      if (loading) return <div style={{ padding: '20px 16px', background: t.bg }}><div style={{ fontSize: '0.85rem', color: t.muted, fontFamily: C.fontSans }}>Loading…</div></div>;

      if (view === 'new') {
        return (
          <div style={{ padding: '20px 16px 100px', background: t.bg, minHeight: '100%' }}>
            <button onClick={() => { setEditingId(null); setEditingStatus(null); setEditingCalEvent(null); setForUserId(null); setView('list'); }} style={{ background: 'none', border: 'none', padding: 0, display: 'flex', alignItems: 'center', cursor: 'pointer', color: t.sub, fontSize: '0.86rem', fontWeight: 600, fontFamily: C.fontSans, marginBottom: 16 }}><i className="ti ti-chevron-left" style={{ fontSize: 20 }} />Back</button>
            <div style={{ fontSize: '1.5rem', fontWeight: 400, fontStyle: 'italic', color: t.text, marginBottom: 18, fontFamily: C.fontDisplay }}>{editingId ? 'Edit request' : (forUserId ? 'Log time off for ' + (people[forUserId] || 'them') : (forBal && forBal.tracked ? 'Request time off' : 'Log time off'))}</div>
            <div style={card}>
              {isAdmin && !editingId ? (
                <div style={{ marginBottom: 16 }}>
                  <span style={lbl}>For</span>
                  <select value={forUserId || uid} onChange={e => setForUserId(e.target.value === uid ? null : e.target.value)} style={fld}>
                    <option value={uid}>Myself</option>
                    {activeProfiles.filter(p => p.id !== uid).map(p => (
                      <option key={p.id} value={p.id}>{(((p.first_name || '') + ' ' + (p.last_name || '')).trim()) || p.email || 'Someone'}</option>
                    ))}
                  </select>
                </div>
              ) : null}
              <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
                {[{ k: 'fullday', l: 'Full day(s)' }, { k: 'hours', l: 'Specific hours' }].map(o => (
                  <button key={o.k} onClick={() => setMode(o.k)} style={{ flex: 1, padding: '9px 0', borderRadius: 9, border: `1.5px solid ${mode === o.k ? C.navy : t.border}`, background: mode === o.k ? C.navy : t.surface, color: mode === o.k ? '#fff' : t.sub, fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>{o.l}</button>
                ))}
              </div>
              {mode === 'fullday' ? (
                <div style={{ display: 'flex', gap: 10, marginBottom: 14 }}>
                  <div style={{ flex: 1 }}><span style={lbl}>From</span><input type="date" value={startDate} onChange={e => { setStartDate(e.target.value); if (e.target.value > endDate) setEndDate(e.target.value); }} style={fld} /></div>
                  <div style={{ flex: 1 }}><span style={lbl}>To</span><input type="date" min={startDate} value={endDate} onChange={e => setEndDate(e.target.value)} style={fld} /></div>
                </div>
              ) : (
                <React.Fragment>
                  <div style={{ marginBottom: 14 }}><span style={lbl}>Date</span><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={fld} /></div>
                  <div style={{ display: 'flex', gap: 10, marginBottom: 14 }}>
                    <div style={{ flex: 1 }}><span style={lbl}>From</span><input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} style={fld} /></div>
                    <div style={{ flex: 1 }}><span style={lbl}>To</span><input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} style={fld} /></div>
                  </div>
                </React.Fragment>
              )}
              <div style={{ marginBottom: 14 }}><span style={lbl}>Reason (optional)</span><input type="text" value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. family trip" style={fld} /></div>
              <div style={{ fontSize: '0.82rem', color: t.sub, fontFamily: C.fontSans, marginBottom: 6 }}>
                {draftValid ? <React.Fragment><strong style={{ color: t.text }}>= {timeoffFmtHours(draftHours)} hours</strong>{forBal && forBal.tracked ? ' (' + daysEq(draftHours) + ' day' + (daysEq(draftHours) === 1 ? '' : 's') + ')' : ''}</React.Fragment> : <span style={{ color: t.muted }}>Pick a valid date/time range.</span>}
              </div>
              {forBal && forBal.tracked && draftValid && draftHours > forBal.remaining ? <div style={{ fontSize: '0.76rem', color: C.amber, fontFamily: C.fontSans, marginBottom: 10 }}>⚠ This is more than {timeoffFmtHours(forBal.remaining)}h remaining{forUserId ? ' for ' + (people[forUserId] || 'this person') : ''}.</div> : null}
              {editingId && (editingStatus === 'approved' || editingStatus === 'denied') ? <div style={{ fontSize: '0.76rem', color: C.amber, fontFamily: C.fontSans, marginBottom: 10 }}>⚠ Saving will withdraw this {PILL[editingStatus].label.toLowerCase()} request and send it back for approval.</div> : null}
              <button onClick={submit} disabled={!draftValid || busy} style={{ ...primaryBtn, marginTop: 6, opacity: (!draftValid || busy) ? 0.5 : 1 }}>{busy ? 'Saving…' : (editingId ? 'Save changes' : (forBal && forBal.tracked ? 'Submit request' : 'Log it'))}</button>
            </div>
          </div>
        );
      }

      return (
        <div style={{ padding: hideHeader ? '16px 16px 100px' : '20px 16px 100px', background: t.bg, minHeight: '100%' }}>
          {!hideHeader ? <button onClick={onBack} style={{ background: 'none', border: 'none', padding: 0, display: 'flex', alignItems: 'center', cursor: 'pointer', color: t.sub, fontSize: '0.86rem', fontWeight: 600, fontFamily: C.fontSans, marginBottom: 16 }}><i className="ti ti-chevron-left" style={{ fontSize: 20 }} />Back</button> : null}
          {!hideHeader ? <div style={{ fontSize: '1.5rem', fontWeight: 400, fontStyle: 'italic', color: t.text, marginBottom: 18, fontFamily: C.fontDisplay }}>Time Off</div> : null}

          {isAdmin ? (
            <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
              {[{ k: 'mine', l: 'Mine' }, { k: 'team', l: 'Team' }].map(o => {
                const on = scope === o.k;
                return <button key={o.k} onClick={() => setScope(o.k)} style={{ flex: 1, padding: '9px 0', borderRadius: 9, border: `1.5px solid ${on ? C.navy : t.border}`, background: on ? C.navy : t.surface, color: on ? '#fff' : t.sub, fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer', fontFamily: C.fontSans }}>{o.l}</button>;
              })}
            </div>
          ) : null}

          {scope === 'team' ? (
            <React.Fragment>
              <div style={{ fontSize: '0.72rem', fontWeight: 700, color: t.sub, letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: C.fontSans, marginBottom: 10 }}>Team time off — {new Date().getFullYear()} ({activeProfiles.length})</div>
              {activeProfiles.length ? activeProfiles.map(rosterRow) : <div style={{ fontSize: '0.82rem', color: t.muted, fontFamily: C.fontSans, padding: '4px 2px' }}>No one on the roster yet.</div>}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {bal && bal.tracked ? (
                <div style={{ ...card, background: dark ? '#12203B' : C.navy }}>
                  <div style={{ fontSize: '0.72rem', fontWeight: 600, color: dark ? '#A9B2C4' : 'rgba(255,255,255,0.7)', letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: C.fontSans }}>Time off — {new Date().getFullYear()}</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 6 }}>
                    <span style={{ fontSize: '2.2rem', fontWeight: 400, color: '#fff', fontFamily: C.fontDisplay, fontStyle: 'italic' }}>{timeoffFmtHours(bal.remaining)}h</span>
                    <span style={{ fontSize: '0.9rem', color: dark ? '#C9A45A' : C.goldSoft, fontFamily: C.fontSans }}>≈ {daysEq(bal.remaining)} days left</span>
                  </div>
                  <div style={{ fontSize: '0.78rem', color: dark ? '#A9B2C4' : 'rgba(255,255,255,0.66)', fontFamily: C.fontSans, marginTop: 4 }}>{timeoffFmtHours(bal.used)}h used · {timeoffFmtHours(bal.pending)}h awaiting · of {timeoffFmtHours(bal.allot)}h ({daysEq(bal.allot)} days){bal.proration < 1 ? <span style={{ color: dark ? '#C9A45A' : C.goldSoft }}> · prorated for your {new Date().getFullYear()} start</span> : null}</div>
                </div>
              ) : (
                <div style={card}>
                  <div style={{ fontSize: '0.88rem', fontWeight: 600, color: t.text, fontFamily: C.fontSans }}>Time off isn’t tracked for your role</div>
                  <div style={{ fontSize: '0.8rem', color: t.sub, fontFamily: C.fontSans, marginTop: 4, lineHeight: 1.5 }}>You can still log it here so your manager and team can see it — there’s just no balance to track.</div>
                </div>
              )}

              <button onClick={startCreate} style={{ ...primaryBtn, marginBottom: 22 }}>{bal && bal.tracked ? 'Request time off' : 'Log time off'}</button>

              {toReview.length ? (
                <React.Fragment>
                  <div style={{ fontSize: '0.72rem', fontWeight: 700, color: C.gold, letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: C.fontSans, marginBottom: 10 }}>Requests to review ({toReview.length})</div>
                  {toReview.map(reviewRow)}
                  <div style={{ height: 14 }} />
                </React.Fragment>
              ) : null}

              <div style={{ fontSize: '0.72rem', fontWeight: 700, color: t.sub, letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: C.fontSans, marginBottom: 10 }}>My requests</div>
              {mine.length ? mine.map(myRow) : <div style={{ fontSize: '0.82rem', color: t.muted, fontFamily: C.fontSans, padding: '4px 2px' }}>Nothing yet — file your first request above.</div>}
            </React.Fragment>
          )}
        </div>
      );
    }

    function Root() {
      const params = new URLSearchParams(location.search);
      const EMBED = params.get('embed') === '1' || window.self !== window.top;
      const dark = params.get('theme') === 'dark';
      const [phase, setPhase] = useState('loading'); // loading | ready | blocked
      const [profile, setProfile] = useState(null);

      useEffect(() => {
        let on = true, settled = false;
        const hideSplash = () => { const sp = document.getElementById('splash'); if (sp) sp.style.display = 'none'; };
        // Standalone redirects to the app's sign-in; embedded shows a note (parent app is already authed).
        const bail = () => { if (!EMBED) window.location.replace('index.html'); else { setPhase('blocked'); hideSplash(); } };
        const resolve = async (session) => {
          if (!on || settled) return;
          if (!session) { bail(); return; }   // not settled — a later (truthy) session can still resolve
          const local = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:');
          let p;
          try {
            p = local
              ? { id: 'dev-user-id', email: 'symon@morshedgroup.com', first_name: 'Symon', last_name: 'Yongco', title: 'Operations Manager', access: 'admin', status: 'active', time_off_days: 14 }
              : await ProfileDB.ensureProfile(session.user);
          } catch (e) { p = null; }
          if (!on || settled) return;
          if (!p || (p.status && p.status !== 'active')) { bail(); return; }
          settled = true;
          setProfile(p); setPhase('ready'); hideSplash();
        };
        const start = () => {
          const sa = window.SupabaseAuth;
          if (!sa || !sa.getSession) { setTimeout(start, 100); return; }
          // Primary: resolve the session DIRECTLY so the gate never hangs on notify/init timing.
          sa.getSession().then(resolve).catch(() => bail());
          // Secondary: catch a sign-in that lands after mount (truthy-only, to avoid a 'blocked' flash).
          if (sa.onAuthStateChange) sa.onAuthStateChange(({ session }) => { if (session) resolve(session); });
        };
        start();
        return () => { on = false; };
      }, []);

      if (phase === 'blocked') return <div style={{ padding: 40, textAlign: 'center', fontFamily: C.fontSans, color: dark ? '#A9B2C4' : C.textSecondary, fontSize: '0.9rem', lineHeight: 1.6 }}>Please sign in to the TMG app to use Time Off.</div>;
      if (phase !== 'ready' || !profile) return null;

      const bg = dark ? '#0B1830' : C.bg;
      const backToApp = () => { window.location.href = 'index.html'; };
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: bg }}>
          {!EMBED ? (
            <div style={{ flexShrink: 0, background: C.navy, color: '#fff', padding: 'max(10px, env(safe-area-inset-top)) 14px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
              <button onClick={backToApp} style={{ background: 'none', border: 'none', color: '#fff', display: 'flex', alignItems: 'center', cursor: 'pointer', fontFamily: C.fontSans, fontSize: '0.82rem', fontWeight: 500, padding: 0 }}><i className="ti ti-chevron-left" style={{ fontSize: 20, color: C.goldSoft }} />App</button>
              <span style={{ flex: 1, textAlign: 'center', fontFamily: C.fontDisplay, fontStyle: 'italic', fontSize: '1.15rem', fontWeight: 500 }}>Time Off</span>
              <span style={{ width: 20 }} />
            </div>
          ) : null}
          <div style={{ flex: 1, overflowY: 'auto' }}>
            <TimeOffTab dark={dark} profile={profile} isAdmin={hasAdmin(profile.access)} onBack={backToApp} hideHeader />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
