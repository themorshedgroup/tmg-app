    const DB = {
      client() { return window.SupabaseAuth?._client || null; },

      async loadShowings() {
        if (!this.client()) {
          // localhost: enrich mock showings with propertyAddress
          return SHOWINGS.map(s => {
            const p = PROPERTIES.find(pr => pr.id === s.pid);
            return { ...s, propertyAddress: p?.address || '' };
          });
        }
        const { data, error } = await this.client()
          .from('showings').select('*').order('created_at', { ascending: false });
        if (error) { console.error('[DB] loadShowings:', error.message); return []; }
        return (data || []).map(row => ({
          id: row.id,
          propertyAddress: row.property_address,
          agent: row.agent_name,
          phone: row.agent_phone || '—',
          office: row.agent_office || '—',
          date: row.showing_date || '—',
          status: row.status || 'in_progress',
          feedback: row.feedback || '',
          addedByName: row.added_by_name,
        }));
      },

      async insertShowing(formData, property, user) {
        if (!this.client()) {
          return {
            id: 's' + Date.now(),
            propertyAddress: property.address,
            agent: formData.agent,
            phone: formData.phone || '—',
            office: formData.office || '—',
            date: formData.date || 'Just added',
            status: 'in_progress',
            feedback: '',
          };
        }
        const { data, error } = await this.client().from('showings').insert({
          property_address: property.address,
          property_city: property.city,
          property_mls: property.zillowUrl || null,
          property_price: property.price,
          property_beds: String(property.beds),
          property_baths: String(property.baths),
          property_sqft: property.sqft,
          agent_name: formData.agent,
          agent_phone: formData.phone || null,
          agent_office: formData.office || null,
          showing_date: formData.date || null,
          added_by_id: user?.id || null,
          added_by_name: user?.user_metadata?.full_name || user?.email || null,
        }).select().single();
        if (error) throw error;
        return {
          id: data.id,
          propertyAddress: data.property_address,
          agent: data.agent_name,
          phone: data.agent_phone || '—',
          office: data.agent_office || '—',
          date: data.showing_date || '—',
          status: data.status,
          feedback: data.feedback || '',
          addedByName: data.added_by_name,
        };
      },

      async updateShowing(id, fields) {
        if (!this.client()) return;
        const mapped = {};
        if (fields.agent    !== undefined) mapped.agent_name   = fields.agent;
        if (fields.phone    !== undefined) mapped.agent_phone  = fields.phone;
        if (fields.office   !== undefined) mapped.agent_office = fields.office;
        if (fields.date     !== undefined) mapped.showing_date = fields.date;
        if (fields.status   !== undefined) mapped.status       = fields.status;
        if (fields.feedback !== undefined) mapped.feedback     = fields.feedback || null;
        const { error } = await this.client().from('showings').update(mapped).eq('id', id);
        if (error) console.error('[DB] updateShowing:', error.message);
      },

        const { data, error } = await this.client()
          .from('sms_messages').select('*')

        if (error) { console.error('[DB] loadThread:', error.message); return []; }

          id: row.id,
          dir: row.direction,
          touch: row.touch_number,
          time: new Date(row.sent_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),

          sentByName: row.sent_by_name,
        }));

            'apikey': 'sb_publishable_Jg-roLg8M-BZJ7dBfjEeig_HIdniPaV',
          },
          body: JSON.stringify({ showing_id: showingId, body }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('Send failed (' + res.status + ')'));
        return data;

        return data.map(row => ({
          id: row.id, address: row.address, city: '',
          zillowUrl: row.zillow_url || '', agent: row.listing_agent || '',
          price: '', beds: '', baths: '', sqft: '',
        }));
      },

      async loadArchivedProperties() {
        if (!this.client()) return [];
        const { data, error } = await this.client()
          .from('properties').select('*')
          .eq('archived', true)
          .order('created_at', { ascending: false });
        if (error) { console.error('[DB] loadArchivedProperties:', error.message); return []; }
        return (data || []).map(row => ({
          id: row.id, address: row.address, city: '',
          zillowUrl: row.zillow_url || '', agent: row.listing_agent || '',
          price: '', beds: '', baths: '', sqft: '',
        }));
      },

      async archiveProperty(id) {
        if (!this.client()) return;
        const { error } = await this.client().from('properties').update({ archived: true }).eq('id', id);
        if (error) console.error('[DB] archiveProperty:', error.message);
      },

      async restoreProperty(id) {
        if (!this.client()) return;
        const { error } = await this.client().from('properties').update({ archived: false }).eq('id', id);
        if (error) console.error('[DB] restoreProperty:', error.message);
      },

      async deleteProperty(id) {
        if (!this.client()) return;
        const { error } = await this.client().from('properties').delete().eq('id', id);
        if (error) console.error('[DB] deleteProperty:', error.message);
      },

      async updateProperty(id, fields) {
        if (!this.client()) return;
        const mapped = {};
        if (fields.address !== undefined) mapped.address        = fields.address;
        if (fields.zillowUrl !== undefined) mapped.zillow_url    = fields.zillowUrl;
        if (fields.agent   !== undefined) mapped.listing_agent  = fields.agent;
        const { error } = await this.client().from('properties').update(mapped).eq('id', id);
        if (error) console.error('[DB] updateProperty:', error.message);
      },

      async loadTemplates() {
        if (!this.client()) return SMS_TEMPLATE_DEFAULTS.map(t => t.body);
        const { data, error } = await this.client()
          .from('sms_templates').select('*').order('touch_number', { ascending: true });
        if (error || !data || data.length === 0) return SMS_TEMPLATE_DEFAULTS.map(t => t.body);
        return data.map(row => row.body);
      },

      async saveTemplates(bodies, user) {
        if (!this.client()) return;
        const now = new Date().toISOString();
        const userName = user?.user_metadata?.full_name || user?.email || null;
        const rows = SMS_TEMPLATE_DEFAULTS.map((t, i) => ({
          id: t.touch,
          touch_number: t.touch,
          day_offset: t.day,
          body: bodies[i] || t.body,
          updated_at: now,
          updated_by_name: userName,
        }));
        const { error } = await this.client()
          .from('sms_templates').upsert(rows, { onConflict: 'id' });
        if (error) throw error;
      },

      async loadSettings() {
        if (!this.client()) return { twilioPhone: '', sendTime: '', senderName: '' };
        const { data, error } = await this.client()
          .from('app_settings').select('*').eq('id', 1).single();
        if (error || !data) return { twilioPhone: '', sendTime: '', senderName: '' };
        return {
          twilioPhone: data.twilio_phone_number || '',
          sendTime:    data.send_time_local     || '',
          senderName:  data.sender_name         || '',
        };
      },

      async saveSettings(fields, user) {
        if (!this.client()) return;
        const { error } = await this.client().from('app_settings').upsert({
          id: 1,
          twilio_phone_number: fields.twilioPhone || null,
          send_time_local:     fields.sendTime    || null,
          sender_name:         fields.senderName  || null,
          updated_at:          new Date().toISOString(),
          updated_by_name:     user?.user_metadata?.full_name || user?.email || null,
        }, { onConflict: 'id' });
        if (error) throw error;
      },

      async insertProperty(formData, user) {
        if (!this.client()) {
          return {
            id: 'p' + Date.now(),
            address: formData.address,
            city: '', zillowUrl: formData.zillowUrl || '',
            agent: formData.agent || '',
            price: '', beds: '', baths: '', sqft: '',
          };
        }
        const { data, error } = await this.client().from('properties').insert({
          address: formData.address,
          zillow_url: formData.zillowUrl || null,
          listing_agent: formData.agent || null,
          added_by_name: user?.user_metadata?.full_name || user?.email || null,
        }).select().single();
        if (error) throw error;
        return {
          id: data.id,
          address: data.address,
          city: '', zillowUrl: data.zillow_url || '',
          agent: data.listing_agent || '',
          price: '', beds: '', baths: '', sqft: '',
        };
      },

      // Active sales agents (profiles with the 'agent' access role) → sorted,
      // de-duplicated display names. Powers the Listing Agent picker on properties.
      async loadAgents() {
        if (!this.client()) return ['Tarek Morshed', 'Jane Smith', 'Carlos Reyes']; // localhost mock
        const { data, error } = await this.client()
          .from('profiles')
          .select('first_name, last_name, access, status')
          .eq('status', 'active')
          .contains('access', ['agent']);
        if (error) { console.error('[DB] loadAgents:', error.message); return []; }
        const names = (data || [])
          .map(p => ((p.first_name || '') + ' ' + (p.last_name || '')).trim())
          .filter(Boolean);
        return Array.from(new Set(names)).sort((a, b) => a.localeCompare(b));
      },
    };

    // ─── SMS Thread ───────────────────────────────────────────────────
    function SmsThread({ thread }) {
      if (!thread.length) return (
        <div style={{ padding: '12px 0 4px', textAlign: 'center', color: C.textMuted, fontSize: '0.8rem' }}>
          No messages yet
        </div>
      );
      return (

                  maxWidth: '88%',

    // ─── Listing Agent picker (multi-select + manual entry) ──────────
    // value/onChange use comma-separated strings to stay compatible with the
    // existing listing_agent text column — no DB schema change needed.
    function AgentSelect({ value, onChange, agents, style }) {
      const selected = value ? value.split(',').map(s => s.trim()).filter(Boolean) : [];
      const [open,   setOpen]   = React.useState(false);
      const [custom, setCustom] = React.useState('');
      const ref = React.useRef(null);

      // Close on outside click
      React.useEffect(() => {
        if (!open) return;
        function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      function toggle(name) {
        const next = selected.includes(name)
          ? selected.filter(n => n !== name)
          : [...selected, name];
        onChange(next.join(', '));
      }

      function addCustom() {
        const name = custom.trim();
        if (!name) return;
        if (!selected.includes(name)) onChange([...selected, name].join(', '));
        setCustom('');
      }

      // All options: DB agents + any selected names not yet in DB (preserves existing values)
      const dbAgents  = agents || [];
      const allOptions = [...new Set([...dbAgents, ...selected])];

      const chipStyle = {
        background: C.navy + '18', color: C.navy,
        borderRadius: 4, padding: '2px 6px',
        fontSize: '0.76rem', display: 'inline-flex', alignItems: 'center', gap: 4,
      };

      return (
        <div ref={ref} style={{ position: 'relative' }}>
          {/* Trigger — shows chips or placeholder */}
          <div
            onClick={() => setOpen(o => !o)}
            style={{
              ...style, minHeight: 36, cursor: 'pointer',
              display: 'flex', flexWrap: 'wrap', gap: 4, alignItems: 'center',
              paddingRight: 28, position: 'relative',
            }}
          >
            {selected.length === 0 && (
              <span style={{ color: C.textMuted, fontSize: '0.83rem' }}>— Select or type agent —</span>
            )}
            {selected.map(name => (
              <span key={name} style={chipStyle}>
                {name}
                <span
                  onMouseDown={e => { e.stopPropagation(); toggle(name); }}
                  style={{ cursor: 'pointer', fontSize: 11, lineHeight: 1, opacity: 0.7 }}
                >✕</span>
              </span>
            ))}
            <i className="ti ti-chevron-down"
               style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', fontSize: 13, color: C.textMuted, pointerEvents: 'none' }} />
          </div>

          {open && (
            <div style={{
              position: 'absolute', top: 'calc(100% + 2px)', left: 0, right: 0, zIndex: 400,
              background: C.surface, border: `1px solid ${C.border}`,
              borderRadius: 8, boxShadow: '0 4px 20px rgba(0,26,74,0.13)',
              maxHeight: 220, overflowY: 'auto',
            }}>
              {/* Manual entry row */}
              <div style={{ padding: '7px 10px', borderBottom: `1px solid ${C.border}`, display: 'flex', gap: 6, alignItems: 'center' }}>
                <input
                  value={custom}
                  onChange={e => setCustom(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } }}
                  placeholder="Type name + Enter to add manually"
                  style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', color: C.textPrimary, fontSize: '0.82rem', fontFamily: C.fontSans }}
                />
                {custom.trim() && (
                  <button onMouseDown={e => { e.preventDefault(); addCustom(); }} style={{ background: C.navy, color: '#fff', border: 'none', borderRadius: 5, padding: '3px 9px', fontSize: '0.75rem', cursor: 'pointer', fontFamily: C.fontSans }}>Add</button>
                )}
              </div>
              {/* DB agent list */}
              {allOptions.length === 0 && (
                <div style={{ padding: '10px 12px', color: C.textMuted, fontSize: '0.82rem' }}>No agents found</div>
              )}
              {allOptions.map(name => (
                <div
                  key={name}
                  onMouseDown={e => { e.preventDefault(); toggle(name); }}
                  style={{
                    padding: '8px 12px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8,
                    fontSize: '0.84rem', color: C.textPrimary,
                    background: selected.includes(name) ? C.navy + '10' : 'transparent',
                  }}
                >
                  <input type="checkbox" readOnly checked={selected.includes(name)} style={{ accentColor: C.navy, cursor: 'pointer', pointerEvents: 'none' }} />
                  {name}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── Property Card (Overview) ─────────────────────────────────────
    function PropertyCard({ property, allShowings, user, onArchive }) {
      const [expanded,      setExpanded]      = useState(false);
      const [openShowingId, setOpenShowingId] = useState(null);
      const [editing,       setEditing]       = useState(false);
      const [editAddr,   setEditAddr]   = useState(property.address);
      const [editZillow, setEditZillow] = useState(property.zillowUrl || '');
      const [editAgent,  setEditAgent]  = useState(property.agent || '');
      const [dispAddr,   setDispAddr]   = useState(property.address);
      const [dispZillow, setDispZillow] = useState(property.zillowUrl || '');
      const [dispAgent,  setDispAgent]  = useState(property.agent || '');
      const [agents,     setAgents]     = useState([]);
      // Load the active-agent list lazily, the first time this card enters edit mode.
      useEffect(() => { if (editing && agents.length === 0) DB.loadAgents().then(setAgents); }, [editing]);

      const showings = allShowings.filter(s => s.propertyAddress === dispAddr);
      const active   = showings.filter(s => s.status === 'in_progress').length;
      const closed   = showings.filter(s => s.status === 'closed').length;
      const unreadCount = showings.filter(s => {
        const t = SMS_THREADS[s.id] || [];
        return t.length > 0 && t[t.length - 1].dir === 'in';
      }).length;

      async function handleSaveEdit() {
        setDispAddr(editAddr); setDispZillow(editZillow); setDispAgent(editAgent);
        setEditing(false);
        await DB.updateProperty(property.id, { address: editAddr, zillowUrl: editZillow, agent: editAgent });
      }
      function handleCancelEdit() {
        setEditAddr(dispAddr); setEditZillow(dispZillow); setEditAgent(dispAgent);
        setEditing(false);
      }

      const inputStyle = {
        width: '100%', padding: '7px 10px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.83rem', fontFamily: C.fontSans, outline: 'none',
      };

      // Minimalist emoji chip
      function EmojiChip({ emoji, count, color }) {
        if (!count) return null;
        return (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 3,
            background: color + '18', borderRadius: 20,
            padding: '2px 7px',
          }}>
            <span style={{ fontSize: '0.72rem' }}>{emoji}</span>
            <span style={{ fontSize: '0.7rem', fontWeight: 600, color }}>{count}</span>
          </div>
        );
      }

      return (
        <div style={{
          background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)',
          borderRadius: 16, overflow: 'hidden', marginBottom: 12,
        }}>
          {/* Property header */}
          <div
            onClick={() => { if (!editing) setExpanded(e => !e); }}
            style={{ padding: '14px 16px', cursor: editing ? 'default' : 'pointer' }}
          >
            {/* Row 1: address + emoji chips + envelope + pencil + chevron */}
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: editing ? 12 : 3, gap: 6 }}>
              <div style={{ fontWeight: 700, fontSize: '0.97rem', color: C.textPrimary, flex: 1, minWidth: 0 }}>
                {dispAddr}
              </div>
              {!editing && (
                <>
                  {/* Emoji stat chips */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                    <EmojiChip emoji="👀" count={showings.length} color={C.gold} />
                    <EmojiChip emoji="🟢" count={active}          color={C.green} />
                    <EmojiChip emoji="🔴" count={closed}          color={C.red} />
                  </div>
                  {/* Mail badge */}
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0,
                    background: unreadCount > 0 ? C.red + '18' : 'transparent',
                    border: `1px solid ${unreadCount > 0 ? C.red + '44' : C.border}`,
                    borderRadius: 12, padding: '3px 8px', minWidth: 38, justifyContent: 'center',
                  }}>
                    <i className="ti ti-mail" style={{ fontSize: 14, color: unreadCount > 0 ? C.red : C.textMuted }} />
                    {unreadCount > 0 && (
                      <span style={{ fontSize: '0.72rem', fontWeight: 700, color: C.red, fontFamily: C.fontSans, lineHeight: 1 }}>
                        {unreadCount}
                      </span>
                    )}
                  </div>
                </>
              )}
              {/* Pencil edit button */}
              <button
                onClick={e => { e.stopPropagation(); setEditing(true); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 4px', color: editing ? C.gold : C.textMuted, fontSize: 14, lineHeight: 1, display: 'flex', alignItems: 'center', flexShrink: 0 }}
              ><i className="ti ti-pencil" /></button>
              {!editing && <Icon.Chevron size={14} color={C.textSecondary} down={expanded} />}
            </div>

            {editing ? (
              /* ── Inline edit form ── */
              <div onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                  {[
                    { label: 'Property Address', val: editAddr,   set: setEditAddr   },
                    { label: 'Zillow URL',        val: editZillow, set: setEditZillow, placeholder: 'https://www.zillow.com/homedetails/…' },
                  ].map(({ label, val, set, placeholder }) => (
                    <div key={label}>
                      <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>{label}</div>
                      <input value={val} onChange={e => set(e.target.value)} placeholder={placeholder} style={inputStyle} />
                    </div>
                  ))}
                  <div>
                    <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>Listing Agent</div>
                    <AgentSelect value={editAgent} onChange={setEditAgent} agents={agents} style={inputStyle} />
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                  <button onClick={handleSaveEdit}   style={{ flex: 1, padding: '9px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.82rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>Save</button>
                  <button onClick={handleCancelEdit} style={{ flex: 1, padding: '9px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.82rem', cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button>
                </div>
                <button
                  onClick={async (e) => {
                    e.stopPropagation();
                    if (!window.confirm('Archive this property? It will be hidden from the overview. You can restore it from Settings.')) return;
                    await DB.archiveProperty(property.id);
                    if (onArchive) onArchive(property.id);
                  }}
                  style={{ width: '100%', padding: '9px', background: 'none', color: C.red, border: `1px solid ${C.red}55`, borderRadius: 8, fontSize: '0.82rem', cursor: 'pointer', fontFamily: C.fontSans }}
                >
                  <i className="ti ti-archive" style={{ marginRight: 6, fontSize: 13 }} />
                  Archive Property
                </button>
              </div>
            ) : (
              <>
                {/* Row 2: Zillow link */}
                {dispZillow ? (
                  <div style={{ fontSize: '0.75rem', marginBottom: 2 }}>
                    <a href={dispZillow} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                       style={{ color: C.gold, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                      <i className="ti ti-external-link" style={{ fontSize: 12 }} />View on Zillow
                    </a>
                  </div>
                ) : null}
                {/* Row 3: listing agent */}
                {dispAgent ? (
                  <div style={{ fontSize: '0.73rem', color: C.textMuted }}>{dispAgent}</div>
                ) : null}
              </>
            )}
          </div>

          {/* Expanded showing list */}
          {expanded && !editing && (
            <div style={{ borderTop: `1px solid ${C.border}` }}>
              {showings.map(s => (
                <ShowingRow
                  key={s.id}
                  showing={s}
                  user={user}
                  isOpen={openShowingId === s.id}
                  onToggle={(forceOpen) => setOpenShowingId(cur =>
                    forceOpen ? s.id : (cur === s.id ? null : s.id)
                  )}
                />
              ))}
            </div>
          )}
        </div>
      );

    function StatChip({ value, label, color }) {
      return (
        <div style={{
          flex: 1, textAlign: 'center',
          background: C.surfaceHover, boxShadow: '0 1px 3px rgba(0,26,74,0.05)',
          borderRadius: 10, padding: '7px 4px',
        }}>
          <div style={{ fontSize: '1.3rem', fontWeight: 400, fontStyle: 'italic', color, fontFamily: C.fontDisplay }}>{value}</div>
          <div style={{ fontSize: '0.58rem', color: C.textSecondary, textTransform: 'uppercase', letterSpacing: '0.14em', marginTop: 1, fontFamily: C.fontSans }}>{label}</div>
        </div>
      );
    }

    function ShowingRow({ showing, isOpen = false, onToggle = () => {}, user }) {
      const [status,       setStatus]       = useState(showing.status);
      const [localThread,  setLocalThread]  = useState(() => SMS_THREADS[showing.id] || []);
      const [threadLoaded, setThreadLoaded] = useState(false);
      const [replyText,    setReplyText]    = useState('');
      const [editing,      setEditing]      = useState(false);

      // Load thread from DB when first expanded
      useEffect(() => {
        if (isOpen && !threadLoaded) {
          setThreadLoaded(true);
          DB.loadThread(showing.id).then(t => setLocalThread(t));
        }
      }, [isOpen]);
      const [editAgent,    setEditAgent]    = useState(showing.agent);
      const [editPhone,    setEditPhone]    = useState(showing.phone);
      const [editOffice,   setEditOffice]   = useState(showing.office);
      const [editDate,     setEditDate]     = useState(showing.date);
      const [editFeedback, setEditFeedback] = useState(showing.feedback || '');
      // Display values (updated on save)
      const [dispAgent,    setDispAgent]    = useState(showing.agent);
      const [dispPhone,    setDispPhone]    = useState(showing.phone);
      const [dispOffice,   setDispOffice]   = useState(showing.office);
      const [dispDate,     setDispDate]     = useState(showing.date);
      const [dispFeedback, setDispFeedback] = useState(showing.feedback || '');

      const hasUnread     = localThread.length > 0 && localThread[localThread.length - 1].dir === 'in';
      const inboundCount  = localThread.filter(m => m.dir === 'in').length;

      async function handleSend() {
        const txt = replyText.trim();
        if (!txt) return;
        const senderName = user?.user_metadata?.full_name || user?.email || 'You';
        setReplyText('');
        try {
          await DB.sendSms(showing.id, txt);                    // real text via Quo + logged
          setLocalThread(t => [...t, { dir: 'out', touch: null, time: 'Just now', body: txt, sentByName: senderName }]);
        } catch (e) {
          setReplyText(txt);                                    // restore so they can retry
          alert('Could not send the text: ' + (e.message || e));
        }
      }

      async function handleSaveEdit() {
        setDispAgent(editAgent); setDispPhone(editPhone);
        setDispOffice(editOffice); setDispDate(editDate);
        setDispFeedback(editFeedback);
        setEditing(false);
        await DB.updateShowing(showing.id, { agent: editAgent, phone: editPhone, office: editOffice, date: editDate, feedback: editFeedback });
      }

      function handleCancelEdit() {
        setEditAgent(dispAgent); setEditPhone(dispPhone);
        setEditOffice(dispOffice); setEditDate(dispDate);
        setEditFeedback(dispFeedback);
        setEditing(false);
      }

      const inputStyle = {
        width: '100%', padding: '7px 10px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.83rem', fontFamily: C.fontSans, outline: 'none',
      };

      return (
        <div style={{ borderBottom: `1px solid ${C.border}` }}>
          {/* Row header */}
          <div
            onClick={() => { if (!editing) onToggle(); }}
            style={{ display: 'flex', alignItems: 'center', padding: '12px 16px', cursor: 'pointer', gap: 10 }}
          >
            {/* Message icon + inbound count badge */}
            <div style={{ position: 'relative', flexShrink: 0 }}>
              <Icon.Msg size={15} color={inboundCount > 0 ? C.gold : C.textMuted} />
              {inboundCount > 0 && (
                <div style={{
                  position: 'absolute', top: -5, right: -7,
                  minWidth: 15, height: 15, borderRadius: 8,
                  background: C.red, border: `1.5px solid ${C.surface}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: '0.58rem', fontWeight: 700, color: '#fff',
                  fontFamily: C.fontSans, padding: '0 2px',
                }}>{inboundCount}</div>
              )}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '0.88rem', fontWeight: 500, color: C.textPrimary }}>{dispAgent}</div>
              <div style={{ fontSize: '0.72rem', color: C.textSecondary }}>{dispDate} · {dispPhone}</div>
              {dispFeedback ? (
                <div style={{ fontSize: '0.72rem', color: C.textSecondary, marginTop: 2 }}>
                  Feedback: <span style={{ fontStyle: 'italic', fontFamily: C.fontDisplay, fontSize: '0.82rem' }}>{dispFeedback}</span>
                </div>
              ) : null}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexShrink: 0 }}>
              {/* Pencil edit button */}
              <button
                onClick={e => { e.stopPropagation(); setEditing(true); onToggle(true); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 4px', color: C.textMuted, fontSize: 14, lineHeight: 1, display: 'flex', alignItems: 'center' }}
              ><i className="ti ti-pencil" /></button>
              {/* Status dropdown as pill */}
              <select
                value={status}
                onClick={e => e.stopPropagation()}
                onChange={e => { e.stopPropagation(); const v = e.target.value; setStatus(v); DB.updateShowing(showing.id, { status: v }); }}
                style={{
                  padding: '3px 8px',
                  border: `1px solid ${STATUS[status]?.color || '#888'}44`,
                  borderRadius: 20,
                  background: STATUS[status]?.bg || C.surfaceHover,
                  color: STATUS[status]?.color || C.textSecondary,
                  fontSize: '0.68rem', fontWeight: 600,
                  fontFamily: C.fontSans, outline: 'none', cursor: 'pointer',
                  appearance: 'none', WebkitAppearance: 'none',
                }}
              >
                <option value="in_progress">In Progress</option>
                <option value="closed">Closed</option>
              </select>
              <Icon.Chevron size={13} color={C.textSecondary} down={isOpen} />
            </div>
          </div>

          {/* Expanded panel */}
          {isOpen && (
            <div style={{ background: C.bg, borderTop: `1px solid ${C.border}`, padding: '12px 16px 16px' }}>

              {editing ? (
                /* ── Edit form ── */
                <div>
                  <div style={{ fontSize: '0.62rem', fontWeight: 600, color: C.navy, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10, fontFamily: C.fontSans }}>Edit Showing Details</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                    {[
                      { label: 'Agent Name', val: editAgent,  set: setEditAgent  },
                      { label: 'Phone',      val: editPhone,  set: setEditPhone  },
                      { label: 'Office',     val: editOffice, set: setEditOffice },
                      { label: 'Date / Time',val: editDate,   set: setEditDate   },
                    ].map(({ label, val, set }) => (
                      <div key={label}>
                        <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>{label}</div>
                        <input value={val} onChange={e => set(e.target.value)} style={inputStyle} />
                      </div>
                    ))}
                    <div>
                      <div style={{ fontSize: '0.65rem', color: C.textSecondary, marginBottom: 3, fontFamily: C.fontSans }}>Feedback</div>
                      <textarea
                        value={editFeedback}
                        onChange={e => setEditFeedback(e.target.value)}
                        placeholder="e.g. Loved the backyard, concerned about kitchen update"
                        rows={2}
                        style={{ ...inputStyle, resize: 'none', lineHeight: 1.5 }}
                      />
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={handleSaveEdit} style={{ flex: 1, padding: '9px', background: C.navy, color: '#fff', border: 'none', borderRadius: 8, fontSize: '0.82rem', fontWeight: 500, cursor: 'pointer', fontFamily: C.fontSans }}>Save</button>
                    <button onClick={handleCancelEdit} style={{ flex: 1, padding: '9px', background: 'none', color: C.textSecondary, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: '0.82rem', cursor: 'pointer', fontFamily: C.fontSans }}>Cancel</button>
                  </div>
                </div>
              ) : (
                /* ── Normal view ── */
                <div>
                  <div style={{ fontSize: '0.72rem', color: C.textMuted, marginBottom: 10 }}>{dispOffice}</div>
                  <SmsThread thread={localThread} />
                  {/* Spacer before reply box */}
                  <div style={{ marginTop: 20, paddingTop: 14, borderTop: `1px solid ${C.border}` }} />
                  <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
                    <textarea
                      rows={2}
                      placeholder="Type a reply…"
                      value={replyText}
                      onChange={e => setReplyText(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                      style={{
                        flex: 1, padding: '8px 12px', resize: 'none',
                        border: `1px solid ${C.border}`, borderRadius: 8,
                        background: C.surface, color: C.textPrimary,
                        fontSize: '0.85rem', fontFamily: C.fontSans,
                        outline: 'none', lineHeight: 1.5,
                      }}
                    />
                    <button
                      onClick={handleSend}
                      style={{
                        padding: '8px 14px', borderRadius: 8, border: 'none',
                        background: replyText.trim() ? C.navy : C.border,
                        color: replyText.trim() ? '#FFFFFF' : C.textMuted,
                        fontSize: '0.8rem', fontWeight: 500, cursor: 'pointer',
                        fontFamily: C.fontSans, transition: 'background 0.15s',
                        flexShrink: 0, alignSelf: 'stretch',
                      }}
                    >Send</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ─── Overview Tab ─────────────────────────────────────────────────
    function OverviewTab({ user, liveShowings, properties, onArchive }) {
      const firstName = user?.user_metadata?.full_name?.split(' ')[0] || user?.email?.split('@')[0] || 'there';

      return (
        <div style={{ padding: '20px 16px 100px' }}>
          {/* Greeting — hidden when embedded in TMG (the app name lives in the TMG header row) */}
          {!EMBED && (
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: '2.2rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, fontFamily: C.fontDisplay }}>Hi, {firstName}</div>
              <div style={{ fontSize: '0.7rem', color: C.textSecondary, marginTop: 4, letterSpacing: '0.16em', textTransform: 'uppercase', fontFamily: C.fontSans }}>Showing Feedback Follow-Up App</div>
            </div>

    // ─── Archived Properties (used in Settings) ──────────────────────
    function ArchivedProperties() {
      const [loaded,   setLoaded]   = useState(false);
      const [loading,  setLoading]  = useState(false);
      const [items,    setItems]    = useState([]);
      const [openId,   setOpenId]   = useState(null);
      const [threads,  setThreads]  = useState({});   // propId → showings[]
      const [showings, setShowings] = useState({});   // propId → showings[]

      async function load() {
        setLoading(true);
        const props = await DB.loadArchivedProperties();
        setItems(props);
        setLoaded(true);
        setLoading(false);
      }

      async function handleExpand(prop) {
        const id = prop.id;
        if (openId === id) { setOpenId(null); return; }
        setOpenId(id);
        // Load showings for this archived property if not yet loaded
        if (!showings[id]) {
          const client = DB.client();
          if (client) {
            const { data } = await client.from('showings').select('*')
              .eq('property_address', prop.address).order('created_at', { ascending: false });
            const mapped = (data || []).map(row => ({
              id: row.id, agent: row.agent_name, phone: row.agent_phone || '—',
              office: row.agent_office || '—', date: row.showing_date || '—',
              status: row.status,
            }));
            setShowings(prev => ({ ...prev, [id]: mapped }));
            // Pre-load all threads
            for (const s of mapped) {
              const thread = await DB.loadThread(s.id);
              setThreads(prev => ({ ...prev, [s.id]: thread }));
            }
          } else {
            // Mock: use SHOWINGS filtered by address
            const mock = SHOWINGS.filter(s => {
              const p = PROPERTIES.find(pr => pr.id === s.pid);
              return p?.address === prop.address;
            }).map(s => ({ id: s.id, agent: s.agent, phone: s.phone, office: s.office, date: s.date, status: s.status }));
            setShowings(prev => ({ ...prev, [id]: mock }));
            mock.forEach(s => setThreads(prev => ({ ...prev, [s.id]: SMS_THREADS[s.id] || [] })));
          }
        }
      }

      async function handleRestore(prop) {
        await DB.restoreProperty(prop.id);
        setItems(prev => prev.filter(p => p.id !== prop.id));
        if (openId === prop.id) setOpenId(null);
      }

      async function handleDeleteForever(prop) {
        if (!window.confirm(`Permanently delete "${prop.address}"? This cannot be undone.`)) return;
        await DB.deleteProperty(prop.id);
        setItems(prev => prev.filter(p => p.id !== prop.id));
        if (openId === prop.id) setOpenId(null);
      }

      if (!loaded) {
        return (
          <SectionCard title="Archived Properties" mb={14}>
            <div style={{ fontSize: '0.82rem', color: C.textSecondary, marginBottom: 14, lineHeight: 1.5 }}>
              Properties you've archived are stored here. You can restore or permanently delete them.
            </div>
            <button
              onClick={load}
              disabled={loading}
              style={{ width: '100%', padding: 12, background: 'none', border: `1px solid ${C.border}`, borderRadius: 12, color: C.navy, fontSize: '0.88rem', cursor: 'pointer', fontFamily: C.fontSans }}
            >
              {loading ? 'Loading…' : 'Load Archived Properties'}
            </button>
          </SectionCard>
        );
      }

      return (
        <SectionCard title="Archived Properties" mb={14}>
          {items.length === 0 ? (
            <div style={{ fontSize: '0.82rem', color: C.textMuted, textAlign: 'center', padding: '8px 0' }}>No archived properties.</div>
          ) : items.map(prop => {
            const isOpen   = openId === prop.id;
            const propShowings = showings[prop.id] || [];
            return (
              <div key={prop.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 10, overflow: 'hidden' }}>
                {/* Header row */}
                <div
                  onClick={() => handleExpand(prop)}
                  style={{ padding: '11px 14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}
                >
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: '0.9rem', fontWeight: 600, color: C.textPrimary }}>{prop.address}</div>
                    <div style={{ fontSize: '0.72rem', color: C.textSecondary, marginTop: 1, display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                      {prop.zillowUrl ? (
                        <a href={prop.zillowUrl} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                           style={{ color: C.gold, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 3 }}>
                          <i className="ti ti-external-link" style={{ fontSize: 11 }} />Zillow
                        </a>
                      ) : null}
                      {prop.zillowUrl && prop.agent ? <span>·</span> : null}
                      {prop.agent ? <span>{prop.agent}</span> : null}
                    </div>
                  </div>
                  <Icon.Chevron size={13} color={C.textSecondary} down={isOpen} />
                </div>

                {/* Action buttons + expanded showings */}
                {isOpen && (
                  <div style={{ borderTop: `1px solid ${C.border}`, padding: '12px 14px' }}>
                    {/* Restore / Delete Forever */}
                    <div style={{ display: 'flex', gap: 8, marginBottom: propShowings.length ? 14 : 0 }}>
                      <button
                        onClick={() => handleRestore(prop)}
                        style={{ flex: 1, padding: '8px', background: 'none', color: C.navy, border: `1px solid ${C.navy}55`, borderRadius: 8, fontSize: '0.8rem', cursor: 'pointer', fontFamily: C.fontSans, fontWeight: 500 }}
                      >
                        <i className="ti ti-refresh" style={{ marginRight: 5, fontSize: 12 }} />Restore
                      </button>
                      <button
                        onClick={() => handleDeleteForever(prop)}
                        style={{ flex: 1, padding: '8px', background: 'none', color: C.red, border: `1px solid ${C.red}55`, borderRadius: 8, fontSize: '0.8rem', cursor: 'pointer', fontFamily: C.fontSans }}
                      >
                        <i className="ti ti-trash" style={{ marginRight: 5, fontSize: 12 }} />Delete Forever
                      </button>
                    </div>

                    {/* Read-only showings */}
                    {propShowings.length > 0 && (
                      <div>
                        <div style={{ fontSize: '0.62rem', fontWeight: 600, color: C.navy, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, fontFamily: C.fontSans }}>
                          Showing History
                        </div>
                        {propShowings.map(s => {
                          const thread = threads[s.id] || [];
                          return (
                            <div key={s.id} style={{ background: C.bg, borderRadius: 8, padding: '10px 12px', marginBottom: 8 }}>
                              <div style={{ fontSize: '0.85rem', fontWeight: 500, color: C.textPrimary, marginBottom: 2 }}>{s.agent}</div>
                              <div style={{ fontSize: '0.72rem', color: C.textSecondary, marginBottom: thread.length ? 8 : 0 }}>{s.date} · {s.phone}</div>
                              {thread.length > 0 && <SmsThread thread={thread} />}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </SectionCard>
      );
    }

    // ─── Settings Tab ─────────────────────────────────────────────────

    // Renders a template body by replacing all placeholders with real values.
    // showing  → { agent_name, property_address }
    // property → { address, agent (listing agent name) }
    // user     → Supabase user object
    function renderTemplate(body, showing, property, user) {
      const agentFirst   = (showing?.agent_name  || '').split(' ')[0] || '{{agent_first_name}}';
      const streetAddr   = property?.address     || showing?.property_address || '{{address}}';
      const senderFirst  = ((user?.user_metadata?.full_name || '')).split(' ')[0] || '{{my_name}}';
      const listingAgent = property?.agent       || '{{listing_agent}}';
      const zillowUrl    = property?.zillowUrl    || '{{zillow_url}}';
      return body
        .replace(/\{\{agent_first_name\}\}/g, agentFirst)
        .replace(/\{\{address\}\}/g,          streetAddr)
        .replace(/\{\{my_name\}\}/g,          senderFirst)
        .replace(/\{\{listing_agent\}\}/g,    listingAgent)
        .replace(/\{\{zillow_url\}\}/g,       zillowUrl);
    }

    // Fixed Twilio sending number (A2P 10DLC registration pending).
    const TWILIO_PHONE = '(830) 283-6102';

    const SMS_TEMPLATE_DEFAULTS = [
      { touch: 1, day: 1, body: "Hi {{agent_first_name}}! This is {{my_name}} with The Morshed Group, reaching out on behalf of our listing agent {{listing_agent}}. Just following up on your showing at {{address}} — did your clients enjoy the property? Any feedback would be greatly appreciated! 🏡" },
      { touch: 2, day: 2, body: "Hi {{agent_first_name}}, this is {{my_name}} again from The Morshed Group — just checking back in on {{address}}. Did your clients have any thoughts they'd like to share? {{listing_agent}} would love to hear from you!" },
      { touch: 3, day: 3, body: "Hi {{agent_first_name}}, one last follow-up on {{address}}. Feel free to reach out anytime if your clients have questions for {{listing_agent}}. Thanks so much for showing the property!" },
    ];

    function SettingsTab({ user }) {
      const fullName = user?.user_metadata?.full_name || 'User';
      const email    = user?.email || '';
      const initial  = fullName.charAt(0).toUpperCase();

      const [templates,       setTemplates]       = useState(SMS_TEMPLATE_DEFAULTS.map(t => t.body));
      const [sendTime,        setSendTime]         = useState('');
      const [senderName,      setSenderName]       = useState('');
      const [tmplSaving,      setTmplSaving]      = useState(false);
      const [tmplSaved,       setTmplSaved]       = useState(false);
      const [twilioSaving,    setTwilioSaving]    = useState(false);
      const [twilioSaved,     setTwilioSaved]     = useState(false);

      useEffect(() => {
        DB.loadTemplates().then(bodies => setTemplates(bodies));
        DB.loadSettings().then(s => { setSendTime(s.sendTime); setSenderName(s.senderName); });
      }, []);

      async function handleSaveTemplates() {
        setTmplSaving(true); setTmplSaved(false);
        try {
          await DB.saveTemplates(templates, user);
          setTmplSaved(true);
          setTimeout(() => setTmplSaved(false), 3000);
        } catch(e) { console.error('[Settings] saveTemplates:', e.message); }
        finally { setTmplSaving(false); }
      }

      async function handleSaveTwilio() {
        setTwilioSaving(true); setTwilioSaved(false);
        try {
          await DB.saveSettings({ twilioPhone: TWILIO_PHONE, sendTime, senderName }, user);
          setTwilioSaved(true);
          setTimeout(() => setTwilioSaved(false), 3000);
        } catch(e) { console.error('[Settings] saveSettings:', e.message); }
        finally { setTwilioSaving(false); }
      }

      return (
        <div style={{ padding: '20px 16px 100px', overflowY: 'auto', height: '100%' }}>
          <div style={{ fontSize: '1.5rem', fontWeight: 400, fontStyle: 'italic', color: C.navy, marginBottom: 24, fontFamily: C.fontDisplay }}>Settings</div>

          {/* Account */}
          <SectionCard title="Account" mb={14}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
              <div style={{ width: 44, height: 44, borderRadius: '50%', background: C.navy, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.goldSoft, fontWeight: 300, fontSize: '1.2rem', fontFamily: C.fontSans, flexShrink: 0 }}>
                {initial}
              </div>
              <div>
                <div style={{ color: C.textPrimary, fontWeight: 600, fontSize: '0.95rem' }}>{fullName}</div>
                <div style={{ color: C.textSecondary, fontSize: '0.8rem', marginTop: 2 }}>{email}</div>
              </div>
            </div>
            <ActionButton label="Sign out" danger onClick={() => window.SupabaseAuth.signOut()} />
          </SectionCard>

          {/* SMS Templates */}
          <SectionCard title="SMS Follow-up Templates" mb={14}>
            <div style={{ fontSize: '0.78rem', color: C.textSecondary, marginBottom: 14, lineHeight: 1.8 }}>
              Available placeholders:{' '}
              <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{agent_first_name}}'}</span>{' · '}
              <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{address}}'}</span>{' · '}
              <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{my_name}}'}</span>{' · '}
              <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{listing_agent}}'}</span>{' · '}
              <span style={{ color: C.gold, fontFamily: 'monospace' }}>{'{{zillow_url}}'}</span>
            </div>
            {SMS_TEMPLATE_DEFAULTS.map((t, i) => (
              <div key={t.touch} style={{ marginBottom: i < 2 ? 14 : 0 }}>
                <div style={{ fontSize: '0.62rem', fontWeight: 500, color: C.navy, letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 6, fontFamily: C.fontSans }}>
                  Follow-up {t.touch} · Day {t.day}
                </div>
                <textarea
                  value={templates[i]}
                  onChange={e => { const n = [...templates]; n[i] = e.target.value; setTemplates(n); }}
                  rows={3}
                  style={{
                    width: '100%', background: C.bg, border: `1px solid ${C.border}`,
                    borderRadius: 10, padding: '10px 12px', color: C.textPrimary,
                    fontSize: '0.83rem', lineHeight: 1.6, resize: 'none',
                    fontFamily: C.fontSans, outline: 'none',
                  }}
                />
              </div>
            ))}
            <div style={{ marginTop: 14 }}>
              <ActionButton
                label={tmplSaving ? 'Saving…' : tmplSaved ? 'Saved ✓' : 'Save Templates'}
                onClick={handleSaveTemplates}
              />
            </div>
          </SectionCard>

          {/* Twilio */}
          <SectionCard title="Twilio SMS" mb={14}>
            <div style={{ fontSize: '0.83rem', color: C.textSecondary, lineHeight: 1.6, marginBottom: 14 }}>
              SMS send configuration. Set up your Twilio account to activate automated follow-ups.
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <SettingsField label="Twilio Phone Number" value={TWILIO_PHONE} readOnly badge="Pending" />
              <SettingsField label="Send Time (local)" placeholder="10:00 AM Central" value={sendTime} onChange={e => setSendTime(e.target.value)} />
              <SettingsField
                label="Sender Name ({{my_name}} in templates)"
                placeholder="e.g. Alexa"
                value={senderName}
                onChange={e => setSenderName(e.target.value)}
              />
            </div>
            <div style={{ marginTop: 14 }}>
              <ActionButton
                label={twilioSaving ? 'Saving…' : twilioSaved ? 'Saved ✓' : 'Save Twilio Config'}
                onClick={handleSaveTwilio}
              />
            </div>
          </SectionCard>

          {/* Archived Properties */}
          <ArchivedProperties />
        </div>
      );
    }

    function SectionCard({ title, children, mb = 0 }) {
      return (
        <div style={{
          background: C.surface, boxShadow: '0 2px 8px rgba(0,26,74,0.07), 0 1px 2px rgba(0,26,74,0.04)',
          borderRadius: 14, padding: 16, marginBottom: mb,
        }}>
          <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.navy, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 14, fontFamily: C.fontSans }}>
            {title}
          </div>
          {children}
        </div>
      );
    }

    function ActionButton({ label, onClick, danger = false }) {
      return (
        <button onClick={onClick} style={{
          width: '100%', padding: 12,
          background: danger ? 'none' : C.navy,
          border: `1px solid ${danger ? C.red : C.navy}`,
          borderRadius: 12, color: danger ? C.red : '#FFFFFF',
          fontSize: '15px', cursor: 'pointer', fontWeight: 500,
          fontFamily: C.fontSans,
        }}>
          {label}
        </button>
      );
    }

    function SettingsField({ label, placeholder, value, onChange, readOnly = false, badge = null }) {
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
            <div style={{ fontSize: '0.72rem', fontWeight: 600, color: C.textSecondary }}>{label}</div>
            {badge && (
              <span style={{
                fontSize: '0.6rem', fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase',
                color: C.gold, background: `${C.gold}1A`, border: `1px solid ${C.gold}55`,
                borderRadius: 6, padding: '1px 7px', fontFamily: C.fontSans,
              }}>{badge}</span>
            )}
          </div>
          <input
            placeholder={placeholder}
            value={value || ''}
            onChange={onChange}
            readOnly={readOnly}
            tabIndex={readOnly ? -1 : undefined}
            style={{
              width: '100%', padding: '10px 12px',
              background: readOnly ? C.bg : C.surfaceHover,
              border: `1px solid ${C.border}`, borderRadius: 10,
              color: readOnly ? C.textSecondary : C.textPrimary,
              fontSize: '0.87rem', outline: 'none', fontFamily: C.fontSans,
              cursor: readOnly ? 'default' : 'text',
            }}
          />
        </div>
      );
    }

    // ─── Add Property Modal ───────────────────────────────────────────
    function AddPropertyModal({ onClose, onAdd, user }) {
      const [address,   setAddress]   = useState('');
      const [zillowUrl, setZillowUrl] = useState('');
      const [agent,     setAgent]     = useState('');
      const [agents,    setAgents]    = useState([]);
      useEffect(() => { DB.loadAgents().then(setAgents); }, []);

      const inputStyle = {
        width: '100%', padding: '9px 12px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.88rem', fontFamily: C.fontSans, outline: 'none',
      };
      const labelStyle = {
        fontSize: '0.65rem', color: C.textSecondary, marginBottom: 4,
        fontFamily: C.fontSans, textTransform: 'uppercase', letterSpacing: '0.1em',
      };

      async function handleSubmit() {
        if (!address.trim()) return;
        const formData = { address: address.trim(), zillowUrl: zillowUrl.trim(), agent: agent.trim() };
        try {
          const newProperty = await DB.insertProperty(formData, user);
          onAdd(newProperty);
          onClose();
        } catch (e) {
          console.error('[AddProperty]', e);
          alert('Failed to save property. Please try again.');
        }
      }

      return (
        <>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,26,74,0.45)' }} />
          <div style={{
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 301,
            background: C.surface, borderRadius: '20px 20px 0 0',
            padding: '24px 20px 40px',
            boxShadow: '0 -4px 32px rgba(0,26,74,0.15)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ fontSize: '1.2rem', fontStyle: 'italic', fontFamily: C.fontDisplay, color: C.navy }}>Add Property</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, color: C.textMuted, fontSize: 20, display: 'flex' }}>
                <i className="ti ti-x" />
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div>
                <div style={labelStyle}>Property Address *</div>
                <input value={address} onChange={e => setAddress(e.target.value)} placeholder="e.g. 1808 Forest Hill Dr, Austin TX" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Zillow URL</div>
                <input value={zillowUrl} onChange={e => setZillowUrl(e.target.value)} placeholder="https://www.zillow.com/homedetails/…" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Listing Agent</div>
                <AgentSelect value={agent} onChange={setAgent} agents={agents} style={inputStyle} />
              </div>
            </div>

            <button
              onClick={handleSubmit}
              style={{
                marginTop: 20, width: '100%', padding: 14,
                background: address.trim() ? C.navy : C.border,
                color: address.trim() ? '#fff' : C.textMuted,
                border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 500,
                cursor: address.trim() ? 'pointer' : 'default',
                fontFamily: C.fontSans, transition: 'background 0.15s',
              }}
            >Add Property</button>
          </div>
        </>
      );
    }

    // ─── Add Showing Modal ────────────────────────────────────────────
    function AddShowingModal({ onClose, onAdd, user, properties }) {
      const [pid,      setPid]      = useState((properties || PROPERTIES)[0]?.id || '');
      const [agent,    setAgent]    = useState('');
      const [phone,    setPhone]    = useState('');
      const [office,   setOffice]   = useState('');
      const [date,     setDate]     = useState('');
      const [pasteRow, setPasteRow] = useState('');
      const [parsed,   setParsed]   = useState(false);

      function parseSupraRow(text) {
        // Supra table copies as tab-separated: Date | Key Serial | Keyholder | Phone | Office | Office Phone
        const parts = text.trim().split('\t').map(s => s.trim());
        if (parts.length < 5) return null;
        const datePart = (parts[0] || '').split(' ')[0]; // "5/27/2026"
        let dateStr = '';
        if (datePart && datePart.includes('/')) {
          const [m, d, y] = datePart.split('/');
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const mIdx = parseInt(m, 10) - 1;
          if (months[mIdx]) dateStr = `${months[mIdx]} ${parseInt(d, 10)}, ${y}`;
        }
        return {
          date:   dateStr,
          agent:  parts[2] || '',
          phone:  parts[3] || '',
          office: parts[4] || '',
        };
      }

      function handlePaste(text) {
        setPasteRow(text);
        setParsed(false);
        const result = parseSupraRow(text);
        if (result) {
          if (result.agent)  setAgent(result.agent);
          if (result.phone)  setPhone(result.phone);
          if (result.office) setOffice(result.office);
          if (result.date)   setDate(result.date);
          setParsed(true);
        }
      }

      const inputStyle = {
        width: '100%', padding: '9px 12px',
        border: `1px solid ${C.border}`, borderRadius: 8,
        background: C.surface, color: C.textPrimary,
        fontSize: '0.88rem', fontFamily: C.fontSans, outline: 'none',
      };
      const labelStyle = {
        fontSize: '0.65rem', color: C.textSecondary, marginBottom: 4,
        fontFamily: C.fontSans, textTransform: 'uppercase', letterSpacing: '0.1em',
      };

      async function handleSubmit() {
        if (!agent.trim()) return;
        const property = (properties || PROPERTIES).find(p => p.id === pid) || getProperty(pid);
        const formData = { pid, agent: agent.trim(), phone: phone.trim(), office: office.trim(), date: date.trim() };
        try {
          const newShowing = await DB.insertShowing(formData, property, user);
          onAdd(newShowing);
          onClose();
        } catch (e) {
          console.error('[AddShowing]', e);
          alert('Failed to save showing. Please try again.');
        }
      }

      return (
        <>
          <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,26,74,0.45)' }} />
          <div style={{
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 301,
            background: C.surface, borderRadius: '20px 20px 0 0',
            padding: '24px 20px 40px',
            boxShadow: '0 -4px 32px rgba(0,26,74,0.15)',
          }}>
            {/* Header */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ fontSize: '1.2rem', fontStyle: 'italic', fontFamily: C.fontDisplay, color: C.navy }}>Add Showing</div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, color: C.textMuted, fontSize: 20, display: 'flex' }}>
                <i className="ti ti-x" />
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {/* Supra paste box */}
              <div>
                <div style={labelStyle}>Paste Supra Row <span style={{ color: C.textMuted, textTransform: 'none', letterSpacing: 0, fontSize: '0.6rem' }}>(optional — auto-fills fields below)</span></div>
                <textarea
                  value={pasteRow}
                  onChange={e => handlePaste(e.target.value)}
                  placeholder="Copy a row from SupraWEB and paste here"
                  rows={2}
                  style={{
                    ...inputStyle, resize: 'none', lineHeight: 1.5,
                    background: parsed ? '#F0FAF4' : C.surface,
                    borderColor: parsed ? '#1E6B40' : C.border,
                    transition: 'border-color 0.2s, background 0.2s',
                  }}
                />
                {parsed && (
                  <div style={{ fontSize: '0.68rem', color: C.green, marginTop: 4, display: 'flex', alignItems: 'center', gap: 4 }}>
                    <i className="ti ti-circle-check" style={{ fontSize: 13 }} />
                    Fields filled below — review and edit if needed
                  </div>
                )}
              </div>
              <div style={{ height: 1, background: C.border }} />
              {/* Property select */}
              <div>
                <div style={labelStyle}>Property</div>
                <select value={pid} onChange={e => setPid(e.target.value)} style={{ ...inputStyle, appearance: 'none', WebkitAppearance: 'none' }}>
                  {(properties || PROPERTIES).map(p => <option key={p.id} value={p.id}>{p.address}</option>)}
                </select>
              </div>
              <div>
                <div style={labelStyle}>Agent Name *</div>
                <input value={agent} onChange={e => setAgent(e.target.value)} placeholder="e.g. Jane Smith" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Phone</div>
                <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. (512) 555-1234" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Brokerage / Office</div>
                <input value={office} onChange={e => setOffice(e.target.value)} placeholder="e.g. Compass RE Texas" style={inputStyle} />
              </div>
              <div>
                <div style={labelStyle}>Date &amp; Time</div>
                <input value={date} onChange={e => setDate(e.target.value)} placeholder="e.g. Jun 7, 10:30 AM" style={inputStyle} />
              </div>
            </div>

            <button
              onClick={handleSubmit}
              style={{
                marginTop: 20, width: '100%', padding: 14,
                background: agent.trim() ? C.navy : C.border,
                color: agent.trim() ? '#fff' : C.textMuted,
                border: 'none', borderRadius: 12, fontSize: '0.9rem', fontWeight: 500,
                cursor: agent.trim() ? 'pointer' : 'default',
                fontFamily: C.fontSans, transition: 'background 0.15s',
              }}
            >Add Showing</button>
          </div>
        </>
      );
    }

    // ─── Bottom Nav (floating pill) ──────────────────────────────────
    const TABS = [
      { id: 'overview', label: 'Overview', icon: 'ti-layout-grid' },
      { id: 'settings', label: 'Settings', icon: 'ti-settings'    },
    ];

    function BottomNav({ active, onChange, dark }) {
      return (
        <nav style={{
          position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50,
          background: dark ? '#000D26' : '#FCFBF8',
          borderTop: dark ? 'none' : '1px solid #E4DFD4',
          display: 'flex', justifyContent: 'center',
          padding: `8px 16px calc(8px + env(safe-area-inset-bottom))`,
        }}>
          {/* Pill container */}
          <div style={{
            display: 'flex', alignItems: 'center',
            background: dark ? '#0A1E44' : '#001A4A',
            borderRadius: 40, padding: 4, gap: 2,
          }}>
            {TABS.map(({ id, label, icon }) => {
              const isActive = active === id;
              return (
                <button key={id} onClick={() => onChange(id)} style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  justifyContent: 'center', gap: 2,
                  padding: '7px 20px', borderRadius: 30, border: 'none', cursor: 'pointer',
                  background: isActive ? '#AD832F' : (dark ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.32)'),
                  transition: 'background 0.2s ease',
                }}>
                  <i className={`ti ${icon}`} style={{ fontSize: 14, display: 'block', color: '#FFFFFF', lineHeight: 1 }} />
                  <span style={{
                    fontSize: 8, fontFamily: "'Jost', sans-serif",
                    letterSpacing: '0.14em', fontWeight: 500,
                    textTransform: 'uppercase', color: '#FFFFFF',
                  }}>{label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // ─── Top Bar ──────────────────────────────────────────────────────
    function TopBar({ dark, onToggleDark, onAddProperty, onAddShowing, onSettings }) {
      const iconBtn = (onClick, iconClass, title) => (
        <button
          onClick={onClick}
          title={title}
          style={{
            background: 'none', border: 'none', cursor: 'pointer',
            padding: '4px 7px', color: 'rgba(255,255,255,0.65)',
            fontSize: 18, lineHeight: 1, display: 'flex', alignItems: 'center',
          }}
        >
          <i className={iconClass} />
        </button>
      );
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '12px 16px', paddingTop: 'calc(12px + env(safe-area-inset-top))',
          background: 'rgba(0,26,74,0.88)', backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderBottom: '1px solid rgba(255,255,255,0.08)', flexShrink: 0,
        }}>
          <div style={{ fontSize: '0.95rem', fontWeight: 300, color: C.goldSoft, letterSpacing: '0.26em', textTransform: 'uppercase', fontFamily: C.fontSans }}>SFFU APP</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
            {iconBtn(onToggleDark,   dark ? 'ti ti-sun' : 'ti ti-moon', dark ? 'Light mode' : 'Dark mode')}
            <div style={{ width: 1, height: 16, background: 'rgba(255,255,255,0.15)', margin: '0 4px' }} />
            {iconBtn(onAddProperty,  'ti ti-home-plus',    'Add Property')}
            {iconBtn(onAddShowing,   'ti ti-calendar-plus','Add Showing')}
            {iconBtn(onSettings,     'ti ti-settings',     'Settings')}
          </div>
        </div>
      );
    }

    // ─── Root App ─────────────────────────────────────────────────────
    function App({ user }) {
      const [activeTab,          setActiveTab]          = useState('overview');
      const [showAddModal,       setShowAddModal]       = useState(false);
      const [showAddPropModal,   setShowAddPropModal]   = useState(false);
      const [liveShowings,       setLiveShowings]       = useState([]);
      const [liveProperties,     setLiveProperties]     = useState(PROPERTIES);
      const [dark, setDark] = useState(() => EMBED_THEME ? EMBED_THEME === 'dark' : localStorage.getItem('sffu-theme') === 'dark');

      // Load showings and properties from DB on mount
      useEffect(() => {
        DB.loadShowings().then(data => setLiveShowings(data));
        DB.loadProperties().then(data => setLiveProperties(data));
      }, []);

      useEffect(() => {
        document.body.classList.toggle('dark', dark);
        localStorage.setItem('sffu-theme', dark ? 'dark' : 'light');
      }, [dark]);

      // When embedded in TMG, the header-row buttons drive these actions via postMessage.
      useEffect(() => {
        if (!EMBED) return;
        const onMsg = (e) => {
          if (e.origin !== location.origin || !e.data || e.data.tmg !== 'sffu') return;
          if (e.data.action === 'add-property') setShowAddPropModal(true);
          else if (e.data.action === 'add-showing') setShowAddModal(true);
          else if (e.data.action === 'toggle-settings') setActiveTab(t => t === 'settings' ? 'overview' : 'settings');
        };
        window.addEventListener('message', onMsg);
        return () => window.removeEventListener('message', onMsg);
      }, []);

      function handleShowingAdded(newShowing) {
        setLiveShowings(prev => [newShowing, ...prev]);
      }

      function handlePropertyAdded(newProperty) {
        setLiveProperties(prev => [newProperty, ...prev]);
      }

      function handlePropertyArchived(propId) {
        setLiveProperties(prev => prev.filter(p => p.id !== propId));
      }

      return (
        <div style={{ height: '100%', background: dark ? '#000D26' : C.bg, display: 'flex', flexDirection: 'column', color: C.textPrimary, transition: 'background 0.2s ease' }}>
          {!EMBED && (
            <TopBar
              dark={dark}
              onToggleDark={() => setDark(d => !d)}
              onAddProperty={() => setShowAddPropModal(true)}
              onAddShowing={() => setShowAddModal(true)}
              onSettings={() => setActiveTab('settings')}
            />
          )}
          <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {activeTab === 'overview' && <OverviewTab user={user} liveShowings={liveShowings} properties={liveProperties} onArchive={handlePropertyArchived} />}
            {activeTab === 'settings' && <SettingsTab user={user} />}
          </div>
          {!EMBED && <BottomNav active={activeTab} onChange={setActiveTab} dark={dark} />}
          {showAddPropModal && (
            <AddPropertyModal
              onClose={() => setShowAddPropModal(false)}
              onAdd={handlePropertyAdded}
              user={user}
            />
          )}
          {showAddModal && (
            <AddShowingModal
              onClose={() => setShowAddModal(false)}
              onAdd={handleShowingAdded}
              user={user}
              properties={liveProperties}
            />
          )}
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────
    (function mount() {
      const root = ReactDOM.createRoot(document.getElementById('root'));

      function showSignin()   { document.getElementById('auth-signin').style.display = 'flex'; document.getElementById('auth-rejected').style.display = 'none'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function showRejected() { document.getElementById('auth-signin').style.display = 'none'; document.getElementById('auth-rejected').style.display = 'flex'; document.getElementById('auth-overlay').style.display = 'flex'; }
      function hideOverlay()  { document.getElementById('auth-overlay').style.display = 'none'; }

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
        root.render(<App user={window.SupabaseAuth._state.session?.user} />);
        hideOverlay();
        return;
      }

      window.SupabaseAuth.onAuthStateChange(function({ session }) {
        if (!session) { showSignin(); return; }
        root.render(<App user={session.user} />);
        hideOverlay();
      });
    })();
  </script>
</body>
</html>
