<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMG App</title>
  <!--
    Single Page Apps for GitHub Pages — MIT (github.com/rafgraph/spa-github-pages).
    GitHub Pages serves this file for any path that isn't a real file (e.g.
    /guide/get-started). It re-encodes the path into a query and redirects to the
    app root, where a matching snippet in index.html's <head> restores the real URL
    so the SPA can route to it. pathSegmentsToKeep = 0 because the app is served at
    the domain root (app.themorshedgroup.com/).
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
